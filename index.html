<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Integrated Learning Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================ design system ============================
     Integrated Learning Plan: warm paper, deep ink, one teal accent.
     Display serif: Fraunces. Body: Inter. All colors flow through the
     variables below; dark mode is the same variables under
     prefers-color-scheme. See README.md, "Design system". */
  :root {
    --bg:#faf7f1; --surface:#fffdf8; --surface-muted:#f2ecdf;
    --ink:#1b2330; --muted:#626c7a;
    --line:#e3dbc9; --line-strong:#cfc4ab;
    --accent:#17635a; --accent-strong:#0e4c44; --accent-soft:#e2efeb; --accent-ink:#ffffff;
    --good:#1e7d46; --good-soft:#e7f3ea; --good-line:#a9d6ba;
    --bad:#b3372e; --bad-soft:#faebe9; --bad-line:#eba79f;
    --warn:#8a6d1a; --warn-soft:#faf3d9; --warn-line:#e3d193;
    --stage-bg:#eef0e9;
    --shadow-sm:0 1px 2px rgba(27,35,48,.05), 0 2px 10px rgba(27,35,48,.04);
    --shadow-md:0 2px 4px rgba(27,35,48,.05), 0 14px 34px rgba(27,35,48,.09);
    --ring:0 0 0 3px var(--accent-soft);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#10151c; --surface:#171e28; --surface-muted:#1f2833;
      --ink:#ece9e1; --muted:#9aa6b2;
      --line:#2a3442; --line-strong:#3d4a5c;
      --accent:#5fc2ae; --accent-strong:#93dcc9; --accent-soft:#16302a; --accent-ink:#0a2420;
      --good:#7bc794; --good-soft:#17301f; --good-line:#2e5c3e;
      --bad:#e08a81; --bad-soft:#3a1f1c; --bad-line:#6e3a34;
      --warn:#d9bc6a; --warn-soft:#33290f; --warn-line:#5f4d1c;
      --stage-bg:#232d38;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25);
      --shadow-md:0 2px 4px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--bg);
         font-family:"Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         font-size:18px; line-height:1.6; font-variant-numeric:tabular-nums;
         -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--accent-soft); }

  /* header */
  header.site { position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
                background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent);
                backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  header.site .wrap { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding-top:13px; padding-bottom:13px; }
  header.site a { color:var(--ink); text-decoration:none; }
  header.site .brand { display:inline-flex; align-items:center; font-family:"Fraunces", Georgia, "Times New Roman", serif;
                       font-weight:600; font-size:21px; letter-spacing:.01em; margin-right:8px; }
  header.site .brand::before { content:""; width:9px; height:9px; border-radius:3px; background:var(--accent);
                               transform:rotate(45deg); margin-right:11px; flex:none; }
  header.site nav { display:flex; gap:2px; flex-wrap:wrap; align-items:center; }
  header.site nav a { color:var(--muted); font-size:15px; font-weight:500; padding:6px 11px; border-radius:999px;
                      transition:color .15s ease, background .15s ease; }
  header.site nav a:hover { color:var(--accent-strong); background:var(--accent-soft); }

  /* notifications bell */
  .bell { margin-left:auto; position:relative; flex:none; width:42px; height:42px; border-radius:999px;
          display:inline-flex; align-items:center; justify-content:center;
          border:1px solid var(--line); background:var(--surface); color:var(--ink);
          transition:color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .bell:hover { color:var(--accent-strong); border-color:var(--line-strong); box-shadow:var(--shadow-sm); }
  .bellbadge { position:absolute; top:-5px; right:-5px; min-width:20px; height:20px; padding:0 5px;
               border-radius:999px; background:var(--bad); color:#fff; font-size:12px; font-weight:700;
               display:flex; align-items:center; justify-content:center; border:2px solid var(--surface); }

  /* course toggle: one pill track, a thumb that slides between classes */
  .seg { position:relative; display:flex; gap:2px; flex:1 1 auto; min-width:0;
         background:var(--surface-muted); border:1px solid var(--line); border-radius:999px;
         padding:3px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
         -webkit-overflow-scrolling:touch; touch-action:pan-y;
         user-select:none; -webkit-user-select:none; }
  .seg a { -webkit-user-drag:none; }
  .seg::-webkit-scrollbar { display:none; }
  .seg-thumb { position:absolute; top:3px; bottom:3px; left:0; width:0; border-radius:999px;
               background:var(--accent); box-shadow:var(--shadow-sm); opacity:0;
               transition:transform .28s cubic-bezier(.3,.7,.3,1), width .28s cubic-bezier(.3,.7,.3,1), opacity .2s ease; }
  .seg a { position:relative; z-index:1; flex:1 0 auto; text-align:center; white-space:nowrap;
           padding:7px 12px; border-radius:999px; font-size:14.5px; font-weight:600;
           color:var(--muted); text-decoration:none; transition:color .2s ease; }
  .seg a:hover { color:var(--accent-strong); }
  .seg a.active { color:var(--accent-ink); }
  @media (max-width:640px){
    .seg { flex-basis:100%; order:3; }
    .seg a { padding:9px 6px; font-size:0; }
    .seg a::after { content:attr(data-short); font-size:13.5px; }
  }

  /* notebook */
  .nbtools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0 8px; }
  .nbswatch { width:34px; height:34px; border-radius:999px; padding:0; border:2px solid var(--line);
              box-shadow:inset 0 0 0 2px var(--surface); flex:none; }
  .nbswatch.cur { border-color:var(--ink); transform:scale(1.08); }
  .nbtoolcur { background:var(--accent) !important; color:var(--accent-ink) !important; border-color:var(--accent) !important; }
  .nbsheetwrap { margin-top:10px; border-radius:10px; overflow:hidden; border:1px solid var(--line-strong);
                 box-shadow:var(--shadow-md); background:#fffdf8; }

  /* file library */
  .filerow { display:flex; gap:12px; align-items:baseline; padding:8px 0; flex-wrap:wrap; }
  .filerow + .filerow { border-top:1px solid var(--line); }
  .filerow .fname, .filerow button.fname { flex:1 1 240px; font-weight:600; overflow-wrap:break-word; text-align:left; }
  .filerow button.fname { background:none; border:none; box-shadow:none; padding:0; margin:0; color:var(--ink); border-radius:0; }
  .filerow button.fname:hover { background:none; color:var(--accent-strong); transform:none; box-shadow:none; text-decoration:underline; }
  .filerow .fmeta { color:var(--muted); font-size:13.5px; white-space:nowrap; }
  .filerow a { font-weight:600; font-size:14.5px; white-space:nowrap; }
  .filerow a.dlbtn, .filerow button.viewbtn { border:1px solid var(--line-strong); background:var(--surface); color:var(--accent);
                     padding:7px 14px; border-radius:999px; font-size:14px; text-decoration:none;
                     box-shadow:var(--shadow-sm); }
  .filerow button.viewbtn { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .filerow a.dlbtn:hover, .filerow button.viewbtn:hover { background:var(--accent-strong); border-color:var(--accent-strong); color:var(--accent-ink); transform:none; }
  .libview { position:fixed; inset:0; z-index:40; display:none; padding:16px; overflow:auto; background:rgba(27,35,48,.5); }
  .libview.open { display:flex; justify-content:center; align-items:flex-start; }
  .libview-card { background:var(--surface); color:var(--ink); width:min(960px, 100%); border-radius:16px;
                  border:1px solid var(--line); box-shadow:var(--shadow-md); padding:16px 16px 20px; }
  .libview iframe, .libview video { display:block; width:100%; height:72vh; border:0; border-radius:12px; background:#fff; }
  .libview pre.filebody { max-height:72vh; overflow:auto; white-space:pre-wrap; word-break:break-word;
                          background:var(--surface-muted); border:1px solid var(--line); border-radius:12px;
                          padding:14px 16px; font-size:14.5px; line-height:1.5; }
  .libview .mdview, .libview .ziplist { max-height:72vh; overflow:auto; }
  .libview img { max-width:100%; height:auto; border-radius:8px; }
  .libview .nbcode { margin:8px 0; }
  .libview .nbout { margin:0 0 14px; font-size:13.5px; }
  body.libopen { overflow:hidden; }
  @media (max-width:640px) {
    .libview { padding:8px; }
    .libview iframe, .libview video, .libview pre.filebody, .libview .mdview, .libview .ziplist { height:62vh; max-height:62vh; }
  }
  #nbcanvas { display:block; width:100%; height:auto; touch-action:none; cursor:crosshair; }

  .wrap { max-width:840px; margin:0 auto; padding:26px 20px 64px; }

  /* type */
  h1, h2 { font-family:"Fraunces", Georgia, "Times New Roman", serif; font-weight:600; letter-spacing:-.01em; }
  h1 { font-size:35px; line-height:1.15; margin:8px 0 8px; }
  h2 { font-size:25px; line-height:1.25; margin:34px 0 10px; }
  h3 { font-family:"Fraunces", Georgia, "Times New Roman", serif; font-weight:600; font-size:20px; line-height:1.3; margin:22px 0 6px; }
  p { margin:9px 0; }
  .muted { color:var(--muted); font-size:16px; }
  .small { font-size:15px; }
  a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px; transition:color .15s ease; }
  a:hover { color:var(--accent-strong); }
  strong { font-weight:600; }

  /* cards */
  .card { border:1px solid var(--line); border-radius:16px; padding:22px 24px; margin:16px 0;
          background:var(--surface); box-shadow:var(--shadow-sm);
          transition:box-shadow .2s ease, border-color .2s ease; animation:fadeUp .28s ease both; }
  .card:hover { box-shadow:var(--shadow-md); border-color:var(--line-strong); }
  .card h3 { margin-top:0; }
  .setup { background:var(--accent-soft); border-color:var(--line-strong); border-left:4px solid var(--accent); }
  .bar { height:10px; background:var(--surface-muted); border-radius:999px; overflow:hidden; margin:10px 0 5px;
         box-shadow:inset 0 1px 2px rgba(27,35,48,.08); }
  .bar > div { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--accent-strong));
               transition:width .6s ease; }

  /* progress pills: content (teal) and time to final (amber) */
  .pills { margin:12px 0 4px; display:grid; gap:8px; }
  .pillrow { display:flex; align-items:center; gap:10px; }
  .pillabel { font-size:12.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
              color:var(--muted); flex:0 0 118px; }
  .pill { flex:1; height:12px; border-radius:999px; background:var(--surface-muted);
          border:1px solid var(--line); overflow:hidden;
          box-shadow:inset 0 1px 2px rgba(27,35,48,.08); }
  .pill > div { height:100%; border-radius:999px; transition:width .6s ease; }
  .pill .fc { background:linear-gradient(90deg, var(--accent), var(--accent-strong)); }
  .pill .ft { background:linear-gradient(90deg, var(--warn-line), var(--warn)); }
  .pillpct { font-size:14px; font-weight:600; flex:0 0 42px; text-align:right; }
  @media (max-width:640px){ .pillabel { flex-basis:96px; } }

  /* badges */
  .badge { display:inline-block; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
           padding:3px 9px; border-radius:999px; vertical-align:middle; }
  .badge.prov { background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line); }
  .badge.learned { background:var(--good-soft); color:var(--good); border:1px solid var(--good-line); }
  .badge.due { background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad-line); }
  .badge.stage { background:var(--stage-bg); color:var(--muted); border:1px solid var(--line); }

  /* buttons */
  button, .btn { font:inherit; font-size:16px; font-weight:600; cursor:pointer; border:1px solid var(--accent);
                 color:var(--accent-ink); background:var(--accent); border-radius:11px; padding:10px 18px;
                 text-decoration:none; display:inline-block; box-shadow:var(--shadow-sm);
                 transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
  button:hover, .btn:hover { background:var(--accent-strong); border-color:var(--accent-strong);
                             color:var(--accent-ink); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  button:active, .btn:active { transform:translateY(0); box-shadow:var(--shadow-sm); }
  button.secondary, .btn.secondary { background:var(--surface); color:var(--accent); border-color:var(--line-strong); }
  button.secondary:hover, .btn.secondary:hover { background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }
  button.plain { background:var(--surface); color:var(--ink); border-color:var(--line); }
  button.plain:hover { background:var(--surface-muted); color:var(--ink); border-color:var(--line-strong); }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  button.opt { display:block; width:100%; text-align:left; margin:9px 0; background:var(--surface); color:var(--ink);
               border:1px solid var(--line); border-radius:13px; padding:14px 16px; font-weight:500; box-shadow:none; }
  button.opt:hover { border-color:var(--accent); background:var(--accent-soft); color:var(--ink); transform:none; box-shadow:none; }
  button.opt.sel { border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--ring); }
  button.opt.right { border-color:var(--good); background:var(--good-soft); }
  button.opt.wrong { border-color:var(--bad); background:var(--bad-soft); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* forms */
  textarea, input[type=text], input[type=number], select { font:inherit; width:100%; padding:11px 12px;
    border:1px solid var(--line); border-radius:11px; margin:4px 0 12px; background:var(--surface); color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease; }
  textarea:focus, input[type=text]:focus, input[type=number]:focus, select:focus {
    border-color:var(--accent); box-shadow:var(--ring); outline:none; }
  textarea { min-height:68px; line-height:1.55; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; vertical-align:-2px; }
  label.flabel { font-weight:600; font-size:16px; display:block; margin-top:16px; }

  /* code and tables */
  pre { background:var(--surface-muted); border:1px solid var(--line); border-radius:13px; padding:14px 16px;
        overflow-x:auto; font-size:15.5px; line-height:1.5; }
  code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.92em; }
  pre code { font-size:15.5px; }
  table.md { border-collapse:separate; border-spacing:0; margin:12px 0; width:100%;
             border:1px solid var(--line); border-radius:13px; overflow:hidden; }
  table.md th, table.md td { border-bottom:1px solid var(--line); border-right:1px solid var(--line);
                             padding:9px 12px; text-align:left; font-size:16.5px; vertical-align:top; }
  table.md th:last-child, table.md td:last-child { border-right:none; }
  table.md tr:last-child td { border-bottom:none; }
  table.md th { background:var(--surface-muted); font-weight:600; }

  /* feedback and reveals */
  .feedback { border-radius:13px; padding:14px 16px; margin:14px 0; animation:fadeUp .25s ease both; }
  .feedback.ok { background:var(--good-soft); border:1px solid var(--good-line); border-left:4px solid var(--good); }
  .feedback.no { background:var(--bad-soft); border:1px solid var(--bad-line); border-left:4px solid var(--bad); }
  .learnpart { animation:fadeUp .25s ease both; }
  div[id^="exbody-"] { animation:fadeUp .25s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  /* stage rail: the 6-stage stepper */
  .rail { display:flex; flex-wrap:wrap; gap:9px; margin:18px 0; }
  .rail button { display:inline-flex; align-items:center; gap:8px; background:var(--surface); color:var(--muted);
                 border:1px solid var(--line); font-size:14.5px; font-weight:500; padding:8px 14px 8px 11px;
                 border-radius:999px; box-shadow:none; }
  .rail button::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex:none; }
  .rail button:hover { border-color:var(--accent); color:var(--ink); background:var(--surface); transform:none; box-shadow:none; }
  .rail button.cur { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
  .rail button.cur::before { background:var(--accent); }
  .rail button.done { border-color:var(--good-line); color:var(--good); }
  .rail button.done::before { background:var(--good); }

  .pager { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:20px 0; }
  .err { color:var(--bad); font-size:16px; }
  .okmsg { color:var(--good); font-size:16px; }
  ul.tight { margin:6px 0; padding-left:22px; }
  ul.tight li { margin:5px 0; }
  .queue-item { display:flex; justify-content:space-between; gap:14px; align-items:baseline; padding:9px 0; }
  .queue-item + .queue-item { border-top:1px solid var(--line); }
  .queue-item a { font-weight:600; font-size:15px; white-space:nowrap; }

  /* timed Match game */
  .matchbar { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:baseline; margin:8px 0 14px; }
  .matchbar .mtime { font-variant-numeric:tabular-nums; font-weight:700; font-size:22px; }
  .matchgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
  .matchtile { min-height:88px; text-align:left; white-space:normal; font-weight:500; font-size:14.5px;
               line-height:1.35; padding:12px 14px; border-radius:14px; background:var(--surface);
               color:var(--ink); border:1px solid var(--line-strong); box-shadow:var(--shadow-sm); }
  .matchtile:hover { transform:none; }
  .matchtile.sel { border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--ring); }
  .matchtile.ok { border-color:var(--good); background:var(--good-soft); color:var(--good); opacity:.55; }
  .matchtile.bad { border-color:var(--bad); background:var(--bad-soft); }
  .matchtile.prompt { border-style:dashed; }
  .misswhy { margin-top:12px; }
  .misswhy textarea { min-height:72px; }

  /* finals countdown calendar on the home page */
  .fcal { margin:18px 0 8px; }
  .fcal h2 { margin-bottom:6px; }
  .fcal-lead { margin:0 0 14px; color:var(--muted); font-size:15.5px; }
  .fcal-month { margin:0 0 18px; }
  .fcal-month h3 { margin:0 0 8px; font-size:18px; }
  .fcal-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:5px; }
  .fcal-dow { text-align:center; font-size:12px; font-weight:600; letter-spacing:.04em;
              text-transform:uppercase; color:var(--muted); padding:2px 0 4px; }
  .fcal-day { min-height:54px; border-radius:10px; border:1px solid transparent; padding:6px 5px;
              display:flex; flex-direction:column; gap:2px; background:transparent; color:var(--muted); }
  .fcal-day.empty { visibility:hidden; }
  .fcal-day .dn { font-size:14px; font-weight:700; line-height:1.1; }
  .fcal-day .fl { font-size:10.5px; line-height:1.2; font-weight:600; overflow-wrap:anywhere; }
  .fcal-day.past { background:var(--surface-muted); border-color:var(--line); color:var(--muted); }
  .fcal-day.countdown { background:var(--bad); border-color:var(--bad); color:#fff;
                        box-shadow:0 1px 2px rgba(179,55,46,.25); }
  .fcal-day.today { box-shadow:0 0 0 2px var(--ink); }
  .fcal-day.final { background:#8f241c; border-color:#8f241c; color:#fff; }
  .fcal-day.final .fl { color:#ffe3df; }
  @media (prefers-color-scheme: dark) {
    .fcal-day.countdown { background:#a94840; border-color:#a94840; color:#fff; }
    .fcal-day.final { background:#c45a50; border-color:#c45a50; }
    .fcal-day.final .fl { color:#ffe8e4; }
  }
  @media (max-width:640px) {
    .fcal-day { min-height:46px; padding:4px 3px; border-radius:8px; }
    .fcal-day .dn { font-size:12.5px; }
    .fcal-day .fl { font-size:9.5px; }
  }
  footer.site { border-top:1px solid var(--line); color:var(--muted); font-size:15px; }
  footer.site .wrap { padding-top:22px; padding-bottom:30px; }
  .hidden { display:none; }

  /* overflow safety at any width: media never exceeds its container, and
     long words, ids, and inline code wrap instead of pushing the page wide.
     (pre keeps white-space:pre, so code blocks still scroll internally.) */
  img, svg, video { max-width:100%; height:auto; }
  body, p, li, td, th, .feedback, button.opt, .queue-item span { overflow-wrap:break-word; }

  /* small screens: phone-first layout. Single column everywhere; the page
     itself never scrolls sideways. Wide things (tables, code) scroll inside
     their own block instead. */
  @media (max-width:640px) {
    body { font-size:17px; }
    .wrap { padding:20px 15px 52px; }

    /* header: compact brand, nav wraps under it, links stay tappable */
    header.site .wrap { padding-top:10px; padding-bottom:10px; gap:8px; }
    header.site .brand { font-size:19px; margin-right:2px; }
    header.site nav { gap:4px; }
    header.site nav a { font-size:14px; padding:11px 10px; } /* ~44px tall */

    /* every form control at 16px or more, so iOS never auto-zooms on focus */
    textarea, input[type=text], input[type=number], select { font-size:16px; }

    /* tap targets and flex safety */
    .rail { gap:7px; }
    .rail button { min-height:44px; font-size:14px; }

    .queue-item a { display:inline-flex; align-items:center; min-height:44px; padding:0 2px; }

    /* learn pager: prev/next stay on one row, the part label drops below */

    table.md:has(textarea) { display:table; table-layout:fixed; overflow-x:visible; }

    /* code blocks keep scrolling inside pre, at a phone-readable size */

  }
  /* very narrow screens: progress pills stack, label and percent on one

  @media (max-width:560px) {

  /* ============================ course journey ============================
     Duolingo-style winding path of topic nodes, kept in StudyHub's warm

                                   border-bottom:2px solid currentColor; transform:rotate(-45deg);

  details.fold[open] > summary::before { transform:rotate(45deg); }
  details.fold[open] > summary { margin-bottom:8px; }
  details.fold .foldmeta { color:var(--muted); font-weight:500; font-size:13.5px; margin-left:auto; }
  details.fold.nest { margin-top:10px; padding:8px 12px; border-radius:12px; background:var(--surface-muted); }
  details.fold.nest > summary { font-size:14.5px; color:var(--ink); }

  .journey { position:relative; margin:8px 0 28px; padding:4px 0 20px; }
  .junit { position:sticky; top:64px; z-index:8; display:flex; align-items:center; gap:14px;

  .junit .ju-copy { flex:1; min-width:0; }
  .junit .ju-kicker { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
                      opacity:.85; margin:0 0 2px; }
  .junit .ju-title { font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:22px;
                     line-height:1.2; margin:0; color:inherit; }
  .junit .ju-note { flex:none; width:42px; height:42px; padding:0; border-radius:12px;
                    border:1.5px solid color-mix(in srgb, var(--accent-ink) 35%, transparent);
                    background:color-mix(in srgb, var(--accent-ink) 12%, transparent); color:var(--accent-ink);
                    display:inline-flex; align-items:center; justify-content:center; box-shadow:none; }
  .junit .ju-note:hover { background:color-mix(in srgb, var(--accent-ink) 22%, transparent); color:var(--accent-ink);
                          transform:none; box-shadow:none; border-color:color-mix(in srgb, var(--accent-ink) 55%, transparent); }

  .jpath { position:relative; display:flex; flex-direction:column; align-items:stretch; gap:0;
           padding:10px 0 6px; min-height:80px; }
  .jstep { position:relative; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
           min-height:118px; padding:6px 0; z-index:1; }
  .jstep .jlabel { min-width:0; }

  .jstep .jlabel .js { font-size:13px; color:var(--muted); margin:0; }
  .jstep .jlabel .jbadges { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .jstep.pos-c .jnodewrap { grid-column:2; }
  .jstep.pos-c .jlabel { grid-column:3; padding-left:14px; text-align:left; }
  .jstep.pos-r { justify-items:end; }

  .jstep.pos-l .jnodewrap { grid-column:2; }
  .jstep.pos-l .jlabel { grid-column:3; padding-left:14px; text-align:left; }
  /* nudge the node itself left or right for the snake */
  .jstep.pos-r .jnodewrap { transform:translateX(48%); }
  .jstep.pos-l .jnodewrap { transform:translateX(-48%); }
  .jstep.pos-c .jnodewrap { transform:none; }

  .jnodewrap { position:relative; width:84px; height:84px; display:flex; align-items:center; justify-content:center; }
  .jring { position:absolute; inset:0; width:84px; height:84px; pointer-events:none; }
  .jnode { position:relative; z-index:1; width:64px; height:64px; border-radius:50%;
           display:inline-flex; align-items:center; justify-content:center;
           text-decoration:none; border:3px solid var(--line-strong); background:var(--surface-muted);
           color:var(--muted); box-shadow:var(--shadow-sm);
           transition:transform .18s ease, box-shadow .18s ease, background .15s ease, border-color .15s ease, color .15s ease; }
  .jnode:hover { transform:translateY(-2px) scale(1.04); box-shadow:var(--shadow-md); }
  .jnode:active { transform:translateY(0) scale(.98); }
  .jnode svg.jico { width:28px; height:28px; display:block; }
  .jnode.idle { background:var(--surface-muted); border-color:var(--line-strong); color:var(--muted); }
  .jnode.current { background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink);
                   box-shadow:0 6px 0 color-mix(in srgb, var(--accent-strong) 70%, #000), var(--shadow-sm); }
  .jnode.current:hover { background:var(--accent-strong); color:var(--accent-ink); }
  .jnode.done, .jnode.learned { background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink);
                                box-shadow:0 5px 0 color-mix(in srgb, var(--accent-strong) 65%, #000); }
  .jnode.due { background:var(--bad); border-color:color-mix(in srgb, var(--bad) 70%, #000); color:#fff;
               box-shadow:0 5px 0 color-mix(in srgb, var(--bad) 65%, #000);
               animation:jpulse 1.8s ease-in-out infinite; }

  @keyframes jpulse {
    0%, 100% { box-shadow:0 5px 0 color-mix(in srgb, var(--bad) 65%, #000); }
    50% { box-shadow:0 5px 0 color-mix(in srgb, var(--bad) 65%, #000), 0 0 0 10px color-mix(in srgb, var(--bad) 18%, transparent); }
  }
  .jstep.current .jlabel .jt { color:var(--accent-strong); }
  .jdecor { position:absolute; width:min(120px, 28vw); opacity:.55; pointer-events:none; z-index:0;
            filter:saturate(.85); }
  .jdecor.left { left:0; }
  .jdecor.right { right:0; }
  .journey-foot { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:8px 0 20px; }

  @media (max-width:640px) {
    .junit { top:108px; padding:14px 14px; border-radius:14px; }
    .junit .ju-title { font-size:19px; }
    .jstep { min-height:108px; }
    .jstep.pos-r .jnodewrap { transform:translateX(34%); }
    .jstep.pos-l .jnodewrap { transform:translateX(-34%); }
    .jnodewrap { width:76px; height:76px; }
    .jring { width:76px; height:76px; }
    .jnode { width:58px; height:58px; }
    .jnode svg.jico { width:24px; height:24px; }
    .jstep .jlabel .jt { font-size:15px; }
    .jdecor { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .jnode.due { animation:none; }
  }

<header class="site"><div class="wrap">
  <a class="brand" href="#/">Integrated Learning Plan</a>

  <div class="seg" id="navcourses" aria-label="Courses"></div>
  <a class="bell" href="#/notifications" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="bellbadge" class="bellbadge hidden">0</span></a>
</div></header>
<main class="wrap" id="app">Loading courses…</main>
<footer class="site"><div class="wrap">Built for studying. Progress saves in this browser; export your state from Home to move it between devices.</div></footer>

<script>
"use strict";
/* ============================== utilities ============================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function todayStr(d){ d = d || new Date(); var m = d.getMonth()+1, day = d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day; }
function addDays(str, n){ var d = new Date(str+"T12:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function inlineMd(t){
  return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
}
function md(t){
  if (!t) return "";
  var parts = String(t).split(/```/), out = [];
  for (var i=0;i<parts.length;i++){
    if (i % 2 === 1){ out.push("<pre><code>"+esc(parts[i].replace(/^\n+|\n+$/g,""))+"</code></pre>"); continue; }
    var lines = parts[i].split("\n"), buf = [], mode = null;
    function flush(){
      if (!buf.length) return;
      if (mode === "ul"){ out.push("<ul class=\"tight\">"+buf.map(function(x){ return "<li>"+inlineMd(x)+"</li>"; }).join("")+"</ul>"); }
      else if (mode === "table"){
        var rows = buf.filter(function(x){ return !/^\|[\s\-|]+\|$/.test(x); }).map(function(x){ return x.split("|").slice(1,-1).map(function(c){ return c.trim(); }); });
        var s = "<table class=\"md\">";
        rows.forEach(function(r, ri){ s += "<tr>"+r.map(function(c){ return ri===0 ? "<th>"+inlineMd(c)+"</th>" : "<td>"+inlineMd(c)+"</td>"; }).join("")+"</tr>"; });
        out.push(s+"</table>");
      }
      else { out.push(buf.map(function(x){ return "<p>"+inlineMd(x)+"</p>"; }).join("")); }
      buf = []; mode = null;
    }
    lines.forEach(function(ln){
      var s = ln.trim();
      if (s === ""){ flush(); return; }
      if (s.indexOf("- ") === 0){ if (mode !== "ul") flush(); mode = "ul"; buf.push(s.slice(2)); return; }
      if (s.charAt(0) === "|"){ if (mode !== "table") flush(); mode = "table"; buf.push(s); return; }
      if (mode) flush(); buf.push(s);
    });
    flush();
  }
  return out.join("\n");
}

/* ============================== state ============================== */
var LS_KEY = "ilp-state-v1";
var state = null;
function blankState(){ return { v:1, topics:{}, errors:[], exampleFlags:{}, finals:[], notebooks:[], matchBests:{} }; }
function loadState(){
  try { var raw = localStorage.getItem(LS_KEY); state = raw ? JSON.parse(raw) : blankState(); }
  catch(e){ state = blankState(); }
  if (!state.topics) state = blankState();
  if (!state.matchBests) state.matchBests = {};
}
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} updateBell(); }
function tkey(cid, tid){ return cid + "/" + tid; }
function tstate(cid, tid){
  var k = tkey(cid, tid);
  if (!state.topics[k]) state.topics[k] = { completed:{}, predict:{}, learn:{ selfExplains:{}, revisits:0 }, organize:{ blocks:{}, redraw:{}, matrix:{} }, cards:{}, sorting:{}, practice:{}, quizServings:[], usedQ:[], retrievals:[], learned:false, nextRetrieval:null };
  return state.topics[k];
}
function stageDone(cid, tid, idx){ return !!tstate(cid, tid).completed[idx]; }

/* ============================== course registry ============================== */
var COURSES = [];
function loadCourses(done){
  window.COURSE_DATA = window.COURSE_DATA || {};
  var ids = window.COURSE_REGISTRY || [];
  var pending = ids.length;
  if (!pending){ done(); return; }
  ids.forEach(function(id){
    var s = document.createElement("script");
    s.src = "courses/" + id + ".js";
    s.onload = s.onerror = function(){ if (--pending === 0) done(); };
    document.body.appendChild(s);
  });
}
function collectCourses(){
  COURSES = (window.COURSE_REGISTRY || []).map(function(id){ return window.COURSE_DATA[id]; }).filter(Boolean);
}
function courseById(cid){ return COURSES.filter(function(c){ return c.id === cid; })[0] || null; }
function topicById(course, tid){
  var found = null;
  course.chapters.forEach(function(ch){ ch.topics.forEach(function(t){ if (t.id === tid) found = { chapter: ch, topic: t }; }); });
  return found;
}
function allTopics(course){
  var out = [];
  course.chapters.forEach(function(ch){ ch.topics.forEach(function(t){ out.push({ chapter: ch, topic: t }); }); });
  return out;
}
function questionById(course, qid){
  var found = null;
  allTopics(course).forEach(function(x){ x.topic.questions.forEach(function(q){ if (q.id === qid) found = { topic: x.topic, q: q }; }); });
  return found;
}

/* ============================== error log engine ============================== */
var RETEST_GAPS = [1, 4, 9, 21]; // about 1d, 3-4d, 8-10d, 21d
function fileErrorDraft(cid, tid, q, confidence){
  var entry = {
    id: "e" + Date.now() + Math.floor(Math.random()*100000),
    cid: cid, tid: tid, qid: q ? q.id : null,
    problem: q ? q.prompt : "",
    principle: q ? q.principle : "practice",
    difficulty: q ? q.difficulty : 2,
    confidence: (confidence == null ? null : confidence),
    wrongStep: "", correctPrinciple: "",
    status: "draft", created: todayStr(), stageIdx: 0, nextDue: null, clean: 0, served: q ? [q.id] : []
  };
  state.errors.push(entry); saveState();
  return entry;
}
function completeErrorEntry(entry, wrongStep, correctPrinciple){
  entry.wrongStep = wrongStep; entry.correctPrinciple = correctPrinciple;
  entry.status = "open"; entry.stageIdx = 0; entry.clean = 0;
  entry.nextDue = addDays(todayStr(), RETEST_GAPS[0]);
  saveState();
}
function sortedDueErrors(){
  var t = todayStr();
  var open = state.errors.filter(function(e){ return e.status === "open" && e.nextDue && e.nextDue <= t; });
  var counts = {};
  state.errors.forEach(function(e){ if (e.status === "open") counts[e.principle] = (counts[e.principle] || 0) + 1; });
  return open.sort(function(a, b){
    var ra = counts[a.principle] >= 2 ? 0 : 1, rb = counts[b.principle] >= 2 ? 0 : 1;
    if (ra !== rb) return ra - rb;
    var ha = (a.confidence != null && a.confidence >= 80) ? 0 : 1, hb = (b.confidence != null && b.confidence >= 80) ? 0 : 1;
    if (ha !== hb) return ha - hb;
    return a.nextDue < b.nextDue ? -1 : 1;
  });
}
function pickRetestQuestion(entry){
  var course = courseById(entry.cid); if (!course) return null;
  var found = topicById(course, entry.tid); if (!found) return null;
  var pool = found.topic.questions.filter(function(q){ return entry.served.indexOf(q.id) === -1; });
  if (!pool.length) return null;
  var same = pool.filter(function(q){ return q.principle === entry.principle; });
  var near = same.filter(function(q){ return Math.abs(q.difficulty - entry.difficulty) <= 1; });
  var pickFrom = near.length ? near : (same.length ? same : pool);
  return pickFrom[Math.floor(Math.random() * pickFrom.length)];
}

/* ============================== mastery ============================== */
function recordQuizResult(cid, tid, score, n, qids){
  var ts = tstate(cid, tid), t = todayStr();
  ts.quizServings.push({ date: t, score: score, n: n });
  qids.forEach(function(id){ if (ts.usedQ.indexOf(id) === -1) ts.usedQ.push(id); });
  if (score >= 0.7){
    if (ts.retrievals.filter(function(r){ return r.date === t; }).length === 0 && ts.quizServings.length > 1){
      // a later passing serving on a new day counts as one spaced retrieval
      ts.retrievals.push({ date: t, score: score, n: n, via: "quiz" });
    }
    ts.nextRetrieval = addDays(t, score > 0.9 ? 4 : 2);
  } else if (score < 0.5){
    ts.shrunk = true; ts.nextRetrieval = addDays(t, 1);
  } else {
    ts.nextRetrieval = addDays(t, 1);
  }
  updateLearned(cid, tid); saveState();
}
function recordRetrievalResult(cid, tid, score, n, qids){
  var ts = tstate(cid, tid), t = todayStr();
  qids.forEach(function(id){ if (ts.usedQ.indexOf(id) === -1) ts.usedQ.push(id); });
  var alreadyToday = ts.retrievals.some(function(r){ return r.date === t; });
  if (score >= 0.7 && !alreadyToday) ts.retrievals.push({ date: t, score: score, n: n, via: "retrieval" });
  var gaps = [3, 8, 21];
  var idx = Math.min(ts.retrievals.length, gaps.length - 1);
  ts.nextRetrieval = addDays(t, score >= 0.7 ? gaps[idx] : 1);
  updateLearned(cid, tid); saveState();
}
function updateLearned(cid, tid){
  var ts = tstate(cid, tid);
  var days = {};
  ts.retrievals.forEach(function(r){ if (r.score >= 0.7) days[r.date] = true; });
  ts.learned = Object.keys(days).length >= 3;
}
function learnedCount(course){
  return allTopics(course).filter(function(x){ return tstate(course.id, x.topic.id).learned; }).length;
}
function topicRetrievalDue(cid, tid){
  var ts = tstate(cid, tid);
  return !ts.learned && ts.nextRetrieval && ts.nextRetrieval <= todayStr() && ts.quizServings.length > 0;
}

/* ============================== routing ============================== */
function updateNavActive(){
  var nav = $("navcourses"); if (!nav) return;
  var m = location.hash.match(/#\/(?:course|topic|examples|final|retrieval)\/([^\/]+)/);
  var cid = m ? m[1] : null;
  var active = null;
  if (nav.children) for (var i = 0; i < nav.children.length; i++){
    var a = nav.children[i];
    if (a.getAttribute && a.getAttribute("data-cid")){
      var on = a.getAttribute("data-cid") === cid;
      a.classList.toggle("active", on);
      if (on) active = a;
    }
  }
  var thumb = $("segthumb"); if (!thumb) return;
  if (active){
    thumb.style.opacity = "1";
    thumb.style.width = (active.offsetWidth || 0) + "px";
    thumb.style.transform = "translateX(" + (active.offsetLeft || 0) + "px)";
    if (nav.scrollTo && active.offsetLeft > nav.clientWidth - active.offsetWidth) nav.scrollTo({ left: active.offsetLeft - 12, behavior: "smooth" });
  } else thumb.style.opacity = "0";
}
function segStep(dir){
  var m = location.hash.match(/#\/(?:course|topic|examples|final|retrieval)\/([^\/]+)/);
  var idx = -1;
  if (m) COURSES.forEach(function(c, i){ if (c.id === m[1]) idx = i; });
  if (idx < 0) idx = dir > 0 ? -1 : COURSES.length;
  var j = Math.max(0, Math.min(COURSES.length - 1, idx + dir));
  if (COURSES[j] && (idx < 0 || j !== idx)) location.hash = "#/course/" + COURSES[j].id;
}
function route(){
  if (typeof closeLibraryFile === "function") closeLibraryFile();
  updateNavActive();
  var h = location.hash.replace(/^#\/?/, "");
  var seg = h.split("/").filter(function(x){ return x !== ""; });
  window.scrollTo(0, 0);
  if (seg.length === 0) return renderHome();
  if (seg[0] === "course" && seg[1]) return renderCourse(seg[1]);
  if (seg[0] === "topic" && seg[1] && seg[2]) return renderTopic(seg[1], seg[2], seg[3] ? parseInt(seg[3], 10) : 0);
  if (seg[0] === "examples" && seg[1]) return renderExamples(seg[1]);
  if (seg[0] === "final" && seg[1]) return renderFinal(seg[1]);
  if (seg[0] === "errors") return renderErrors();
  if (seg[0] === "notifications") return renderNotifications();
  if (seg[0] === "notebook" && seg[1]) return renderNotebookPage(seg[1]);
  if (seg[0] === "notebook") return renderNotebookList();
  if (seg[0] === "retrieval" && seg[1] && seg[2]) return renderRetrieval(seg[1], seg[2]);
  if (seg[0] === "match" && seg[1] && seg[2]) return renderMatch(seg[1], seg[2]);
  if (seg[0] === "match" && seg[1]) return renderMatch(seg[1], null);
  if (seg[0] === "sprint") return renderSprint();
  renderHome();
}
window.addEventListener("hashchange", route);
</script>
<script>
"use strict";
/* ============================== HOME ============================== */
function computeToday(){
  var items = [], seenTopics = {};
  function addTopic(key){ seenTopics[key] = true; }
  var dueErrors = sortedDueErrors();

          if (t) html += "<pre class=\"filebody nbout\">" + esc(String(t).slice(0, 4000)) + "</pre>";
        }
      });
    }
  });
  return "<div class=\"mdview nbview\">" + html + "</div>";
}
function mimeForExt(ext){
  ext = String(ext || "").toLowerCase();
  if (ext === "pdf") return "application/pdf";
  if (ext === "png") return "image/png";
  if (ext === "jpg" || ext === "jpeg") return "image/jpeg";
  if (ext === "gif") return "image/gif";
  if (ext === "webp") return "image/webp";
  if (ext === "svg") return "image/svg+xml";
  if (ext === "mp4") return "video/mp4";
  return "application/octet-stream";
}
function paintHostedFile(url, name, kind, show){
  if (kind === "image"){ show("<img src=\"" + esc(url) + "\" alt=\"" + esc(name) + "\">"); return; }
  if (kind === "pdf"){ show("<iframe src=\"" + esc(url) + "\" title=\"" + esc(name) + "\"></iframe>"); return; }
  if (kind === "video"){ show("<video controls src=\"" + esc(url) + "\"></video>"); return; }
  libraryFileResponse(url).then(function(res){ return res.text(); }).then(function(text){
    show(kind === "notebook" ? notebookHtml(text) : (kind === "md" ? "<div class=\"mdview\">" + md(text) + "</div>" : "<pre class=\"filebody\">" + esc(text) + "</pre>"));
  }).catch(function(){ show("<p class=\"err\">This file could not be loaded.</p>"); });
}
function paintBytes(name, bytes, back){
  var kind = libraryViewKind(fileExt(name));
  var head = back ? "<p><button type=\"button\" class=\"plain\" onclick=\"showZipList()\">Back to archive</button></p><p><strong>" + esc(name) + "</strong></p>" : "";
  var body = $("libview-body");
  function put(inner){ if (body) body.innerHTML = head + inner; }
  if (kind === "text" || kind === "md" || kind === "notebook"){
    var text = bytesToText(bytes);
    put(kind === "notebook" ? notebookHtml(text) : (kind === "md" ? "<div class=\"mdview\">" + md(text) + "</div>" : "<pre class=\"filebody\">" + esc(text) + "</pre>"));
    return;
  }
  if (kind === "image" || kind === "pdf" || kind === "video"){
    revokeLibraryBlob();
    libraryBlobUrl = URL.createObjectURL(new Blob([bytes], { type: mimeForExt(fileExt(name)) }));
    if (kind === "image") put("<img src=\"" + libraryBlobUrl + "\" alt=\"" + esc(name) + "\">");
    else if (kind === "pdf") put("<iframe src=\"" + libraryBlobUrl + "\" title=\"" + esc(name) + "\"></iframe>");
    else put("<video controls src=\"" + libraryBlobUrl + "\"></video>");
    return;
  }
  put("<p class=\"muted\">This file can’t be drawn on the page.</p>");
}
function showZipList(){
  revokeLibraryBlob();
  var body = $("libview-body");
  if (!body || !libraryZipEntries) return;
  var html = "<div class=\"ziplist\"><p class=\"small muted\">Pick a file inside the archive.</p>";
  libraryZipEntries.forEach(function(entry, i){
    html += "<div class=\"filerow\"><button type=\"button\" class=\"fname\" onclick=\"openZipEntry(" + i + ")\">" + esc(entry.name) + "</button>"
      + "<span class=\"fmeta\">" + esc(fileExt(entry.name).toUpperCase() || "FILE") + " · " + fmtSize(entry.uncomp) + "</span>"
      + "<button type=\"button\" class=\"viewbtn\" onclick=\"openZipEntry(" + i + ")\">View</button></div>";
  });
  body.innerHTML = html + "</div>";
}
function openZipEntry(i){
  var entry = libraryZipEntries && libraryZipEntries[i];
  var buf = libraryZipBuf;
  if (!entry || !buf) return;
  var token = libraryViewToken;
  var body = $("libview-body");
  if (body) body.innerHTML = "<p class=\"muted\">Loading…</p>";
  zipEntryBytes(buf, entry).then(function(bytes){
    if (token !== libraryViewToken) return;
    paintBytes(entry.name, bytes, true);
  }).catch(function(){
    if (token !== libraryViewToken) return;
    if (body) body.innerHTML = "<p class=\"err\">This file could not be opened.</p><p><button type=\"button\" class=\"plain\" onclick=\"showZipList()\">Back to archive</button></p>";
  });
}
function openLibraryFile(encUrl, encName, kind){
  var url = decodeURIComponent(encUrl);
  var name = decodeURIComponent(encName);
  var token = ++libraryViewToken;
  libraryZipBuf = null;
  libraryZipEntries = null;
  revokeLibraryBlob();
  var box = $("libview");
  if (!box){
    box = document.createElement("div");
    box.id = "libview";
    box.className = "libview";
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.addEventListener("click", function(e){ if (e.target === box) closeLibraryFile(); });
    document.body.appendChild(box);
  }
  function show(inner){
    if (token !== libraryViewToken) return;
    var body = $("libview-body");
    if (body) body.innerHTML = inner;
  }
  box.innerHTML = "<div class=\"libview-card\"><p><strong id=\"libview-title\">" + esc(name) + "</strong></p>"
    + "<p><button type=\"button\" class=\"plain\" id=\"libview-close\" onclick=\"closeLibraryFile()\">Close</button></p>"
    + "<div id=\"libview-body\"><p class=\"muted\">Loading…</p></div></div>";
  box.classList.add("open");
  document.body.classList.add("libopen");
  var closer = $("libview-close");
  if (closer && closer.focus) closer.focus();
  if (kind === "zip"){
    libraryFileResponse(url).then(function(res){ return res.arrayBuffer(); }).then(function(buf){
      if (token !== libraryViewToken) return;
      libraryZipBuf = buf;
      libraryZipEntries = zipCatalog(buf).filter(function(entry){ return zipVisible(entry.name); });
      if (!libraryZipEntries.length){ show("<p class=\"muted\">This archive has no files to show.</p>"); return; }
      showZipList();
    }).catch(function(){ show("<p class=\"err\">This archive could not be opened.</p>"); });
    return;
  }
  paintHostedFile(url, name, kind, show);
}
function closeLibraryFile(){
  libraryViewToken++;
  libraryZipBuf = null;
  libraryZipEntries = null;
  revokeLibraryBlob();
  document.body.classList.remove("libopen");
  var box = $("libview");
  if (!box) return;
  box.classList.remove("open");
  box.innerHTML = "";
}
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closeLibraryFile();
});

/* ============================== EXAMPLES ============================== */

</script>
<script>
"use strict";
/* ============================== TOPIC PAGE ============================== */
var STAGE_NAMES = ["Predict", "Learn", "Organize", "Encode", "Practice", "Quiz"];
function renderTopic(cid, tid, stage){
  var c = courseById(cid), app = $("app");
  if (!c){ app.innerHTML = "<p>Course not found.</p>"; return; }
  var found = topicById(c, tid);
  if (!found){ app.innerHTML = "<p>Topic not found.</p>"; return; }
  var t = found.topic, ts = tstate(cid, tid);
  if (stage === 1 && ts.completed[1]){ ts.learn.revisits = (ts.learn.revisits || 0) + 1; saveState(); }
  var html = "<p><a href=\"#/course/" + c.id + "\">&larr; " + esc(c.name) + "</a></p>"
    + "<h1>" + esc(t.title) + " "
    + (t.provisional ? "<span class=\"badge prov\">PROVISIONAL</span> " : "")
    + (ts.learned ? "<span class=\"badge learned\">LEARNED</span>" : "") + "</h1>";
  if (t.provisional) html += "<p class=\"small\" style=\"color:var(--warn)\">" + esc(t.provisional) + "</p>";
  if (notesUnfinished(cid, tid)) html += "<p class=\"small err\">Notes unfinished: finish the Organize stage.</p>";
  if (ts.shrunk) html += "<p class=\"small err\">This topic scored under half on its last quiz, so it is served smaller, with a worked example first, until a retest improves it.</p>";
  if (ts.learn.revisits) html += "<p class=\"small muted\">Lesson revisits logged: " + ts.learn.revisits + ". A revisit is not review and never counts as progress.</p>";
  html += "<div class=\"rail\">" + STAGE_NAMES.map(function(name, i){
    return "<button class=\"" + (i === stage ? "cur" : "") + (ts.completed[i] ? " done" : "") + "\" onclick=\"location.hash='#/topic/" + cid + "/" + tid + "/" + i + "'\">" + (ts.completed[i] ? "✓ " : "") + (i + 1) + " · " + name + "</button>";
  }).join("") + "</div>";
  html += "<p><button class=\"secondary\" onclick=\"openTopicNotebook('" + cid + "','" + tid + "')\">Write in the notebook for this topic</button> "
    + "<a class=\"btn secondary\" href=\"#/match/" + cid + "/" + tid + "\">Match game</a></p>";
  html += "<div id=\"stagebody\"></div>";
  app.innerHTML = html;
  var body = $("stagebody");
  if (stage === 0) renderPredict(body, c, t);
  else if (stage === 1) renderLearn(body, c, t);
  else if (stage === 2) renderOrganize(body, c, t);
  else if (stage === 3) renderEncode(body, c, t);
  else if (stage === 4) renderPractice(body, c, t);

}

/* ---------- Stage 0: Predict ---------- */
function renderPredict(el, c, t){
  var ts = tstate(c.id, t.id);
  var html = "<h2>Stage 1 · Predict</h2>"
    + "<p class=\"muted\">Attempt each question cold, before any content. A wrong cold attempt is useful data, not a failure. Rate your confidence on each.</p>";
  t.pieces.forEach(function(p){
    var saved = ts.predict[p.id] || {};
    html += "<div class=\"card\"><h3>" + esc(p.name) + "</h3>"
      + "<p class=\"small muted\">" + esc(p.fn) + "</p>"
      + "<p><strong>" + esc(p.predict) + "</strong></p>"
      + "<textarea id=\"pred-a-" + p.id + "\" placeholder=\"Your cold attempt, in your own words\">" + esc(saved.answer || "") + "</textarea>"
      + "<label class=\"flabel\">Confidence (0 to 100)</label>"
      + "<input type=\"number\" id=\"pred-c-" + p.id + "\" min=\"0\" max=\"100\" value=\"" + (saved.confidence == null ? "" : saved.confidence) + "\">"
      + "<label class=\"small\"><input type=\"checkbox\" id=\"pred-s-" + p.id + "\" " + (saved.skipped ? "checked" : "") + "> Skip this piece (recorded as skipped)</label></div>";
  });
  html += "<p><button onclick=\"savePredict('" + c.id + "','" + t.id + "')\">Save cold attempts</button> <span id=\"predmsg\" class=\"small\"></span></p>";
  el.innerHTML = html;
}
function savePredict(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid), missing = [];
  t.pieces.forEach(function(p){
    var a = $("pred-a-" + p.id).value.trim(), conf = $("pred-c-" + p.id).value, sk = $("pred-s-" + p.id).checked;
    ts.predict[p.id] = { answer: a, confidence: conf === "" ? null : Math.max(0, Math.min(100, parseInt(conf, 10))), skipped: sk };
    if (!a && !sk) missing.push(p.name);
  });
  var msg = $("predmsg");
  if (missing.length){ msg.className = "small err"; msg.textContent = "Each piece needs a cold attempt or an explicit skip: " + missing.join(", ") + "."; saveState(); return; }

  msg.className = "small okmsg"; msg.textContent = "Saved. Baseline recorded; now go to Learn.";
}

/* ---------- Stage 1: Learn ---------- */
var learnPage = {};
function renderLearn(el, c, t){

function updateLearnPager(c, t){

function completeLearn(cid, tid){

/* ---------- Stage 2: Organize ---------- */
function renderOrganize(el, c, t){
  var ts = tstate(c.id, t.id), org = ts.organize || {};
  var html = "<h2>Stage 3 · Organize</h2>"
    + "<p class=\"muted\">Restructure, never recopy: reorganize onto the skeleton in your own words, compress, add cue questions, correct against the lesson. Every field below is yours alone; nothing is prefilled. Do this within a day of the lesson or lecture, or the notes stay flagged unfinished.</p>"

    html += "<label class=\"flabel\">" + esc(p.name) + "</label><textarea id=\"org-redraw-" + p.id + "\" placeholder=\"Name and one line function, from memory\">" + esc((org.redraw || {})[p.id] || "") + "</textarea>";
  });

    html += "<h3>Comparison matrix (required for this topic): " + esc(t.matrix.title) + "</h3>"
      + "<p class=\"muted small\">Fill every cell in your own words. The canonical comparison is in the lesson; this matrix is your version of it.</p>"
      + "<table class=\"md\"><tr><th></th>" + t.matrix.columns.map(function(col){ return "<th>" + esc(col) + "</th>"; }).join("") + "</tr>";
    t.matrix.rows.forEach(function(row, r){
      html += "<tr><th>" + esc(row) + "</th>" + t.matrix.columns.map(function(col, ci){
        return "<td><textarea id=\"org-mx-" + r + "-" + ci + "\" style=\"min-height:44px\">" + esc(((org.matrix || {})[r + ":" + ci]) || "") + "</textarea></td>";
      }).join("") + "</tr>";
    });
    html += "</table>";
  }
  html += "<label class=\"flabel\">Concept map (optional, at most one per topic: nodes and labelled links, in words)</label>"
    + "<textarea id=\"org-map\">" + esc(org.conceptMap || "") + "</textarea>"
    + "<p><button onclick=\"saveOrganize('" + c.id + "','" + t.id + "')\">Save and complete Organize</button> <span id=\"orgmsg\" class=\"small\"></span></p>";
  el.innerHTML = html;
}
function saveOrganize(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var org = { blocks: {}, redraw: {}, matrix: {} };
  org.principle = $("org-principle").value.trim();
  org.workedExample = $("org-worked").value.trim();
  org.cueQuestions = $("org-cues").value.trim();
  org.confusions = $("org-confusions").value.trim();
  org.summary = $("org-summary").value.trim();
  org.conceptMap = $("org-map").value.trim();
  var missing = [];
  t.pieces.forEach(function(p){
    org.blocks[p.id] = $("org-block-" + p.id).value.trim();
    org.redraw[p.id] = $("org-redraw-" + p.id).value.trim();
    if (!org.redraw[p.id]) missing.push("redraw for " + p.name);
  });
  if (t.matrix){
    t.matrix.rows.forEach(function(row, r){ t.matrix.columns.forEach(function(col, ci){
      org.matrix[r + ":" + ci] = $("org-mx-" + r + "-" + ci).value.trim();
      if (!org.matrix[r + ":" + ci]) missing.push("matrix cell: " + row + " / " + col);
    }); });
  }
  if (!org.principle) missing.push("the principle");
  if (!org.summary) missing.push("the summary");
  if (org.summary && org.summary.split("\n").filter(function(x){ return x.trim(); }).length > 3) missing.push("a summary of 3 lines at most");
  ts.organize = org; saveState();
  var msg = $("orgmsg");
  if (missing.length){ msg.className = "small err"; msg.textContent = "Still needed: " + missing.join("; ") + "."; return; }
  ts.completed[2] = true; saveState();
  msg.className = "small okmsg"; msg.textContent = "Organize complete.";
  location.hash = "#/topic/" + cid + "/" + tid + "/3";
}

/* ---------- Stage 3: Encode ---------- */
function renderEncode(el, c, t){
  var ts = tstate(c.id, t.id);
  var html = "<h2>Stage 4 · Encode</h2>"
    + "<p class=\"muted\">Sort problems by their solution principle before solving anything: name the principle and the cue that gave it away. Then build the template card for each method, in your own words.</p>";
  if (t.sorting && t.sorting.length){
    var principles = [];
    t.sorting.forEach(function(s){ if (principles.indexOf(s.principle) === -1) principles.push(s.principle); });
    html += "<h3>Sorting drill</h3><div id=\"sortwrap\">";
    t.sorting.forEach(function(s, i){
      html += "<div class=\"card\"><p>" + esc(s.statement) + "</p>"
        + "<select id=\"sort-" + i + "\"><option value=\"\">Choose the principle…</option>"
        + principles.map(function(p){ return "<option value=\"" + esc(p) + "\">" + esc(p) + "</option>"; }).join("") + "</select>"
        + "<p class=\"small\" id=\"sortfb-" + i + "\"></p></div>";
    });
    html += "<p><button class=\"secondary\" onclick=\"checkSorting('" + c.id + "','" + t.id + "')\">Check the sort</button> "
      + "<span class=\"small muted\">Best so far: " + (ts.sorting.best != null ? Math.round(ts.sorting.best * 100) + "%" : "not attempted") + ". 80% completes this part.</span></p></div>";
  }
  (t.methods || []).forEach(function(m){
    var card = (ts.cards || {})[m.id] || {};
    html += "<div class=\"card\"><h3>Template card: " + esc(m.name) + "</h3>"
      + "<p class=\"small muted\">Trigger: " + esc(m.trigger) + "</p>";
    [["givens", "Givens (what the problem hands you)"], ["find", "Find (what you must produce)"], ["formula", "Formula or rule"], ["steps", "Steps, in order"], ["failureModes", "Failure modes"], ["example", "One canonical example, rebuilt by you"]].forEach(function(f){
      html += "<label class=\"flabel\">" + f[1] + "</label><textarea id=\"card-" + m.id + "-" + f[0] + "\">" + esc(card[f[0]] || "") + "</textarea>";
    });
    html += "</div>";
  });
  if (!(t.sorting && t.sorting.length) && !(t.methods && t.methods.length))
    html += "<p class=\"muted\">This topic has no sorting drill and no methods, so this stage has nothing to build.</p>";
  html += "<p><button onclick=\"saveEncode('" + c.id + "','" + t.id + "')\">Save and complete Encode</button> <span id=\"encmsg\" class=\"small\"></span></p>";
  el.innerHTML = html;
}
function checkSorting(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var right = 0;
  t.sorting.forEach(function(s, i){
    var sel = $("sort-" + i), fb = $("sortfb-" + i);
    var ok = sel.value === s.principle;
    if (ok) right++;
    fb.innerHTML = ok ? "<span class=\"okmsg\">Correct: " + esc(s.principle) + ".</span> " + esc(s.cue) : "<span class=\"err\">It is: " + esc(s.principle) + ".</span> " + esc(s.cue);
  });
  var pct = right / t.sorting.length;
  ts.sorting.best = Math.max(ts.sorting.best || 0, pct); saveState();
}
function saveEncode(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid), missing = [];
  (t.methods || []).forEach(function(m){
    var card = {};
    ["givens", "find", "formula", "steps", "failureModes", "example"].forEach(function(f){ card[f] = $("card-" + m.id + "-" + f).value.trim(); });
    ts.cards[m.id] = card;
    if (!card.givens || !card.formula) missing.push("givens and formula on the " + m.name + " card");
  });
  if (t.sorting && t.sorting.length && (ts.sorting.best || 0) < 0.8) missing.push("a sorting score of at least 80%");
  saveState();
  var msg = $("encmsg");
  if (missing.length){ msg.className = "small err"; msg.textContent = "Still needed: " + missing.join("; ") + "."; return; }
  ts.completed[3] = true; saveState();
  msg.className = "small okmsg"; msg.textContent = "Encode complete.";
  location.hash = "#/topic/" + cid + "/" + tid + "/4";
}
</script>
<script>
"use strict";
/* ============================== STAGE 4: PRACTICE ============================== */
function renderPractice(el, c, t){
  var ts = tstate(c.id, t.id);
  var handwritten = c.productionMode === "handwritten";
  var html = "<h2>Stage 5 · Practice</h2>"
    + "<p class=\"muted\">Three rungs: worked, then completion, then full problems unaided. " + (handwritten ? "This course is assessed handwritten, so production here is written on paper; reveal the solution only after your attempt, then mark yourself honestly." : "Produce each answer before revealing its solution, then mark yourself honestly.") + "</p>"
    + "<p class=\"small muted\">Course AI rule: " + esc(c.aiPolicy) + "</p>";
  if (!(t.practice && t.practice.length)) html += "<p class=\"muted\">No practice items for this topic.</p>";
  (t.practice || []).forEach(function(item, i){
    var st = (ts.practice || {})[i] || {};
    html += "<div class=\"card\"><h3>" + esc(item.rung.charAt(0).toUpperCase() + item.rung.slice(1)) + ": " + esc(item.title) + "</h3>"
      + md(item.prompt)
      + "<div id=\"prac-sol-" + i + "\" class=\"hidden\">" + md(item.solution) + "</div>"
      + "<p><button class=\"secondary\" onclick=\"togglePracticeSolution(this," + i + ")\">Reveal solution</button> "
      + "<button class=\"plain\" onclick=\"markPractice('" + c.id + "','" + t.id + "'," + i + ",'done')\">I had it</button> "
      + "<button class=\"plain\" onclick=\"markPractice('" + c.id + "','" + t.id + "'," + i + ",'missed')\">I missed it</button> "
      + "<span class=\"small muted\" id=\"prac-st-" + i + "\">" + (st.status === "done" ? "Marked: had it." : (st.status === "missed" ? "Marked: missed. File it below if it is not already in the log." : "")) + "</span></p>"
      + (st.status === "missed" ? "<p><button class=\"secondary\" onclick=\"filePracticeMiss('" + c.id + "','" + t.id + "'," + i + ")\">File this miss to the error log</button> <span class=\"small muted\">You will complete the entry (wrong step, correct principle) in the Error Log.</span></p>" : "")
      + "</div>";
  });
  html += "<p><button onclick=\"completePractice('" + c.id + "','" + t.id + "')\">Complete Practice</button> <span id=\"pracmsg\" class=\"small\"></span></p>";
  el.innerHTML = html;
}
function togglePracticeSolution(btn, i){
  var el = $("prac-sol-" + i); var open = el.classList.toggle("hidden") === false;
  btn.textContent = open ? "Hide solution" : "Reveal solution";
}
function markPractice(cid, tid, i, status){
  var ts = tstate(cid, tid);
  ts.practice[i] = { status: status, date: todayStr() }; saveState();
  renderTopic(cid, tid, 4);
}
function filePracticeMiss(cid, tid, i){
  var c = courseById(cid), t = topicById(c, tid).topic, item = t.practice[i];
  var entry = fileErrorDraft(cid, tid, null, null);
  entry.problem = item.title + "\n\n" + item.prompt;
  entry.principle = "practice";
  saveState();
  location.hash = "#/errors";
}
function completePractice(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var unmarked = (t.practice || []).filter(function(item, i){ return !((ts.practice || {})[i] || {}).status; }).length;
  var msg = $("pracmsg");
  if (unmarked){ msg.className = "small err"; msg.textContent = "Mark every practice item first (" + unmarked + " unmarked)."; return; }
  ts.completed[4] = true; saveState();
  location.hash = "#/topic/" + cid + "/" + tid + "/5";
}

/* ============================== QUIZ RUNNER ============================== */
var run = null;
function pickServing(topic, ts, n){
  var unused = topic.questions.filter(function(q){ return ts.usedQ.indexOf(q.id) === -1; });
  var rest = topic.questions.filter(function(q){ return ts.usedQ.indexOf(q.id) !== -1; });
  return shuffle(unused).concat(shuffle(rest)).slice(0, Math.min(n, topic.questions.length));
}
function renderQuizStart(el, c, t){
  var ts = tstate(c.id, t.id);
  var last = ts.quizServings[ts.quizServings.length - 1];
  el.innerHTML = "<h2>Stage 6 · Quiz</h2>"
    + "<p class=\"muted\">Closed book, in this course's test format: " + (c.productionMode === "handwritten" ? "write every answer on paper, then self-mark against the revealed solution." : "produce every answer before revealing its solution.") + " For every question you rate your confidence before any feedback is shown. Every miss drafts an error log entry and schedules its own retests.</p>"
    + "<p class=\"small muted\">Course AI rule: " + esc(c.aiPolicy) + "</p>"
    + (last ? "<p class=\"small\">Last quiz: " + Math.round(last.score * 100) + "% (" + last.n + " questions, " + last.date + ").</p>" : "")
    + "<p><button onclick=\"startTopicQuiz('" + c.id + "','" + t.id + "')\">Start the quiz</button></p>";
}
function startTopicQuiz(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var qs = pickServing(t, ts, 6);
  startRun({ cid: cid, mode: "quiz", tid: tid, title: "Quiz: " + t.title, items: qs.map(function(q){ return { topic: t, q: q, cid: cid }; }) });
}
function renderRetrieval(cid, tid){
  var c = courseById(cid), found = c ? topicById(c, tid) : null, app = $("app");
  if (!found){ app.innerHTML = "<p>Topic not found.</p>"; return; }
  var ts = tstate(cid, tid);
  var pieces = (found.topic.pieces || []).map(function(p){ return p.name; }).join(" · ");
  app.innerHTML = "<p><a href=\"#/course/" + cid + "\">&larr; " + esc(c.name) + "</a></p><h1>Retrieval: " + esc(found.topic.title) + "</h1>"
    + "<p class=\"muted\">First, free-recall on a blank page with notes closed. Then a short closed-book set of fresh questions. Clean spaced retrievals so far: " + ts.retrievals.length + " of 3 needed, on separate days, for this topic to count as learned.</p>"
    + "<div class=\"card\"><h3>Free recall</h3>"
    + "<p class=\"small muted\">Write everything you can remember about this topic" + (pieces ? " (" + esc(pieces) + ")" : "") + ". Do not open notes.</p>"
    + "<textarea id=\"freerecall\" placeholder=\"From memory: definitions, steps, cues, traps…\"></textarea>"
    + "<p><button onclick=\"startRetrievalAfterRecall('" + cid + "','" + tid + "')\">Continue to the retrieval set</button> <span id=\"recallmsg\" class=\"small\"></span></p></div>";
}
function startRetrievalAfterRecall(cid, tid){
  var box = $("freerecall"), msg = $("recallmsg");
  var text = box ? box.value.trim() : "";
  if (!text || text.length < 20){
    if (msg){ msg.className = "small err"; msg.textContent = "Write at least a short free-recall paragraph before the cued set."; }
    return;
  }
  var ts = tstate(cid, tid);
  ts.lastFreeRecall = { date: todayStr(), n: text.length };
  saveState();
  startRetrieval(cid, tid);
}
function startRetrieval(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var qs = pickServing(t, ts, 4);
  startRun({ cid: cid, mode: "retrieval", tid: tid, title: "Retrieval: " + t.title, items: qs.map(function(q){ return { topic: t, q: q, cid: cid }; }) });
}
function renderFinal(cid){
  var c = courseById(cid), app = $("app");
  if (!c){ app.innerHTML = "<p>Course not found.</p>"; return; }
  var pool = 0;
  allTopics(c).forEach(function(x){ pool += x.topic.questions.length; });
  var past = state.finals.filter(function(f){ return f.cid === cid; });
  var last = past[past.length - 1];
  app.innerHTML = "<p><a href=\"#/course/" + cid + "\">&larr; " + esc(c.name) + "</a></p><h1>Final practice: " + esc(c.name) + "</h1>"
    + "<p class=\"muted\">A mixed set of 10 questions drawn from every topic in the course (" + pool + " in the pools). Same rules as a topic quiz: confidence before feedback, and every miss drafts an error log entry.</p>"
    + (last ? "<p class=\"small\">Last final practice: " + Math.round(last.score * 100) + "% (" + last.n + " questions, " + last.date + ").</p>" : "")
    + "<p><button onclick=\"startFinal('" + cid + "')\">Start the final practice</button></p>";
}
function startFinal(cid){
  var c = courseById(cid), all = [];
  allTopics(c).forEach(function(x){ x.topic.questions.forEach(function(q){ all.push({ topic: x.topic, q: q, cid: cid }); }); });
  startRun({ cid: cid, mode: "final", title: "Final practice: " + c.name, items: shuffle(all).slice(0, Math.min(10, all.length)) });
}
function courseFinalDate(c){
  if (c.finals && c.finals.length){
    var dates = c.finals.map(function(f){ return f.date; }).filter(Boolean).sort();
    if (dates.length) return dates[0];
  }
  return (COURSE_TIME[c.id] && COURSE_TIME[c.id].final) || (c.termDates && c.termDates.end) || null;
}
function renderSprint(){
  var app = $("app");
  var ranked = COURSES.map(function(c){
    var d = courseFinalDate(c);
    return { c: c, date: d, days: d ? daysBetween(todayStr(), d) : null };
  }).filter(function(x){ return x.days != null && x.days >= 0; })
    .sort(function(a, b){ return a.days - b.days; });
  var top = ranked.slice(0, 3);
  var html = "<p><a href=\"#/\">&larr; Today</a></p><h1>Interleave sprint</h1>"
    + "<p class=\"muted\">Six mixed questions from the courses closest to their finals. Same rules as a quiz: confidence before feedback, and every miss needs a one-sentence Why? before you continue.</p>";
  if (!top.length){
    html += "<p class=\"muted\">No upcoming finals are on the calendar.</p>";
    app.innerHTML = html;
    return;
  }
  html += "<ul class=\"tight\">" + top.map(function(x){
    return "<li>" + esc(x.c.name.split(":")[0]) + " · final in " + x.days + " day" + (x.days === 1 ? "" : "s") + " (" + esc(x.date) + ")</li>";
  }).join("") + "</ul>"
    + "<p><button onclick=\"startInterleaveSprint()\">Start the sprint</button></p>";
  app.innerHTML = html;
}
function startInterleaveSprint(){
  var ranked = COURSES.map(function(c){
    var d = courseFinalDate(c);
    return { c: c, days: d ? daysBetween(todayStr(), d) : 9999 };
  }).filter(function(x){ return x.days >= 0 && x.days < 9000; })
    .sort(function(a, b){ return a.days - b.days; }).slice(0, 3);
  var byCourse = ranked.map(function(r){
    var items = [];
    allTopics(r.c).forEach(function(x){
      (x.topic.questions || []).forEach(function(q){
        items.push({ topic: x.topic, q: q, cid: r.c.id });
      });
    });
    return shuffle(items);
  });
  var picked = [], i = 0;
  while (picked.length < 6){
    var progressed = false;
    byCourse.forEach(function(list){
      if (picked.length >= 6 || !list.length) return;
      picked.push(list.shift());
      progressed = true;
    });
    if (!progressed) break;
    i++;
    if (i > 40) break;
  }
  if (!picked.length){ alert("No questions are available for a sprint yet."); return; }
  startRun({ cid: picked[0].cid, mode: "sprint", title: "Interleave sprint", items: shuffle(picked) });
}
function startRun(cfg){
  run = { cid: cfg.cid, mode: cfg.mode, tid: cfg.tid || null, entry: cfg.entry || null, title: cfg.title, items: cfg.items, idx: 0, correct: 0, misses: [], sel: null, produced: false, conf: null, checked: false, selfMark: null, lastRight: true, missWhy: "" };
  renderRunQuestion();
}
function renderRunQuestion(){
  var app = $("app"), c = courseById(run.cid);
  var item = run.items[run.idx], q = item.q;
  var html = "<p class=\"small muted\">" + esc(run.title) + " · Question " + (run.idx + 1) + " of " + run.items.length + " · " + run.correct + " correct so far</p>"
    + "<div class=\"card\">" + md(q.prompt);
  if (q.type === "mc"){
    html += q.options.map(function(opt, i){
      return "<button class=\"opt\" id=\"opt-" + i + "\" onclick=\"runSelect(" + i + ")\">" + esc(opt) + "</button>";
    }).join("");
  } else {
    if (c.productionMode === "handwritten"){
      html += "<p class=\"muted\">Write your answer on paper now, in full, before doing anything else here.</p>"
        + "<p><button class=\"secondary\" id=\"producedbtn\" onclick=\"runProduced()\">I have written it on paper</button></p>";
    } else {
      html += "<textarea id=\"prodanswer\" placeholder=\"Your answer\"></textarea>"
        + "<p><button class=\"secondary\" id=\"producedbtn\" onclick=\"runProduced()\">Ready to check</button></p>";
    }
  }
  html += "<label class=\"flabel\">Confidence before checking (0 to 100)</label>"
    + "<input type=\"number\" id=\"confinput\" min=\"0\" max=\"100\" placeholder=\"Type a number: how sure are you?\" oninput=\"runConf()\">"
    + "<p><button id=\"checkbtn\" onclick=\"runCheck()\" disabled>Check answer</button></p>"
    + "<div id=\"runfeedback\"></div></div>";
  app.innerHTML = html;
}
function runSelect(i){
  if (run.checked) return;
  run.sel = i;
  run.items[run.idx].q.options.forEach(function(_, j){ var b = $("opt-" + j); if (b) b.classList.toggle("sel", j === i); });
  updateCheckBtn();
}
function runProduced(){ run.produced = true; var b = $("producedbtn"); if (b){ b.disabled = true; b.textContent = "Answer produced"; } updateCheckBtn(); }
function runConf(){ var v = $("confinput").value; run.conf = v === "" ? null : Math.max(0, Math.min(100, parseInt(v, 10))); updateCheckBtn(); }
function updateCheckBtn(){
  var q = run.items[run.idx].q;
  var ready = run.conf != null && (q.type === "mc" ? run.sel != null : run.produced);
  var b = $("checkbtn"); if (b) b.disabled = !ready;
}
function runCheck(){
  var item = run.items[run.idx], q = item.q;
  var fb = $("runfeedback");
  if (q.type === "mc"){
    run.checked = true;
    var right = run.sel === q.answer;
    q.options.forEach(function(_, j){ var b = $("opt-" + j); if (b){ b.disabled = true; if (j === q.answer) b.classList.add("right"); else if (j === run.sel) b.classList.add("wrong"); } });
    $("checkbtn").disabled = true;
    finishAnswer(right);
    fb.innerHTML = feedbackHtml(q, right) + nextBtnHtml();
  } else {
    run.checked = true;
    $("checkbtn").disabled = true;
    fb.innerHTML = "<h3>Solution</h3>" + md(q.solution)
      + "<p>Mark your paper answer honestly:</p>"
      + "<p><button class=\"secondary\" onclick=\"runSelfMark(true)\">I had it right</button> "
      + "<button class=\"plain\" onclick=\"runSelfMark(false)\">I missed it</button></p><div id=\"selfmarkfb\"></div>";
  }
}
function runSelfMark(right){
  var q = run.items[run.idx].q;
  finishAnswer(right);
  var fb = $("selfmarkfb");
  fb.innerHTML = feedbackHtml(q, right) + nextBtnHtml();
}
function feedbackHtml(q, right){
  var html = "<div class=\"feedback " + (right ? "ok" : "no") + "\"><strong>" + (right ? "Correct." : "Missed.") + "</strong>"
    + "<p><strong>Step:</strong> " + esc(q.feedback.step) + "</p>"
    + "<p><strong>Why:</strong> " + esc(q.feedback.why) + "</p>"
    + "<p><strong>Cue:</strong> " + esc(q.feedback.cue) + "</p></div>";
  if (!right && run.mode !== "retest"){
    html += "<div class=\"misswhy\"><label class=\"flabel\">Why was that wrong? One sentence in your own words</label>"
      + "<textarea id=\"misswhy\" placeholder=\"The wrong step or the principle I confused…\" oninput=\"runMissWhy()\"></textarea>"
      + "<p class=\"small muted\" id=\"misswhymsg\">Required before you continue. This becomes the wrong-step draft in the error log.</p></div>";
  }
  return html;
}
function nextBtnHtml(){
  var last = run.idx >= run.items.length - 1;
  var needWhy = !run.lastRight && run.mode !== "retest";
  return "<p><button id=\"nextbtn\" onclick=\"runNext()\"" + (needWhy ? " disabled" : "") + ">"
    + (last ? "Finish" : "Next question →") + "</button></p>";
}
function runMissWhy(){
  var box = $("misswhy");
  run.missWhy = box ? box.value.trim() : "";
  var b = $("nextbtn");
  if (b) b.disabled = !run.missWhy;
  var msg = $("misswhymsg");
  if (msg && run.missWhy){ msg.className = "small okmsg"; msg.textContent = "Ready to continue."; }
}
function finishAnswer(right){
  var item = run.items[run.idx];
  run.lastRight = !!right;
  run.missWhy = "";
  if (right){ run.correct++; return; }
  if (run.mode === "retest"){
    var e = run.entry;
    e.clean = 0; e.stageIdx = 0; e.nextDue = addDays(todayStr(), 1);
    e.served.push(item.q.id);
    var d = fileErrorDraft(item.cid || run.cid, e.tid, item.q, run.conf);
    run.retestDraft = d.id;
    saveState();
  } else {
    run.misses.push({ topic: item.topic, q: item.q, confidence: run.conf, cid: item.cid || run.cid, why: "" });
  }
}
function runNext(){
  if (!run.lastRight && run.mode !== "retest"){
    var box = $("misswhy");
    var why = (box && box.value.trim()) || run.missWhy || "";
    if (!why){
      var msg = $("misswhymsg");
      if (msg){ msg.className = "small err"; msg.textContent = "Write why that was wrong before continuing."; }
      return;
    }
    var lastMiss = run.misses[run.misses.length - 1];
    if (lastMiss) lastMiss.why = why;
  }
  if (run.idx < run.items.length - 1){
    run.idx++; run.sel = null; run.produced = false; run.conf = null; run.checked = false; run.lastRight = true; run.missWhy = "";
    renderRunQuestion();
  } else finishRun();
}
function finishRun(){
  var app = $("app"), n = run.items.length, frac = n ? run.correct / n : 0;
  var html = "<h1>" + esc(run.title) + ": done</h1>"
    + "<p>Score: <strong>" + Math.round(frac * 100) + "%</strong> (" + run.correct + " of " + n + ").</p>";
  if (run.mode === "quiz"){
    var qids = run.items.map(function(it){ return it.q.id; });
    recordQuizResult(run.cid, run.tid, frac, n, qids);
    tstate(run.cid, run.tid).completed[5] = true; saveState();
    if (frac < 0.5) html += "<p class=\"err\">Under half. This topic returns tomorrow, smaller, with a worked example first.</p>";
    else if (frac < 0.7) html += "<p>Between half and 70%: this topic returns sooner and smaller on the schedule.</p>";
    else html += "<p>A retrieval is now scheduled; this topic counts as learned after 3 successful spaced retrievals on separate days.</p>";
    html += "<p><a class=\"btn\" href=\"#/topic/" + run.cid + "/" + run.tid + "/5\">Back to the topic</a></p>";
  } else if (run.mode === "retrieval"){
    recordRetrievalResult(run.cid, run.tid, frac, n, run.items.map(function(it){ return it.q.id; }));
    var ts = tstate(run.cid, run.tid);
    html += ts.learned ? "<p class=\"okmsg\">That was the third clean spaced retrieval: this topic now counts as learned.</p>" : "<p>Next retrieval for this topic: " + esc(ts.nextRetrieval || "") + ".</p>";
    html += "<p><a class=\"btn\" href=\"#/course/" + run.cid + "\">Back to the course</a></p>";
  } else if (run.mode === "final"){
    state.finals.push({ cid: run.cid, date: todayStr(), score: frac, n: n }); saveState();
    html += "<p><a class=\"btn\" href=\"#/course/" + run.cid + "\">Back to the course</a></p>";
  } else if (run.mode === "sprint"){
    html += "<p class=\"muted\">Interleaved across the courses nearest their finals. Misses below still need a scheduled retest once you confirm the wrong step and correct principle.</p>";
    html += "<p><a class=\"btn\" href=\"#/\">Back to Today</a> <a class=\"btn secondary\" href=\"#/sprint\">Sprint again</a></p>";
  } else if (run.mode === "retest"){
    var e = run.entry;
    if (frac >= 1){
      // single question run: correct path handled here (miss path handled in finishAnswer)
      e.clean = (e.clean || 0) + 1;
      e.served.push(run.items[0].q.id);
      if (e.clean >= 3){ e.status = "closed"; html += "<p class=\"okmsg\">Third clean retrieval: this error entry is closed.</p>"; }
      else { e.stageIdx = Math.min((e.stageIdx || 0) + 1, RETEST_GAPS.length - 1); e.nextDue = addDays(todayStr(), RETEST_GAPS[e.stageIdx]); html += "<p>Clean retrieval " + e.clean + " of 3. Next retest: " + esc(e.nextDue) + ".</p>"; }
      saveState();
    } else {
      html += "<p class=\"err\">Missed. This entry returns tomorrow, and the miss itself has been drafted as a new entry below.</p>";
    }
    html += "<p><a class=\"btn\" href=\"#/errors\">Back to the Error Log</a></p>";
  }
  if (run.misses.length){
    html += "<h2>File the misses</h2><p class=\"muted\">Each miss is already drafted. Your Why? note is filled in as the wrong step — add or edit the correct principle, then schedule the retests.</p>";
    run.misses.forEach(function(m){
      var entry = fileErrorDraft(m.cid || run.cid, m.topic.id, m.q, m.confidence);
      if (m.why) entry.wrongStep = m.why;
      saveState();
      html += errorDraftForm(entry, m.topic.title);
    });
  }
  run = null;
  app.innerHTML = html;
}
