<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17635a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StudyHub">
<title>Integrated Learning Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================ design system ============================
     Integrated Learning Plan: warm paper, deep ink, one teal accent.
     Display serif: Fraunces. Body: Inter. All colors flow through the
     variables below; dark mode is the same variables under
     prefers-color-scheme. See README.md, "Design system". */
  :root {
    --bg:#faf7f1; --surface:#fffdf8; --surface-muted:#f2ecdf;
    --ink:#1b2330; --muted:#626c7a;
    --line:#e3dbc9; --line-strong:#cfc4ab;
    --accent:#17635a; --accent-strong:#0e4c44; --accent-soft:#e2efeb; --accent-ink:#ffffff;
    --good:#1e7d46; --good-soft:#e7f3ea; --good-line:#a9d6ba;
    --bad:#b3372e; --bad-soft:#faebe9; --bad-line:#eba79f;
    --warn:#8a6d1a; --warn-soft:#faf3d9; --warn-line:#e3d193;
    --stage-bg:#eef0e9;
    --shadow-sm:0 1px 2px rgba(27,35,48,.05), 0 2px 10px rgba(27,35,48,.04);
    --shadow-md:0 2px 4px rgba(27,35,48,.05), 0 14px 34px rgba(27,35,48,.09);
    --ring:0 0 0 3px var(--accent-soft);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#10151c; --surface:#171e28; --surface-muted:#1f2833;
      --ink:#ece9e1; --muted:#9aa6b2;
      --line:#2a3442; --line-strong:#3d4a5c;
      --accent:#5fc2ae; --accent-strong:#93dcc9; --accent-soft:#16302a; --accent-ink:#0a2420;
      --good:#7bc794; --good-soft:#17301f; --good-line:#2e5c3e;
      --bad:#e08a81; --bad-soft:#3a1f1c; --bad-line:#6e3a34;
      --warn:#d9bc6a; --warn-soft:#33290f; --warn-line:#5f4d1c;
      --stage-bg:#232d38;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25);
      --shadow-md:0 2px 4px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--bg);
         font-family:"Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         font-size:18px; line-height:1.6; font-variant-numeric:tabular-nums;
         -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--accent-soft); }

  /* header */
  header.site { position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
                background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent);
                backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  header.site .wrap { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding-top:13px; padding-bottom:13px; }
  header.site a { color:var(--ink); text-decoration:none; }
  header.site .brand { display:inline-flex; align-items:center; font-family:"Fraunces", Georgia, "Times New Roman", serif;
                       font-weight:600; font-size:21px; letter-spacing:.01em; margin-right:8px; }
  header.site .brand::before { content:""; width:9px; height:9px; border-radius:3px; background:var(--accent);
                               transform:rotate(45deg); margin-right:11px; flex:none; }
  header.site nav { display:flex; gap:2px; flex-wrap:wrap; align-items:center; }
  header.site nav a { color:var(--muted); font-size:15px; font-weight:500; padding:6px 11px; border-radius:999px;
                      transition:color .15s ease, background .15s ease; }
  header.site nav a:hover { color:var(--accent-strong); background:var(--accent-soft); }

  /* notifications bell */
  .bell { margin-left:auto; position:relative; flex:none; width:42px; height:42px; border-radius:999px;
          display:inline-flex; align-items:center; justify-content:center;
          border:1px solid var(--line); background:var(--surface); color:var(--ink);
          transition:color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  .bell:hover { color:var(--accent-strong); border-color:var(--line-strong); box-shadow:var(--shadow-sm); }
  .bellbadge { position:absolute; top:-5px; right:-5px; min-width:20px; height:20px; padding:0 5px;
               border-radius:999px; background:var(--bad); color:#fff; font-size:12px; font-weight:700;
               display:flex; align-items:center; justify-content:center; border:2px solid var(--surface); }

  /* course toggle: one pill track, a thumb that slides between classes */
  .seg { position:relative; display:flex; gap:2px; flex:1 1 auto; min-width:0;
         background:var(--surface-muted); border:1px solid var(--line); border-radius:999px;
         padding:3px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
         -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;
         user-select:none; -webkit-user-select:none; }
  .seg a { -webkit-user-drag:none; }
  .seg::-webkit-scrollbar { display:none; }
  .seg-thumb { position:absolute; top:3px; bottom:3px; left:0; width:0; border-radius:999px;
               background:var(--accent); box-shadow:var(--shadow-sm); opacity:0;
               transition:transform .28s cubic-bezier(.3,.7,.3,1), width .28s cubic-bezier(.3,.7,.3,1), opacity .2s ease; }
  .seg a { position:relative; z-index:1; flex:1 0 auto; text-align:center; white-space:nowrap;
           padding:7px 12px; border-radius:999px; font-size:14.5px; font-weight:600;
           color:var(--muted); text-decoration:none; transition:color .2s ease; }
  .seg a:hover { color:var(--accent-strong); }
  .seg a.active { color:var(--accent-ink); }
  @media (max-width:640px){
    .seg { flex-basis:100%; order:3; }
    .seg a { padding:9px 6px; font-size:0; }
    .seg a::after { content:attr(data-short); font-size:13.5px; }
  }

  /* notebook */
  .nbtools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0 8px; }
  .nbswatch { width:34px; height:34px; border-radius:999px; padding:0; border:2px solid var(--line);
              box-shadow:inset 0 0 0 2px var(--surface); flex:none; }
  .nbswatch.cur { border-color:var(--ink); transform:scale(1.08); }
  .nbtoolcur { background:var(--accent) !important; color:var(--accent-ink) !important; border-color:var(--accent) !important; }
  .nbsheetwrap { margin-top:10px; border-radius:10px; overflow:hidden; border:1px solid var(--line-strong);
                 box-shadow:var(--shadow-md); background:#fffdf8; }
  #nbcanvas { display:block; width:100%; height:auto; touch-action:none; cursor:crosshair; }

  .wrap { max-width:840px; margin:0 auto; padding:26px 20px 64px; }

  /* type */
  h1, h2 { font-family:"Fraunces", Georgia, "Times New Roman", serif; font-weight:600; letter-spacing:-.01em; }
  h1 { font-size:35px; line-height:1.15; margin:8px 0 8px; }
  h2 { font-size:25px; line-height:1.25; margin:34px 0 10px; }
  h3 { font-family:"Fraunces", Georgia, "Times New Roman", serif; font-weight:600; font-size:20px; line-height:1.3; margin:22px 0 6px; }
  p { margin:9px 0; }
  .muted { color:var(--muted); font-size:16px; }
  .small { font-size:15px; }
  a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px; transition:color .15s ease; }
  a:hover { color:var(--accent-strong); }
  strong { font-weight:600; }

  /* cards */
  .card { border:1px solid var(--line); border-radius:16px; padding:22px 24px; margin:16px 0;
          background:var(--surface); box-shadow:var(--shadow-sm);
          transition:box-shadow .2s ease, border-color .2s ease; animation:fadeUp .28s ease both; }
  .card:hover { box-shadow:var(--shadow-md); border-color:var(--line-strong); }
  .card h3 { margin-top:0; }
  .course-banner { display:block; width:100%; height:auto; margin:4px 0 18px;
                   border:1px solid var(--line); border-radius:16px; background:var(--surface);
                   box-shadow:var(--shadow-sm); }
  .file-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .file-tools input[type=text] { flex:1 1 180px; margin:0; }
  .file-chips { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 4px; }
  .file-chip.cur { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .file-row { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); }
  .file-ico { flex:none; width:36px; height:36px; color:var(--ink); }
  .file-ico svg { display:block; width:36px; height:36px; }
  .file-main { flex:1; min-width:0; }
  button.file-name { background:transparent; color:var(--ink); border:none; box-shadow:none; padding:0;
                     font-weight:600; text-align:left; display:inline; border-radius:0; word-break:break-word; }
  button.file-name:hover { background:transparent; color:var(--accent-strong); transform:none; box-shadow:none;
                           text-decoration:underline; }
  .file-view { max-height:70vh; overflow:auto; background:var(--surface-muted); border:1px solid var(--line);
               border-radius:12px; padding:14px 16px; white-space:pre-wrap; word-break:break-word;
               font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:15px; line-height:1.5; }
  .file-view.md { font-family:inherit; white-space:normal; }
  .file-preview audio, .file-preview video { display:block; width:100%; max-height:70vh; }
  .file-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .file-group { font-weight:600; margin:16px 0 0; }
  .file-preview { position:fixed; inset:0; z-index:40; display:none; padding:18px;
                  background:rgba(27,35,48,.5); }
  .file-preview.open { display:flex; align-items:flex-start; justify-content:center; overflow:auto; }
  .file-preview-card { background:var(--surface); color:var(--ink); width:min(960px, 100%);
                       border-radius:16px; padding:16px 16px 20px; border:1px solid var(--line);
                       box-shadow:var(--shadow-md); }
  .file-preview img { display:block; width:100%; height:auto; max-height:70vh; object-fit:contain;
                      background:var(--surface-muted); border-radius:12px; }
  .file-preview iframe { display:block; width:100%; height:70vh; border:0; border-radius:12px;
                         background:var(--surface-muted); }
  @media (max-width:640px) {
    .file-actions .btn, .file-actions button, .file-actions a.btn { flex:1 1 auto; text-align:center; }
    .file-preview { padding:10px; }
    .file-preview iframe { height:60vh; }
  }
  .setup { background:var(--accent-soft); border-color:var(--line-strong); border-left:4px solid var(--accent); }
  .bar { height:10px; background:var(--surface-muted); border-radius:999px; overflow:hidden; margin:10px 0 5px;
         box-shadow:inset 0 1px 2px rgba(27,35,48,.08); }
  .bar > div { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--accent), var(--accent-strong));
               transition:width .6s ease; }

  /* progress pills: content (teal) and time to final (amber) */
  .pills { margin:12px 0 4px; display:grid; gap:8px; }
  .pillrow { display:flex; align-items:center; gap:10px; }
  .pillabel { font-size:12.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
              color:var(--muted); flex:0 0 118px; }
  .pill { flex:1; height:12px; border-radius:999px; background:var(--surface-muted);
          border:1px solid var(--line); overflow:hidden;
          box-shadow:inset 0 1px 2px rgba(27,35,48,.08); }
  .pill > div { height:100%; border-radius:999px; transition:width .6s ease; }
  .pill .fc { background:linear-gradient(90deg, var(--accent), var(--accent-strong)); }
  .pill .ft { background:linear-gradient(90deg, var(--warn-line), var(--warn)); }
  .pillpct { font-size:14px; font-weight:600; flex:0 0 42px; text-align:right; }
  @media (max-width:640px){ .pillabel { flex-basis:96px; } }

  /* badges */
  .badge { display:inline-block; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
           padding:3px 9px; border-radius:999px; vertical-align:middle; }
  .badge.prov { background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line); }
  .badge.learned { background:var(--good-soft); color:var(--good); border:1px solid var(--good-line); }
  .badge.due { background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad-line); }
  .badge.stage { background:var(--stage-bg); color:var(--muted); border:1px solid var(--line); }

  /* buttons */
  button, .btn { font:inherit; font-size:16px; font-weight:600; cursor:pointer; border:1px solid var(--accent);
                 color:var(--accent-ink); background:var(--accent); border-radius:11px; padding:10px 18px;
                 text-decoration:none; display:inline-block; box-shadow:var(--shadow-sm);
                 transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
  button:hover, .btn:hover { background:var(--accent-strong); border-color:var(--accent-strong);
                             color:var(--accent-ink); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  button:active, .btn:active { transform:translateY(0); box-shadow:var(--shadow-sm); }
  button.secondary, .btn.secondary { background:var(--surface); color:var(--accent); border-color:var(--line-strong); }
  button.secondary:hover, .btn.secondary:hover { background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent); }
  button.plain { background:var(--surface); color:var(--ink); border-color:var(--line); }
  button.plain:hover { background:var(--surface-muted); color:var(--ink); border-color:var(--line-strong); }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  button.opt { display:block; width:100%; text-align:left; margin:9px 0; background:var(--surface); color:var(--ink);
               border:1px solid var(--line); border-radius:13px; padding:14px 16px; font-weight:500; box-shadow:none; }
  button.opt:hover { border-color:var(--accent); background:var(--accent-soft); color:var(--ink); transform:none; box-shadow:none; }
  button.opt.sel { border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--ring); }
  button.opt.right { border-color:var(--good); background:var(--good-soft); }
  button.opt.wrong { border-color:var(--bad); background:var(--bad-soft); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* forms */
  textarea, input[type=text], input[type=number], select { font:inherit; width:100%; padding:11px 12px;
    border:1px solid var(--line); border-radius:11px; margin:4px 0 12px; background:var(--surface); color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease; }
  textarea:focus, input[type=text]:focus, input[type=number]:focus, select:focus {
    border-color:var(--accent); box-shadow:var(--ring); outline:none; }
  textarea { min-height:68px; line-height:1.55; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; vertical-align:-2px; }
  label.flabel { font-weight:600; font-size:16px; display:block; margin-top:16px; }

  /* code and tables */
  pre { background:var(--surface-muted); border:1px solid var(--line); border-radius:13px; padding:14px 16px;
        overflow-x:auto; font-size:15.5px; line-height:1.5; }
  code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.92em; }
  pre code { font-size:15.5px; }
  table.md { border-collapse:separate; border-spacing:0; margin:12px 0; width:100%;
             border:1px solid var(--line); border-radius:13px; overflow:hidden; }
  table.md th, table.md td { border-bottom:1px solid var(--line); border-right:1px solid var(--line);
                             padding:9px 12px; text-align:left; font-size:16.5px; vertical-align:top; }
  table.md th:last-child, table.md td:last-child { border-right:none; }
  table.md tr:last-child td { border-bottom:none; }
  table.md th { background:var(--surface-muted); font-weight:600; }

  /* feedback and reveals */
  .feedback { border-radius:13px; padding:14px 16px; margin:14px 0; animation:fadeUp .25s ease both; }
  .feedback.ok { background:var(--good-soft); border:1px solid var(--good-line); border-left:4px solid var(--good); }
  .feedback.no { background:var(--bad-soft); border:1px solid var(--bad-line); border-left:4px solid var(--bad); }
  .learnpart { animation:fadeUp .25s ease both; }
  div[id^="exbody-"] { animation:fadeUp .25s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  /* stage rail: the 6-stage stepper */
  .rail { display:flex; flex-wrap:wrap; gap:9px; margin:18px 0; }
  .rail button { display:inline-flex; align-items:center; gap:8px; background:var(--surface); color:var(--muted);
                 border:1px solid var(--line); font-size:14.5px; font-weight:500; padding:8px 14px 8px 11px;
                 border-radius:999px; box-shadow:none; }
  .rail button::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex:none; }
  .rail button:hover { border-color:var(--accent); color:var(--ink); background:var(--surface); transform:none; box-shadow:none; }
  .rail button.cur { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
  .rail button.cur::before { background:var(--accent); }
  .rail button.done { border-color:var(--good-line); color:var(--good); }
  .rail button.done::before { background:var(--good); }

  .pager { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:20px 0; }
  .err { color:var(--bad); font-size:16px; }
  .okmsg { color:var(--good); font-size:16px; }
  ul.tight { margin:6px 0; padding-left:22px; }
  ul.tight li { margin:5px 0; }
  .queue-item { display:flex; justify-content:space-between; gap:14px; align-items:baseline; padding:9px 0; }
  .queue-item + .queue-item { border-top:1px solid var(--line); }
  .queue-item a { font-weight:600; font-size:15px; white-space:nowrap; }

  /* next-7-days deadline strip */
  .strip { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .dl { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
        background:var(--surface); color:var(--ink); border:1px solid var(--line);
        border-radius:12px; padding:12px 14px; font-weight:500; box-shadow:none; }
  .dl:hover { border-color:var(--accent); background:var(--accent-soft); color:var(--ink); transform:none; box-shadow:none; }
  .dl.done { opacity:.62; }
  .dl .box { flex:none; width:22px; height:22px; border-radius:6px; border:2px solid var(--line-strong);
             display:inline-flex; align-items:center; justify-content:center; margin-top:2px;
             font-size:14px; line-height:1; background:var(--surface); }
  .dl.done .box { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .dl .when { display:block; font-size:12.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .dl.exam { cursor:default; }
  .dl.exam:hover { background:var(--surface); border-color:var(--line); color:var(--ink); }
  .dl .grow { min-width:0; }
  .loadbanner { margin:0 auto; max-width:840px; padding:14px 20px 0; }
  .loadbanner .card { border-color:var(--bad-line); background:var(--bad-soft); }
  .calrow { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .calmeta { flex:0 0 148px; font-size:13.5px; color:var(--muted); }
  .caltrack { flex:1; height:10px; border-radius:999px; background:var(--surface-muted); border:1px solid var(--line); position:relative; overflow:hidden; }
  .caltrack .acc { position:absolute; left:0; top:0; bottom:0; background:var(--accent); opacity:.85; }
  .caltrack .conf { position:absolute; top:-3px; width:2px; height:16px; background:var(--ink); }
  .nudge { border-left:4px solid var(--warn); }
  @media (max-width:640px) {
    .calmeta { flex-basis:108px; }
    .dl { padding:12px; }
  }
  footer.site { border-top:1px solid var(--line); color:var(--muted); font-size:15px; }
  footer.site .wrap { padding-top:22px; padding-bottom:30px; }
  .hidden { display:none; }

  /* overflow safety at any width: media never exceeds its container, and
     long words, ids, and inline code wrap instead of pushing the page wide.
     (pre keeps white-space:pre, so code blocks still scroll internally.) */
  img, svg, video { max-width:100%; height:auto; }
  body, p, li, td, th, .feedback, button.opt, .queue-item span { overflow-wrap:break-word; }

  /* small screens: phone-first layout. Single column everywhere; the page
     itself never scrolls sideways. Wide things (tables, code) scroll inside
     their own block instead. */
  @media (max-width:640px) {
    body { font-size:17px; }
    .wrap { padding:20px 15px 52px; }
    h1 { font-size:29px; }
    h2 { font-size:22px; }
    .card { padding:18px; border-radius:14px; }
    button, .btn { padding:11px 16px; }
    .queue-item { align-items:flex-start; }

    /* header: compact brand, nav wraps under it, links stay tappable */
    header.site .wrap { padding-top:10px; padding-bottom:10px; gap:8px; }
    header.site .brand { font-size:19px; margin-right:2px; }
    header.site nav { gap:4px; }
    header.site nav a { font-size:14px; padding:11px 10px; } /* ~44px tall */

    /* every form control at 16px or more, so iOS never auto-zooms on focus */
    textarea, input[type=text], input[type=number], select { font-size:16px; }

    /* tap targets and flex safety */
    .rail { gap:7px; }
    .rail button { min-height:44px; font-size:14px; }
    .queue-item span { min-width:0; }
    .queue-item a { display:inline-flex; align-items:center; min-height:44px; padding:0 2px; }

    /* learn pager: prev/next stay on one row, the part label drops below */
    .pager { flex-wrap:wrap; }
    #lpage { order:3; flex:1 1 100%; text-align:center; }

    /* tables scroll inside their own block, never the page */
    table.md { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; }
    table.md th, table.md td { padding:8px 9px; font-size:15.5px; }
    /* the Organize comparison matrix (the only table holding textareas)
       fits the screen instead of scrolling: fixed layout, cells share width */
    table.md:has(textarea) { display:table; table-layout:fixed; overflow-x:visible; }
    table.md:has(textarea) textarea { min-width:0; }

    /* code blocks keep scrolling inside pre, at a phone-readable size */
    pre, pre code { font-size:14.5px; }
    pre { padding:12px; }
  }
  /* very narrow screens: progress pills stack, label and percent on one
     line, the track full width below them */
  @media (max-width:560px) {
    .pillrow { flex-wrap:wrap; row-gap:5px; }
    .pillabel { flex:1 1 auto; }
    .pillpct { order:2; flex:0 0 auto; }
    .pill { order:3; flex:1 1 100%; min-width:0; }
  }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="#/">Integrated Learning Plan</a>
  <nav><a href="#/">Home</a><a href="#/errors">Error Log</a><a href="#/notebook">Notebook</a></nav>
  <div class="seg" id="navcourses" aria-label="Courses"></div>
  <a class="bell" href="#/notifications" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="bellbadge" class="bellbadge hidden">0</span></a>
</div></header>
<div id="loadbanner" class="loadbanner"></div>
<main class="wrap" id="app">Loading courses…</main>
<footer class="site"><div class="wrap">Built for studying. Progress saves in this browser; export your state from Home to move it between devices.</div></footer>

<script src="courses/registry.js"></script>
<script>
"use strict";
/* ============================== utilities ============================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function todayStr(d){ d = d || new Date(); var m = d.getMonth()+1, day = d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day; }
function addDays(str, n){ var d = new Date(str+"T12:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function inlineMd(t){
  return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
}
function md(t){
  if (!t) return "";
  var parts = String(t).split(/```/), out = [];
  for (var i=0;i<parts.length;i++){
    if (i % 2 === 1){ out.push("<pre><code>"+esc(parts[i].replace(/^\n+|\n+$/g,""))+"</code></pre>"); continue; }
    var lines = parts[i].split("\n"), buf = [], mode = null;
    function flush(){
      if (!buf.length) return;
      if (mode === "ul"){ out.push("<ul class=\"tight\">"+buf.map(function(x){ return "<li>"+inlineMd(x)+"</li>"; }).join("")+"</ul>"); }
      else if (mode === "table"){
        var rows = buf.filter(function(x){ return !/^\|[\s\-|]+\|$/.test(x); }).map(function(x){ return x.split("|").slice(1,-1).map(function(c){ return c.trim(); }); });
        var s = "<table class=\"md\">";
        rows.forEach(function(r, ri){ s += "<tr>"+r.map(function(c){ return ri===0 ? "<th>"+inlineMd(c)+"</th>" : "<td>"+inlineMd(c)+"</td>"; }).join("")+"</tr>"; });
        out.push(s+"</table>");
      }
      else { out.push(buf.map(function(x){ return "<p>"+inlineMd(x)+"</p>"; }).join("")); }
      buf = []; mode = null;
    }
    lines.forEach(function(ln){
      var s = ln.trim();
      if (s === ""){ flush(); return; }
      if (s.indexOf("- ") === 0){ if (mode !== "ul") flush(); mode = "ul"; buf.push(s.slice(2)); return; }
      if (s.charAt(0) === "|"){ if (mode !== "table") flush(); mode = "table"; buf.push(s); return; }
      if (mode) flush(); buf.push(s);
    });
    flush();
  }
  return out.join("\n");
}

/* ============================== state ============================== */
var LS_KEY = "ilp-state-v1";
var state = null;
function blankState(){
  return { v:2, topics:{}, errors:[], exampleFlags:{}, finals:[], notebooks:[], deadlineDone:{}, calibration:[], calibrationSeeded:true, activeRun:null };
}
function loadState(){
  try { var raw = localStorage.getItem(LS_KEY); state = raw ? JSON.parse(raw) : blankState(); }
  catch(e){ state = blankState(); }
  if (!state || !state.topics) state = blankState();
  if (migrateState()) saveState();
}
/* Keep the same localStorage key. v2 adds deadline checkoffs, calibration
   rows, and an in-progress quiz, without dropping topics, errors, or notes. */
function migrateState(){
  var changed = false;
  if (!state.errors) { state.errors = []; changed = true; }
  if (!state.exampleFlags) { state.exampleFlags = {}; changed = true; }
  if (!state.finals) { state.finals = []; changed = true; }
  if (!state.notebooks) { state.notebooks = []; changed = true; }
  if (!state.deadlineDone) { state.deadlineDone = {}; changed = true; }
  if (!state.calibration) { state.calibration = []; changed = true; }
  if (!state.v || state.v < 2) { state.v = 2; changed = true; }
  Object.keys(state.topics).forEach(function(k){
    if (/\/undefined$/.test(k)) { delete state.topics[k]; changed = true; }
  });
  if (!state.calibrationSeeded) {
    state.errors.forEach(function(e){
      if (e.confidence != null && !isNaN(Number(e.confidence))) {
        state.calibration.push({ c: Number(e.confidence), ok: false, d: e.created || todayStr(), cid: e.cid || "", src: "error" });
      }
    });
    state.calibrationSeeded = true;
    changed = true;
  }
  return changed;
}
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} updateBell(); }
function tkey(cid, tid){ return cid + "/" + tid; }
function tstate(cid, tid){
  var k = tkey(cid, tid);
  if (!state.topics[k]) state.topics[k] = { completed:{}, predict:{}, learn:{ selfExplains:{}, revisits:0 }, organize:{ blocks:{}, redraw:{}, matrix:{} }, cards:{}, sorting:{}, practice:{}, quizServings:[], usedQ:[], retrievals:[], learned:false, nextRetrieval:null };
  return state.topics[k];
}
function stageDone(cid, tid, idx){ return !!tstate(cid, tid).completed[idx]; }

/* ============================== course registry ============================== */
var COURSES = [];
var COURSE_LOAD_ERRORS = [];
function loadCourses(done){
  window.COURSE_DATA = window.COURSE_DATA || {};
  var ids = window.COURSE_REGISTRY || [];
  var pending = ids.length;
  if (!pending){ done(); return; }
  ids.forEach(function(id){
    var s = document.createElement("script");
    s.src = "courses/" + id + ".js";
    s.onload = function(){ if (--pending === 0) done(); };
    s.onerror = function(){
      COURSE_LOAD_ERRORS.push({ id: id, reason: "courses/" + id + ".js failed to load. Check that the file is committed and that this page can reach it." });
      if (--pending === 0) done();
    };
    document.body.appendChild(s);
  });
}
function collectCourses(){
  var missing = [];
  COURSES = (window.COURSE_REGISTRY || []).map(function(id){
    var c = window.COURSE_DATA[id];
    if (!c) missing.push(id);
    return c;
  }).filter(Boolean);
  missing.forEach(function(id){
    if (!COURSE_LOAD_ERRORS.some(function(e){ return e.id === id; })) {
      COURSE_LOAD_ERRORS.push({ id: id, reason: "courses/" + id + ".js loaded but did not define COURSE_DATA[\"" + id + "\"]." });
    }
  });
  renderLoadErrors();
}
function renderLoadErrors(){
  var el = $("loadbanner"); if (!el) return;
  if (!COURSE_LOAD_ERRORS.length) { el.innerHTML = ""; return; }
  el.innerHTML = "<div class=\"card\"><h3>A course file did not load</h3><ul class=\"tight\">"
    + COURSE_LOAD_ERRORS.map(function(e){ return "<li class=\"small\"><strong>" + esc(e.id) + ".</strong> " + esc(e.reason) + "</li>"; }).join("")
    + "</ul><p class=\"small muted\">Other courses are still available. Fix the file and reload.</p></div>";
}
function courseById(cid){ return COURSES.filter(function(c){ return c.id === cid; })[0] || null; }
function topicById(course, tid){
  var found = null;
  course.chapters.forEach(function(ch){ ch.topics.forEach(function(t){ if (t.id === tid) found = { chapter: ch, topic: t }; }); });
  return found;
}
function allTopics(course){
  var out = [];
  course.chapters.forEach(function(ch){ ch.topics.forEach(function(t){ out.push({ chapter: ch, topic: t }); }); });
  return out;
}
function questionById(course, qid){
  var found = null;
  allTopics(course).forEach(function(x){ x.topic.questions.forEach(function(q){ if (q.id === qid) found = { topic: x.topic, q: q }; }); });
  return found;
}

/* ============================== error log engine ============================== */
var RETEST_GAPS = [1, 4, 9, 21]; // about 1d, 3-4d, 8-10d, 21d
function fileErrorDraft(cid, tid, q, confidence){
  var entry = {
    id: "e" + Date.now() + Math.floor(Math.random()*100000),
    cid: cid, tid: tid, qid: q ? q.id : null,
    problem: q ? q.prompt : "",
    principle: q ? q.principle : "practice",
    difficulty: q ? q.difficulty : 2,
    confidence: (confidence == null ? null : confidence),
    wrongStep: "", correctPrinciple: "",
    status: "draft", created: todayStr(), stageIdx: 0, nextDue: null, clean: 0, served: q ? [q.id] : []
  };
  state.errors.push(entry); saveState();
  return entry;
}
function completeErrorEntry(entry, wrongStep, correctPrinciple){
  entry.wrongStep = wrongStep; entry.correctPrinciple = correctPrinciple;
  entry.status = "open"; entry.stageIdx = 0; entry.clean = 0;
  entry.nextDue = addDays(todayStr(), RETEST_GAPS[0]);
  saveState();
}
function sortedDueErrors(){
  var t = todayStr();
  var open = state.errors.filter(function(e){ return e.status === "open" && e.nextDue && e.nextDue <= t; });
  var counts = {};
  state.errors.forEach(function(e){ if (e.status === "open") counts[e.principle] = (counts[e.principle] || 0) + 1; });
  return open.sort(function(a, b){
    var ra = counts[a.principle] >= 2 ? 0 : 1, rb = counts[b.principle] >= 2 ? 0 : 1;
    if (ra !== rb) return ra - rb;
    var ha = (a.confidence != null && a.confidence >= 80) ? 0 : 1, hb = (b.confidence != null && b.confidence >= 80) ? 0 : 1;
    if (ha !== hb) return ha - hb;
    return a.nextDue < b.nextDue ? -1 : 1;
  });
}
function pickRetestQuestion(entry){
  var course = courseById(entry.cid); if (!course) return null;
  var found = topicById(course, entry.tid); if (!found) return null;
  var pool = found.topic.questions.filter(function(q){ return entry.served.indexOf(q.id) === -1; });
  if (!pool.length) return null;
  var same = pool.filter(function(q){ return q.principle === entry.principle; });
  var near = same.filter(function(q){ return Math.abs(q.difficulty - entry.difficulty) <= 1; });
  var pickFrom = near.length ? near : (same.length ? same : pool);
  return pickFrom[Math.floor(Math.random() * pickFrom.length)];
}

/* ============================== mastery ============================== */
/* A raw 70% on 4 questions is one miss away from a coin flip. For sets
   shorter than 8, also require the Wilson lower bound (z = 1.28) to clear
   0.5, so 3/4 does not count and 5/6 still does. Single-question retests
   stay on their own rule (the whole item must be right). */
function clearsPass(correct, n){
  if (!n) return false;
  var p = correct / n;
  if (p < 0.7) return false;
  if (n >= 8) return true;
  var z = 1.28;
  var denom = 1 + (z * z) / n;
  var centre = p + (z * z) / (2 * n);
  var margin = z * Math.sqrt((p * (1 - p) + (z * z) / (4 * n)) / n);
  return (centre - margin) / denom >= 0.5;
}
function retrievalPassed(r){
  if (r.correct != null && r.n) return clearsPass(r.correct, r.n);
  return r.score >= 0.7;
}
function daysUntilFinal(cid){
  var c = courseById(cid);
  if (!c || !c.finals || !c.finals.length || !c.finals[0].date) return null;
  return daysUntil(c.finals[0].date);
}
/* Gaps are 10%, 15%, and 20% of the days left until the final (the retention
   interval). The first gap is also capped at 3 days: that is the gap the old
   schedule meant to use first, and the previous index skipped it (see
   spacedGapDays). When the exam is close, the cap and the 10% floor compress
   the list so the remaining retrievals still fit before a review ~3 days out.
   No final date falls back to 3, 8, 21. */
function gapListFor(cid){
  var left = daysUntilFinal(cid);
  if (left == null) return [3, 8, 21];
  if (left <= 0) return [7, 7, 7];
  var lo = Math.max(1, Math.round(left * 0.10));
  var mid = Math.max(lo, Math.round(left * 0.15));
  var hi = Math.max(mid, Math.round(left * 0.20));
  var room = Math.max(1, left - 3);
  var cap = Math.max(1, Math.floor(room / 2));
  return [
    Math.max(1, Math.min(3, lo, cap)),
    Math.max(1, Math.min(mid, cap)),
    Math.max(1, Math.min(hi, room))
  ];
}
function spacedGapDays(cid, successes){
  var gaps = gapListFor(cid);
  /* Index with successes-1 AFTER the successful attempt is recorded.
     The old line used Math.min(retrievals.length, gaps.length-1), which is
     1 after the first success, so gaps[0] (the 3-day gap) never ran. */
  var idx = successes <= 0 ? 0 : Math.min(successes - 1, gaps.length - 1);
  var gap = gaps[idx];
  var left = daysUntilFinal(cid);
  if (left == null || left <= 0) return gap;
  var reviewIn = left - 3;
  if (left <= 4) return Math.max(1, reviewIn > 0 ? reviewIn : 1);
  if (successes >= 3 && reviewIn > 0 && gap > reviewIn) return reviewIn;
  return gap;
}
function scheduleNextRetrieval(cid, ts, passed){
  var t = todayStr();
  if (!passed) { ts.nextRetrieval = addDays(t, 1); return; }
  ts.nextRetrieval = addDays(t, spacedGapDays(cid, ts.retrievals.length));
}
function recordAttempt(cid, confidence, correct){
  if (confidence == null || isNaN(Number(confidence))) return;
  if (!state.calibration) state.calibration = [];
  state.calibration.push({ c: Number(confidence), ok: !!correct, d: todayStr(), cid: cid || "" });
}
function recordQuizResult(cid, tid, correct, n, qids){
  var ts = tstate(cid, tid), t = todayStr();
  var frac = n ? correct / n : 0;
  var passed = clearsPass(correct, n);
  ts.quizServings.push({ date: t, score: frac, n: n, correct: correct });
  qids.forEach(function(id){ if (ts.usedQ.indexOf(id) === -1) ts.usedQ.push(id); });
  if (frac < 0.5) ts.shrunk = true;
  else ts.shrunk = false;
  if (passed) {
    if (ts.retrievals.filter(function(r){ return r.date === t; }).length === 0 && ts.quizServings.length > 1) {
      ts.retrievals.push({ date: t, score: frac, n: n, correct: correct, via: "quiz" });
    }
    scheduleNextRetrieval(cid, ts, true);
  } else {
    ts.nextRetrieval = addDays(t, 1);
  }
  updateLearned(cid, tid); saveState();
}
function recordRetrievalResult(cid, tid, correct, n, qids){
  var ts = tstate(cid, tid), t = todayStr();
  var frac = n ? correct / n : 0;
  var passed = clearsPass(correct, n);
  qids.forEach(function(id){ if (ts.usedQ.indexOf(id) === -1) ts.usedQ.push(id); });
  var alreadyToday = ts.retrievals.some(function(r){ return r.date === t; });
  if (passed && !alreadyToday) ts.retrievals.push({ date: t, score: frac, n: n, correct: correct, via: "retrieval" });
  if (frac < 0.5) ts.shrunk = true;
  else ts.shrunk = false;
  scheduleNextRetrieval(cid, ts, passed);
  updateLearned(cid, tid); saveState();
}
function updateLearned(cid, tid){
  var ts = tstate(cid, tid);
  var days = {};
  ts.retrievals.forEach(function(r){ if (retrievalPassed(r)) days[r.date] = true; });
  ts.learned = Object.keys(days).length >= 3;
}
function learnedCount(course){
  return allTopics(course).filter(function(x){ return tstate(course.id, x.topic.id).learned; }).length;
}
function topicRetrievalDue(cid, tid){
  var ts = tstate(cid, tid);
  if (!ts.nextRetrieval || ts.nextRetrieval > todayStr()) return false;
  if (!ts.quizServings.length && !(ts.retrievals && ts.retrievals.length)) return false;
  return true;
}
function firstWorked(topic){
  var found = null;
  (topic.lesson || []).forEach(function(part){
    if (!found && part.workedExample && part.workedExample.body) found = { title: part.workedExample.title || "Worked example", body: part.workedExample.body };
  });
  if (!found) (topic.practice || []).forEach(function(p){
    if (!found && p.rung === "worked") found = { title: p.title || "Worked example", body: (p.prompt || "") + (p.solution ? "\n\n" + p.solution : "") };
  });
  return found;
}
function inStudyQueue(c){ return !c || c.inStudyQueue !== false; }
function courseWeight(c){
  var exam = 0, any = 0;
  (c.gradeWeights || []).forEach(function(w){
    var n = parseFloat(String(w.weight).replace(/[^0-9.]/g, ""));
    if (!isFinite(n)) return;
    any = Math.max(any, n);
    if (/final|exam|quiz/i.test(w.label || "")) exam = Math.max(exam, n);
  });
  return exam || any || 20;
}
function deadlineIsDone(id){ return !!(state.deadlineDone && state.deadlineDone[id]); }
function courseEvents(c){
  var out = [], short = c.name.split(":")[0];
  (c.deadlines || []).forEach(function(d){
    out.push({ id: c.id + ":" + d.id, cid: c.id, date: d.date, kind: "deadline", weekly: false, label: short + ": " + d.label, doneable: true });
  });
  (c.weekly || []).forEach(function(w){
    var start = (c.termDates && c.termDates.start) || todayStr();
    var until = w.until || (c.termDates && c.termDates.end) || addDays(todayStr(), 120);
    var d = start, guard = 0;
    while (d <= until && guard < 400) {
      if (new Date(d + "T12:00:00").getDay() === w.weekday) {
        out.push({ id: c.id + ":" + w.id + ":" + d, cid: c.id, date: d, kind: "deadline", weekly: true, label: short + ": " + w.label, doneable: true });
      }
      d = addDays(d, 1); guard++;
    }
  });
  (c.finals || []).forEach(function(f){
    if (!f.date) return;
    var flabel = f.label || (short + " final");
    out.push({ id: c.id + ":final:" + f.date, cid: c.id, date: f.date, kind: "final", weekly: false, label: flabel.indexOf(short) === 0 ? flabel : short + ": " + flabel, doneable: false });
    [[21, "first full simulation"], [10, "second simulation"], [5, "last simulation"], [3, "final review, about 3 days out"]].forEach(function(pair){
      var when = addDays(f.date, -pair[0]);
      out.push({ id: c.id + ":prep" + pair[0] + ":" + when, cid: c.id, date: when, kind: "prep", weekly: false, label: short + " exam prep: " + pair[1], doneable: false, finalDate: f.date });
    });
  });
  return out;
}
function allEvents(){
  var out = [];
  COURSES.forEach(function(c){ out = out.concat(courseEvents(c)); });
  return out;
}
function soonestPressureDays(c){
  var days = [];
  var left = daysUntilFinal(c.id);
  if (left != null && left >= 0) days.push(left);
  courseEvents(c).forEach(function(ev){
    if (ev.kind !== "deadline" || deadlineIsDone(ev.id)) return;
    var n = daysUntil(ev.date);
    if (n >= 0) days.push(n);
  });
  if (!days.length) return 45;
  return Math.min.apply(null, days);
}
function pressureScore(c, kind){
  var soon = soonestPressureDays(c);
  var urg = 1 / (1 + soon);
  if (kind === "errors") urg = Math.max(urg, 0.85);
  else if (kind === "retrieval") urg = Math.max(urg, 0.55);
  else if (kind === "maintenance") urg = Math.max(urg, 0.35) * 0.85;
  else urg = urg * 0.45;
  return urg * courseWeight(c);
}

/* ============================== routing ============================== */
function updateNavActive(){
  var nav = $("navcourses"); if (!nav) return;
  var m = location.hash.match(/#\/(?:course|topic|examples|final|retrieval)\/([^\/]+)/);
  var cid = m ? m[1] : null;
  var active = null;
  if (nav.children) for (var i = 0; i < nav.children.length; i++){
    var a = nav.children[i];
    if (a.getAttribute && a.getAttribute("data-cid")){
      var on = a.getAttribute("data-cid") === cid;
      a.classList.toggle("active", on);
      if (on) active = a;
    }
  }
  var thumb = $("segthumb"); if (!thumb) return;
  if (active){
    thumb.style.opacity = "1";
    thumb.style.width = (active.offsetWidth || 0) + "px";
    thumb.style.transform = "translateX(" + (active.offsetLeft || 0) + "px)";
    if (nav.scrollTo && active.offsetLeft > nav.clientWidth - active.offsetWidth) nav.scrollTo({ left: active.offsetLeft - 12, behavior: "smooth" });
  } else thumb.style.opacity = "0";
}
function segStep(dir){
  var m = location.hash.match(/#\/(?:course|topic|examples|final|retrieval)\/([^\/]+)/);
  var idx = -1;
  if (m) COURSES.forEach(function(c, i){ if (c.id === m[1]) idx = i; });
  if (idx < 0) idx = dir > 0 ? -1 : COURSES.length;
  var j = Math.max(0, Math.min(COURSES.length - 1, idx + dir));
  if (COURSES[j] && (idx < 0 || j !== idx)) location.hash = "#/course/" + COURSES[j].id;
}
function route(){
  if (typeof closeFilePreview === "function") closeFilePreview();
  updateNavActive();
  var h = location.hash.replace(/^#\/?/, "");
  var seg = h.split("/").filter(function(x){ return x !== ""; });
  window.scrollTo(0, 0);
  if (seg.length === 0) return renderHome();
  if (seg[0] === "course" && seg[1] && seg[2] === "files") return renderFiles(seg[1]);
  if (seg[0] === "course" && seg[1]) return renderCourse(seg[1]);
  if (seg[0] === "topic" && seg[1] && seg[2]) return renderTopic(seg[1], seg[2], seg[3] ? parseInt(seg[3], 10) : 0);
  if (seg[0] === "examples" && seg[1]) return renderExamples(seg[1]);
  if (seg[0] === "final" && seg[1]) return renderFinal(seg[1]);
  if (seg[0] === "errors") return renderErrors();
  if (seg[0] === "notifications") return renderNotifications();
  if (seg[0] === "notebook" && seg[1]) return renderNotebookPage(seg[1]);
  if (seg[0] === "notebook") return renderNotebookList();
  if (seg[0] === "retrieval" && seg[1] && seg[2]) return renderRetrieval(seg[1], seg[2]);

}
window.addEventListener("hashchange", route);
</script>
<script>
"use strict";
/* ============================== HOME ============================== */
function computeToday(){
  var items = [], seen = {};
  var dueErrors = sortedDueErrors();
  if (dueErrors.length) {
    var best = 0;
    dueErrors.forEach(function(e){
      seen[tkey(e.cid, e.tid)] = true;
      var c = courseById(e.cid);
      if (c) best = Math.max(best, pressureScore(c, "errors"));
    });
    items.push({ kind: "errors", score: best, count: dueErrors.length, label: dueErrors.length + " error log retest" + (dueErrors.length > 1 ? "s" : "") + " due", href: "#/errors" });
  }
  COURSES.forEach(function(c){
    if (!inStudyQueue(c)) return;
    allTopics(c).forEach(function(x){
      if (!topicRetrievalDue(c.id, x.topic.id)) return;
      var key = tkey(c.id, x.topic.id);
      seen[key] = true;
      var ts = tstate(c.id, x.topic.id);
      var kind = ts.learned ? "maintenance" : "retrieval";
      var word = ts.learned ? "Maintenance review" : "Retrieval due";
      items.push({ kind: kind, score: pressureScore(c, kind), label: word + ": " + x.topic.title + " (" + c.name.split(":")[0] + ")", href: "#/retrieval/" + c.id + "/" + x.topic.id, topicKey: key });
    });
  });
  var candidates = [];
  COURSES.forEach(function(c){
    if (!inStudyQueue(c)) return;
    allTopics(c).forEach(function(x){
      var key = tkey(c.id, x.topic.id);
      if (seen[key]) return;
      var ts = tstate(c.id, x.topic.id);
      if (ts.learned) return;
      var started = Object.keys(ts.completed).length > 0 || (ts.quizServings && ts.quizServings.length > 0);
      candidates.push({ c: c, x: x, started: started, key: key, score: pressureScore(c, "topic") });
    });
  });
  candidates.sort(function(a, b){ return b.score - a.score; });
  var room = Math.max(0, 7 - Object.keys(seen).length);
  var fresh = 0;
  candidates.forEach(function(n){
    if (room <= 0) return;
    if (!n.started && fresh >= 2) return;
    items.push({ kind: "topic", score: n.score, label: (n.started ? "Continue: " : "New: ") + n.x.topic.title + " (" + n.c.name.split(":")[0] + ")", href: "#/topic/" + n.c.id + "/" + n.x.topic.id + "/0", topicKey: n.key });
    seen[n.key] = true;
    if (!n.started) fresh++;
    room--;
  });
  items.sort(function(a, b){ return (b.score || 0) - (a.score || 0); });
  return { items: items, topicsTouched: Object.keys(seen).length };
}
function goNext(){
  var items = computeToday().items;
  if (!items.length) return;
  location.hash = items[0].href;
}
/* ============================== PROGRESS PILLS ============================== */
/* Content: share of all topic stages completed. Time: termDates start to end. */
function contentPct(c){
  var ts = allTopics(c); if (!ts.length) return 0;
  var done = 0;
  ts.forEach(function(x){ done += [0,1,2,3,4,5].filter(function(i){ return stageDone(c.id, x.topic.id, i); }).length; });
  return Math.round(100 * done / (ts.length * 6));
}
function timePct(c){
  var w = c.termDates; if (!w || !w.start || !w.end) return null;
  var s = new Date(w.start + "T00:00:00"), f = new Date(w.end + "T23:59:59"), n = new Date();
  if (n <= s) return 0; if (n >= f) return 100;
  return Math.round(100 * (n - s) / (f - s));
}
function pillsHtml(c){
  var cp = contentPct(c), tp = timePct(c);
  var h = "<div class=\"pills\">"
    + "<div class=\"pillrow\"><span class=\"pillabel\">Content</span>"
    + "<div class=\"pill\"><div class=\"fc\" style=\"width:" + cp + "%\"></div></div>"
    + "<span class=\"pillpct\">" + cp + "%</span></div>";
  if (tp !== null){
    var fl = new Date(c.termDates.end + "T12:00:00").toLocaleDateString(undefined, { month:"short", day:"numeric" });
    var endWord = (c.finals && c.finals.length) ? "the final" : "the end of the term";
    h += "<div class=\"pillrow\"><span class=\"pillabel\">Time to final</span>"
      + "<div class=\"pill\"><div class=\"ft\" style=\"width:" + tp + "%\"></div></div>"
      + "<span class=\"pillpct\">" + tp + "%</span></div>"
      + "<p class=\"small muted\" style=\"margin:0\">Time runs from the first class to " + endWord + " (" + esc(fl) + ").</p>";
  }
  return h + "</div>";
}
function weekEvents(){
  var end = addDays(todayStr(), 7);
  return allEvents().filter(function(ev){
    if (ev.kind === "prep") return false;
    return ev.date >= todayStr() && ev.date <= end;
  }).sort(function(a, b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : (a.label < b.label ? -1 : 1)); });
}
function deadlineStripHtml(){
  var evs = weekEvents();
  var h = "<div class=\"card\"><h3>Next 7 days</h3>";
  if (!evs.length) h += "<p class=\"muted\" style=\"margin:0\">No deadlines or finals in the next 7 days.</p>";
  else {
    h += "<div class=\"strip\">";
    evs.forEach(function(ev){
      var done = ev.doneable && deadlineIsDone(ev.id);
      var when = fmtDate(ev.date);
      var n = daysUntil(ev.date);
      var rel = n === 0 ? "Today" : (n === 1 ? "Tomorrow" : "In " + n + " days");
      if (ev.doneable) {
        h += "<button type=\"button\" class=\"dl" + (done ? " done" : "") + "\" onclick=\"toggleDeadline('" + esc(ev.id) + "')\">"
          + "<span class=\"box\" aria-hidden=\"true\">" + (done ? "✓" : "") + "</span>"
          + "<span class=\"grow\"><span class=\"when\">" + esc(rel) + " · " + esc(when) + "</span>" + esc(ev.label) + "</span></button>";
      } else {
        h += "<div class=\"dl exam\"><span class=\"box\" aria-hidden=\"true\">·</span>"
          + "<span class=\"grow\"><span class=\"when\">" + esc(rel) + " · " + esc(when) + " · exam</span>" + esc(ev.label) + "</span></div>";
      }
    });
    h += "</div><p class=\"small muted\">Tap a deadline to mark it done. Done items drop out of notifications. Exams stay on the strip.</p>";
  }
  h += "</div>";
  return h;
}
function toggleDeadline(id){
  if (!state.deadlineDone) state.deadlineDone = {};
  if (state.deadlineDone[id]) delete state.deadlineDone[id];
  else state.deadlineDone[id] = todayStr();
  saveState();
  route();
}
function calibrationHtml(){
  var rows = state.calibration || [];
  var seeded = rows.some(function(r){ return r.src === "error"; });
  var h = "<div class=\"card\"><h3>Calibration</h3>";
  if (!rows.length) {
    return h + "<p class=\"small muted\" style=\"margin:0\">Each quiz answer already asks for a 0 to 100 confidence rating. As those pile up, this chart compares the confidence you reported with how often you were actually right.</p></div>";
  }
  var bins = [ { lo:0, hi:20, label:"0–20" }, { lo:20, hi:40, label:"20–40" }, { lo:40, hi:60, label:"40–60" }, { lo:60, hi:80, label:"60–80" }, { lo:80, hi:101, label:"80–100" } ];
  var gapSum = 0, used = 0;
  bins.forEach(function(b){
    var inb = rows.filter(function(r){ return r.c >= b.lo && r.c < b.hi; });
    h += "<div class=\"calrow\"><span class=\"calmeta\">" + b.label;
    if (!inb.length) { h += " · none</span><div class=\"caltrack\"></div></div>"; return; }
    var acc = inb.filter(function(r){ return r.ok; }).length / inb.length;
    var meanC = inb.reduce(function(s, r){ return s + Number(r.c); }, 0) / inb.length / 100;
    gapSum += Math.abs(acc - meanC) * inb.length;
    used += inb.length;
    h += " · " + inb.length + "</span><div class=\"caltrack\" title=\"Accuracy " + Math.round(acc * 100) + "%, mean confidence " + Math.round(meanC * 100) + "%\">"
      + "<div class=\"acc\" style=\"width:" + Math.round(acc * 100) + "%\"></div>"
      + "<div class=\"conf\" style=\"left:" + Math.max(0, Math.min(100, Math.round(meanC * 100))) + "%\"></div></div></div>";
  });
  var score = used ? Math.round(100 * (1 - gapSum / used)) : 0;
  var over = rows.reduce(function(s, r){ return s + (Number(r.c) / 100 - (r.ok ? 1 : 0)); }, 0) / rows.length;
  var lean = over > 0.05 ? "Overconfident by " + Math.round(over * 100) + " points: confidence is running ahead of accuracy."
    : (over < -0.05 ? "Underconfident by " + Math.round(-over * 100) + " points: you are righter than you feel." : "Confidence and accuracy are close.");
  h += "<p class=\"small\" style=\"margin-bottom:0\"><strong>Calibration score " + score + "</strong> out of 100. " + lean + "</p>"
    + "<p class=\"small muted\">The bar is your accuracy in that confidence band. The mark is your average confidence. A score of 100 means those two line up. "
    + (seeded ? "Misses already in the error log are included (earlier sessions only stored confidence on misses). Correct answers count from here on." : "Built from the confidence you rate before each answer is checked.")
    + "</p></div>";
  return h;
}
function sleepNudgeHtml(){
  var hour = new Date().getHours();
  var late = hour >= 21 || hour < 5;
  if (late) {
    return "<div class=\"card nudge\"><strong>Review a little, then sleep.</strong> "
      + "<p class=\"small\" style=\"margin-bottom:0\">A short retrieval before bed is when the day consolidates. An all-nighter hands that work back: sleep loss hurts tomorrow's recall more than another hour of cramming helps.</p></div>";
  }
  return "<p class=\"small muted\">One pass before sleep beats a longer session that steals the night. Sleep is what consolidates a retrieval; an all-nighter gives it back.</p>";
}

function renderHome(){
  var app = $("app");
  var today = computeToday();
  var drafts = state.errors.filter(function(e){ return e.status === "draft"; });
  var html = "<h1>Today</h1>";

  html += deadlineStripHtml();
  html += sleepNudgeHtml();
  if (state.activeRun) html += "<div class=\"card\"><strong>Quiz in progress.</strong> A reload will pick it up where you left it. <a href=\"#/quiz\">Resume</a></div>";

  if (drafts.length) html += "<div class=\"card\"><strong>" + drafts.length + " error log draft" + (drafts.length > 1 ? "s" : "") + "</strong> waiting for the wrong step and correct principle. <a href=\"#/errors\">Complete them</a> so their retests get scheduled.</div>";
  html += "<h2>Courses</h2>";
  COURSES.forEach(function(c){
    var total = allTopics(c).length, learned = learnedCount(c);

      + "<div class=\"bar\"><div style=\"width:" + (total ? Math.round(100 * learned / total) : 0) + "%\"></div></div>"
      + "<p class=\"small muted\">" + learned + " of " + total + " topics learned (3 successful spaced retrievals on separate days; maintenance reviews continue after that)</p>"
      + pillsHtml(c)
      + "<p><a class=\"btn\" href=\"#/course/" + c.id + "\">Open course</a> "
      + "<a class=\"btn secondary\" href=\"#/examples/" + c.id + "\">Examples</a> "
      + "<a class=\"btn secondary\" href=\"#/final/" + c.id + "\">Final practice</a></p></div>";
  });
  html += "<div class=\"card\"><h3>Your saved state</h3>"
    + "<p class=\"small muted\">Everything you type and every score saves in this browser. Export a copy to move it to another device; import restores it. Add the site to your home screen so it opens offline, and so iOS is less likely to clear this browser's saved progress.</p>"
    + "<p><button class=\"secondary\" onclick=\"exportState()\">Export state (JSON)</button> "
    + "<button class=\"secondary\" onclick=\"exportCalendar()\">Download calendar (.ics)</button> "
    + "<label class=\"btn secondary\" style=\"cursor:pointer\">Import state<input type=\"file\" accept=\".json,application/json\" class=\"hidden\" onchange=\"importState(this)\"></label> "
    + "<button class=\"plain\" onclick=\"resetState()\">Erase saved state</button></p>"
    + "<p class=\"small\" id=\"statemsg\"></p></div>";
  app.innerHTML = html;
}
function exportState(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "learning-plan-state.json"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function importState(input){
  var f = input.files && input.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try { var parsed = JSON.parse(r.result); if (!parsed || !parsed.topics || !parsed.errors) throw new Error("shape"); state = parsed; migrateState(); saveState(); route(); }
    catch(e){ var m = $("statemsg"); if (m){ m.className = "small err"; m.textContent = "That file is not a valid exported state."; } }
  };
  r.readAsText(f);
}
function resetState(){
  if (confirm("Erase all saved progress, error entries, and written work in this browser?")){ run = null; state = blankState(); saveState(); route(); }
}
function icsStamp(){
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + "T" + p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
}
function icsEscape(s){
  return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
}
function exportCalendar(){
  var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//StudyHub//Integrated Learning Plan//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  var stamp = icsStamp();
  allEvents().forEach(function(ev){
    var end = addDays(ev.date, 1);
    lines.push("BEGIN:VEVENT");
    lines.push("UID:" + icsEscape(ev.id) + "@studyhub");
    lines.push("DTSTAMP:" + stamp);
    lines.push("DTSTART;VALUE=DATE:" + ev.date.replace(/-/g, ""));
    lines.push("DTEND;VALUE=DATE:" + end.replace(/-/g, ""));
    lines.push("SUMMARY:" + icsEscape(ev.label));
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  var blob = new Blob([lines.join("\r\n") + "\r\n"], { type: "text/calendar" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "studyhub.ics"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* ============================== COURSE PAGE ============================== */
function notesUnfinished(cid, tid){
  var ts = tstate(cid, tid);
  return ts.learn && ts.learn.doneAt && !ts.completed[2] && (Date.now() - ts.learn.doneAt > 24 * 3600 * 1000);
}
function stageSummary(cid, tid){
  var n = [0,1,2,3,4,5].filter(function(i){ return stageDone(cid, tid, i); }).length;

}
function renderCourse(cid){

        + "<span class=\"badge stage\">" + stageSummary(c.id, t.id) + "</span></h3>";

/* ============================== FILE LIBRARY ============================== */
/* One library per course. The list comes from files/<id>/index.json, which
   scripts/build-file-manifests.js regenerates. The repo is public, so every
   file listed here is publicly downloadable. */
var fileLibCid = null;
var fileLibType = "all";
var fileLibData = null;
function fileLibraryShell(c, alone){
  return "<section class=\"card\" id=\"filelib\">" + (alone ? "" : "<h3>File library</h3>")
    + "<p class=\"small\">This library is in a public repository. Anyone who can open the site can download these files. Do not put private or unlicensed material here.</p>"
    + "<div class=\"file-tools\"><input type=\"text\" id=\"file-q\" placeholder=\"Search files\" oninput=\"paintFileList()\" aria-label=\"Search files\">"
    + (alone ? "" : "<a class=\"btn secondary\" href=\"#/course/" + c.id + "/files\">Library page</a>") + "</div>"
    + "<div class=\"file-chips\" id=\"file-chips\"></div>"
    + "<div id=\"file-list\"><p class=\"muted\">Loading the library…</p></div></section>";
}
function renderFiles(cid){
  var c = courseById(cid), app = $("app");
  if (!c){ app.innerHTML = "<p>Course not found.</p>"; return; }
  app.innerHTML = "<p><a href=\"#/course/" + c.id + "\">&larr; " + esc(c.name) + "</a></p><h1>File library</h1>"
    + "<p class=\"muted\">" + esc(c.name) + "</p>"
    + fileLibraryShell(c, true);
  mountFileLibrary(c.id);
}
function mountFileLibrary(cid){
  if (fileLibCid !== cid){ fileLibCid = cid; fileLibType = "all"; fileLibData = null; }
  var q = $("file-q"); if (q) q.value = "";
  var list = $("file-list");
  if (list) list.innerHTML = "<p class=\"muted\">Loading the library…</p>";
  fetch("files/" + cid + "/index.json", { cache: "no-cache" }).then(function(res){
    if (!res.ok) throw new Error("missing");
    return res.json();
  }).then(function(data){
    if (fileLibCid !== cid) return;
    fileLibData = data && data.files ? data : { files: [] };
    paintFileList();
  }).catch(function(){
    if (fileLibCid !== cid) return;
    fileLibData = { files: [], failed: true };
    paintFileList();
  });
}
function fileKind(ext){
  ext = String(ext || "").toLowerCase();
  if (ext === "pdf") return "pdf";
  if (ext === "html" || ext === "htm") return "html";
  if (["png", "jpg", "jpeg", "gif", "webp", "svg"].indexOf(ext) >= 0) return "image";
  if (["txt", "md", "markdown", "csv", "json", "js", "css", "py", "sql", "xml", "yml", "yaml", "log", "ts"].indexOf(ext) >= 0) return "text";
  if (["mp3", "wav", "m4a", "ogg"].indexOf(ext) >= 0) return "audio";
  if (["mp4", "webm", "mov"].indexOf(ext) >= 0) return "video";
  return "file";
}
function fileKindLabel(kind){
  if (kind === "pdf") return "PDF";
  if (kind === "image") return "Image";
  if (kind === "text") return "Text";
  if (kind === "html") return "Page";
  if (kind === "audio") return "Audio";
  if (kind === "video") return "Video";
  return "File";
}
function formatBytes(n){
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function formatFileDate(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function fileIcon(kind){
  var body = kind === "image"
    ? "<rect x=\"4\" y=\"6\" width=\"16\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><circle cx=\"9\" cy=\"10\" r=\"1.4\" fill=\"currentColor\"/><path d=\"M4 15 l4-3 3 2 3-4 6 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/>"
    : (kind === "pdf"
      ? "<path d=\"M6 3 h8 l4 4 v14 a1 1 0 0 1 -1 1 H6 a1 1 0 0 1 -1 -1 V4 a1 1 0 0 1 1 -1 z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M14 3 v5 h5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"7\" y=\"17\" font-size=\"6\" font-family=\"Inter, sans-serif\" fill=\"currentColor\">PDF</text>"
      : "<path d=\"M6 3 h8 l4 4 v14 a1 1 0 0 1 -1 1 H6 a1 1 0 0 1 -1 -1 V4 a1 1 0 0 1 1 -1 z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M14 3 v5 h5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>");
  return "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">" + body + "</svg>";
}
function setFileType(t){ fileLibType = t; paintFileList(); }
function paintFileList(){
  var list = $("file-list"), chips = $("file-chips");
  if (!list) return;
  if (!fileLibData){ list.innerHTML = "<p class=\"muted\">Loading the library…</p>"; return; }
  if (fileLibData.failed){ list.innerHTML = "<p class=\"err\">The library list could not be loaded. It may be unavailable offline until you have opened it once.</p>"; if (chips) chips.innerHTML = ""; return; }
  var all = fileLibData.files || [];
  var q = ($("file-q") && $("file-q").value || "").trim().toLowerCase();
  var kinds = {};
  all.forEach(function(f){ kinds[fileKind(f.ext)] = true; });
  var kindOrder = ["pdf", "image", "text", "html", "audio", "video", "file"].filter(function(k){ return kinds[k]; });
  if (chips){
    var chipHtml = "<button type=\"button\" class=\"plain file-chip" + (fileLibType === "all" ? " cur" : "") + "\" onclick=\"setFileType('all')\">All</button>";
    kindOrder.forEach(function(k){
      chipHtml += "<button type=\"button\" class=\"plain file-chip" + (fileLibType === k ? " cur" : "") + "\" onclick=\"setFileType('" + k + "')\">" + fileKindLabel(k) + "</button>";
    });
    chips.innerHTML = kindOrder.length ? chipHtml : "";
  }
  var shown = all.filter(function(f){
    if (fileLibType !== "all" && fileKind(f.ext) !== fileLibType) return false;
    if (!q) return true;
    return (f.name + " " + (f.folder || "")).toLowerCase().indexOf(q) >= 0;
  });
  if (!all.length){ list.innerHTML = "<p class=\"muted\">No files in this library yet.</p>"; return; }
  if (!shown.length){ list.innerHTML = "<p class=\"muted\">Nothing matches that search.</p>"; return; }
  var hasFolder = all.some(function(f){ return !!f.folder; });
  var groups = [];
  var index = {};
  shown.forEach(function(f){
    var key = hasFolder ? (f.folder || "Course folder") : fileKindLabel(fileKind(f.ext));
    if (!index[key]){ index[key] = []; groups.push(key); }
    index[key].push(f);
  });
  var html = "";
  groups.forEach(function(key){
    html += "<p class=\"file-group\">" + esc(key) + "</p>";
    index[key].forEach(function(f){
      var kind = fileKind(f.ext);
      var url = "files/" + fileLibCid + "/" + f.path.split("/").map(encodeURIComponent).join("/");
      var encUrl = encodeURIComponent(url);
      var encName = encodeURIComponent(f.name);
      html += "<div class=\"file-row\"><div class=\"file-ico\">" + fileIcon(kind) + "</div><div class=\"file-main\">"
        + "<button type=\"button\" class=\"file-name\" onclick=\"openFilePreview('" + encUrl + "','" + encName + "','" + kind + "')\">" + esc(f.name) + "</button>"
        + "<p class=\"small muted\" style=\"margin:2px 0 0\">" + esc(fileKindLabel(kind)) + " · " + esc(formatBytes(f.size)) + (f.date ? " · " + esc(formatFileDate(f.date)) : "") + "</p>"
        + "<div class=\"file-actions\">"
        + "<button type=\"button\" onclick=\"openFilePreview('" + encUrl + "','" + encName + "','" + kind + "')\">View</button>"
        + "<button type=\"button\" class=\"secondary\" onclick=\"downloadLibraryFile('" + encUrl + "','" + encName + "')\">Download</button>"
        + "</div></div></div>";

}
function cacheLibraryResponse(url, response){
  if (!window.caches || !response) return;
  caches.open(CACHE_FILES).then(function(cache){ cache.put(url, response); }).catch(function(){});
}
var CACHE_FILES = "studyhub-files-v1";
function saveBlobAs(blob, name){
  var u = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = u;
  a.download = name;
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
}
function downloadLibraryFile(encUrl, encName){
  var url = decodeURIComponent(encUrl);
  var name = decodeURIComponent(encName);
  fetch(url).then(function(res){
    if (!res.ok) throw new Error("missing");
    cacheLibraryResponse(url, res.clone());
    return res.blob();
  }).then(function(blob){
    var file = null, canShare = false;
    try { file = new File([blob], name, { type: blob.type || "application/octet-stream" }); } catch (e) { file = null; }
    try { canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e2) { canShare = false; }
    if (canShare) {
      navigator.share({ files: [file], title: name }).catch(function(err){
        if (err && err.name === "AbortError") return;
        saveBlobAs(blob, name);
      });
    } else saveBlobAs(blob, name);
  }).catch(function(){
    var fallback = window.caches && caches.match(url);
    if (!fallback){ alert("That file could not be downloaded."); return; }
    fallback.then(function(hit){
      if (!hit){ alert("That file could not be downloaded. Open it once while online to keep a copy."); return; }
      return hit.blob().then(function(blob){ saveBlobAs(blob, name); });
    }).catch(function(){ alert("That file could not be downloaded."); });
  });
}
var previewToken = 0;
function previewChrome(name, url){
  return "<div class=\"file-preview-card\"><p><strong>" + esc(name) + "</strong></p>"
    + "<p><button type=\"button\" class=\"plain\" onclick=\"closeFilePreview()\">Close</button> "
    + "<button type=\"button\" class=\"secondary\" onclick=\"downloadLibraryFile('" + encodeURIComponent(url) + "','" + encodeURIComponent(name) + "')\">Download</button></p>"
    + "<div id=\"file-view-body\"><p class=\"muted\">Loading…</p></div></div>";
}
function readLibraryFile(url){
  return fetch(url).then(function(res){
    if (!res.ok) throw new Error("missing");
    cacheLibraryResponse(url, res.clone());
    return res;
  }).catch(function(){
    if (!window.caches) throw new Error("offline");
    return caches.match(url).then(function(hit){
      if (!hit) throw new Error("offline");
      return hit;
    });
  });
}
function openFilePreview(encUrl, encName, kind){
  var url = decodeURIComponent(encUrl);
  var name = decodeURIComponent(encName);
  var dot = name.lastIndexOf(".");
  var ext = dot >= 0 ? name.slice(dot + 1).toLowerCase() : "";
  if (!kind) kind = fileKind(ext);
  var token = ++previewToken;
  var box = $("file-preview");
  if (!box){
    box = document.createElement("div");
    box.id = "file-preview";
    box.className = "file-preview";
    box.addEventListener("click", function(e){ if (e.target === box) closeFilePreview(); });
    document.body.appendChild(box);
  }
  box.innerHTML = previewChrome(name, url);
  box.classList.add("open");
  var body = $("file-view-body");
  function show(html){ if (token !== previewToken) return; var b = $("file-view-body"); if (b) b.innerHTML = html; }
  if (kind === "image"){
    show("<img src=\"" + esc(url) + "\" alt=\"" + esc(name) + "\">");
    readLibraryFile(url).catch(function(){});
    return;
  }
  if (kind === "pdf" || kind === "html"){
    show("<iframe src=\"" + esc(url) + "\" title=\"" + esc(name) + "\"></iframe>");
    readLibraryFile(url).catch(function(){});
    return;
  }
  if (kind === "audio" || kind === "video"){
    show("<" + kind + " controls src=\"" + esc(url) + "\"></" + kind + ">");
    readLibraryFile(url).catch(function(){});
    return;
  }
  if (kind === "text"){
    readLibraryFile(url).then(function(res){ return res.text(); }).then(function(text){
      if (ext === "md" || ext === "markdown") show("<div class=\"file-view md\">" + md(text) + "</div>");
      else show("<pre class=\"file-view\">" + esc(text) + "</pre>");
    }).catch(function(){ show("<p class=\"err\">This file could not be loaded.</p>"); });
    return;
  }
  var packed = { zip:1, gz:1, tgz:1, rar:1, "7z":1, doc:1, docx:1, xls:1, xlsx:1, ppt:1, pptx:1 };
  if (packed[ext]){
    show("<p class=\"muted\">This format can’t be drawn in the page. Download keeps a copy on your device.</p>");
    return;
  }
  show("<iframe src=\"" + esc(url) + "\" title=\"" + esc(name) + "\"></iframe>");
  readLibraryFile(url).catch(function(){});
}
function closeFilePreview(){
  previewToken++;
  var box = $("file-preview");
  if (!box) return;
  box.classList.remove("open");
  box.innerHTML = "";
}
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeFilePreview(); });

/* ============================== EXAMPLES ============================== */

        + "<p><button class=\"secondary\" onclick=\"toggleExample(this,'exbody-" + i + "-" + x.topic.id + "')\">Show answer</button></p></div>";

<script>
"use strict";
/* ============================== TOPIC PAGE ============================== */
var STAGE_NAMES = ["Predict", "Learn", "Organize", "Encode", "Practice", "Quiz"];
function renderTopic(cid, tid, stage){
  var c = courseById(cid), app = $("app");
  if (!c){ app.innerHTML = "<p>Course not found.</p>"; return; }
  var found = topicById(c, tid);
  if (!found){ app.innerHTML = "<p>Topic not found.</p>"; return; }
  var t = found.topic, ts = tstate(cid, tid);
  if (stage === 1 && ts.completed[1]){ ts.learn.revisits = (ts.learn.revisits || 0) + 1; saveState(); }

    + "<h1>" + esc(t.title) + " "

  if (ts.shrunk) html += "<p class=\"small err\">This topic scored under half on its last quiz, so the next set is smaller" + (firstWorked(t) ? ", and it starts with a worked example," : "") + " until a retest improves it.</p>";
  if (ts.learn.revisits) html += "<p class=\"small muted\">Lesson revisits logged: " + ts.learn.revisits + ". A revisit is not review and never counts as progress.</p>";
  html += "<div class=\"rail\">" + STAGE_NAMES.map(function(name, i){
    return "<button class=\"" + (i === stage ? "cur" : "") + (ts.completed[i] ? " done" : "") + "\" onclick=\"location.hash='#/topic/" + cid + "/" + tid + "/" + i + "'\">" + (ts.completed[i] ? "✓ " : "") + (i + 1) + " · " + name + "</button>";
  }).join("") + "</div>";
  html += "<p><button class=\"secondary\" onclick=\"openTopicNotebook('" + cid + "','" + tid + "')\">Write in the notebook for this topic</button></p>";
  html += "<div id=\"stagebody\"></div>";
  app.innerHTML = html;
  var body = $("stagebody");
  if (stage === 0) renderPredict(body, c, t);
  else if (stage === 1) renderLearn(body, c, t);
  else if (stage === 2) renderOrganize(body, c, t);
  else if (stage === 3) renderEncode(body, c, t);
  else if (stage === 4) renderPractice(body, c, t);

/* ---------- Stage 0: Predict ---------- */
function renderPredict(el, c, t){
  var ts = tstate(c.id, t.id);
  var html = "<h2>Stage 1 · Predict</h2>"
    + "<p class=\"muted\">Attempt each question cold, before any content. A wrong cold attempt is useful data, not a failure. Rate your confidence on each.</p>";
  t.pieces.forEach(function(p){
    var saved = ts.predict[p.id] || {};
    html += "<div class=\"card\"><h3>" + esc(p.name) + "</h3>"
      + "<p class=\"small muted\">" + esc(p.fn) + "</p>"
      + "<p><strong>" + esc(p.predict) + "</strong></p>"
      + "<textarea id=\"pred-a-" + p.id + "\" placeholder=\"Your cold attempt, in your own words\">" + esc(saved.answer || "") + "</textarea>"
      + "<label class=\"flabel\">Confidence (0 to 100)</label>"
      + "<input type=\"number\" id=\"pred-c-" + p.id + "\" min=\"0\" max=\"100\" value=\"" + (saved.confidence == null ? "" : saved.confidence) + "\">"
      + "<label class=\"small\"><input type=\"checkbox\" id=\"pred-s-" + p.id + "\" " + (saved.skipped ? "checked" : "") + "> Skip this piece (recorded as skipped)</label></div>";
  });

}
function savePredict(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid), missing = [];
  t.pieces.forEach(function(p){
    var a = $("pred-a-" + p.id).value.trim(), conf = $("pred-c-" + p.id).value, sk = $("pred-s-" + p.id).checked;
    ts.predict[p.id] = { answer: a, confidence: conf === "" ? null : Math.max(0, Math.min(100, parseInt(conf, 10))), skipped: sk };
    if (!a && !sk) missing.push(p.name);
  });
  var msg = $("predmsg");
  if (missing.length){ msg.className = "small err"; msg.textContent = "Each piece needs a cold attempt or an explicit skip: " + missing.join(", ") + "."; saveState(); return; }
  ts.completed[0] = true; saveState();
  msg.className = "small okmsg"; msg.textContent = "Saved. Baseline recorded; now go to Learn.";
}

/* ---------- Stage 1: Learn ---------- */
var learnPage = {};
function renderLearn(el, c, t){
  var ts = tstate(c.id, t.id), key = tkey(c.id, t.id);

      }

    }

  });

    + "<span class=\"small muted\" id=\"lpage\">Part " + (page + 1) + " of " + t.lesson.length + "</span>"

function updateLearnPager(c, t){

  el.innerHTML = html;

function saveOrganize(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var org = { blocks: {}, redraw: {}, matrix: {} };
  org.principle = $("org-principle").value.trim();
