  t.pieces.forEach(function(p){
    org.blocks[p.id] = $("org-block-" + p.id).value.trim();
    org.redraw[p.id] = $("org-redraw-" + p.id).value.trim();
    if (!org.redraw[p.id]) missing.push("redraw for " + p.name);
  });
  if (t.matrix){
    t.matrix.rows.forEach(function(row, r){ t.matrix.columns.forEach(function(col, ci){
      org.matrix[r + ":" + ci] = $("org-mx-" + r + "-" + ci).value.trim();
      if (!org.matrix[r + ":" + ci]) missing.push("matrix cell: " + row + " / " + col);
    }); });
  }
  if (!org.principle) missing.push("the principle");
  if (!org.summary) missing.push("the summary");
  if (org.summary && org.summary.split("\n").filter(function(x){ return x.trim(); }).length > 3) missing.push("a summary of 3 lines at most");
  ts.organize = org; saveState();
  var msg = $("orgmsg");
  if (missing.length){ msg.className = "small err"; msg.textContent = "Still needed: " + missing.join("; ") + "."; return; }
  ts.completed[2] = true; saveState();
  msg.className = "small okmsg"; msg.textContent = "Organize complete.";
  location.hash = "#/topic/" + cid + "/" + tid + "/3";
}

/* ---------- Stage 3: Encode ---------- */
function renderEncode(el, c, t){
  var ts = tstate(c.id, t.id);
  var html = "<h2>Stage 4 · Encode</h2>"
    + "<p class=\"muted\">Sort problems by their solution principle before solving anything: name the principle and the cue that gave it away. Then build the template card for each method, in your own words.</p>";
  if (t.sorting && t.sorting.length){
    var principles = [];
    t.sorting.forEach(function(s){ if (principles.indexOf(s.principle) === -1) principles.push(s.principle); });
    html += "<h3>Sorting drill</h3><div id=\"sortwrap\">";
    t.sorting.forEach(function(s, i){
      html += "<div class=\"card\"><p>" + esc(s.statement) + "</p>"
        + "<select id=\"sort-" + i + "\"><option value=\"\">Choose the principle…</option>"
        + principles.map(function(p){ return "<option value=\"" + esc(p) + "\">" + esc(p) + "</option>"; }).join("") + "</select>"
        + "<p class=\"small\" id=\"sortfb-" + i + "\"></p></div>";
    });
    html += "<p><button class=\"secondary\" onclick=\"checkSorting('" + c.id + "','" + t.id + "')\">Check the sort</button> "
      + "<span class=\"small muted\">Best so far: " + (ts.sorting.best != null ? Math.round(ts.sorting.best * 100) + "%" : "not attempted") + ". 80% completes this part.</span></p></div>";
  }
  (t.methods || []).forEach(function(m){
    var card = (ts.cards || {})[m.id] || {};
    html += "<div class=\"card\"><h3>Template card: " + esc(m.name) + "</h3>"
      + "<p class=\"small muted\">Trigger: " + esc(m.trigger) + "</p>";
    [["givens", "Givens (what the problem hands you)"], ["find", "Find (what you must produce)"], ["formula", "Formula or rule"], ["steps", "Steps, in order"], ["failureModes", "Failure modes"], ["example", "One canonical example, rebuilt by you"]].forEach(function(f){
      html += "<label class=\"flabel\">" + f[1] + "</label><textarea id=\"card-" + m.id + "-" + f[0] + "\">" + esc(card[f[0]] || "") + "</textarea>";
    });
    html += "</div>";
  });
  if (!(t.sorting && t.sorting.length) && !(t.methods && t.methods.length))
    html += "<p class=\"muted\">This topic has no sorting drill and no methods, so this stage has nothing to build.</p>";
  html += "<p><button onclick=\"saveEncode('" + c.id + "','" + t.id + "')\">Save and complete Encode</button> <span id=\"encmsg\" class=\"small\"></span></p>";
  el.innerHTML = html;
}
function checkSorting(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var right = 0;
  t.sorting.forEach(function(s, i){
    var sel = $("sort-" + i), fb = $("sortfb-" + i);
    var ok = sel.value === s.principle;
    if (ok) right++;
    fb.innerHTML = ok ? "<span class=\"okmsg\">Correct: " + esc(s.principle) + ".</span> " + esc(s.cue) : "<span class=\"err\">It is: " + esc(s.principle) + ".</span> " + esc(s.cue);
  });
  var pct = right / t.sorting.length;
  ts.sorting.best = Math.max(ts.sorting.best || 0, pct); saveState();
}
function saveEncode(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid), missing = [];
  (t.methods || []).forEach(function(m){
    var card = {};
    ["givens", "find", "formula", "steps", "failureModes", "example"].forEach(function(f){ card[f] = $("card-" + m.id + "-" + f).value.trim(); });
    ts.cards[m.id] = card;
    if (!card.givens || !card.formula) missing.push("givens and formula on the " + m.name + " card");
  });
  if (t.sorting && t.sorting.length && (ts.sorting.best || 0) < 0.8) missing.push("a sorting score of at least 80%");
  saveState();
  var msg = $("encmsg");
  if (missing.length){ msg.className = "small err"; msg.textContent = "Still needed: " + missing.join("; ") + "."; return; }
  ts.completed[3] = true; saveState();
  msg.className = "small okmsg"; msg.textContent = "Encode complete.";
  location.hash = "#/topic/" + cid + "/" + tid + "/4";
}
</script>
<script>
"use strict";
/* ============================== STAGE 4: PRACTICE ============================== */
function renderPractice(el, c, t){
  var ts = tstate(c.id, t.id);
  var handwritten = c.productionMode === "handwritten";
  var html = "<h2>Stage 5 · Practice</h2>"
    + "<p class=\"muted\">Three rungs: worked, then completion, then full problems unaided. " + (handwritten ? "This course is assessed handwritten, so production here is written on paper; reveal the solution only after your attempt, then mark yourself honestly." : "Produce each answer before revealing its solution, then mark yourself honestly.") + "</p>"
    + "<p class=\"small muted\">Course AI rule: " + esc(c.aiPolicy) + "</p>";
  if (!(t.practice && t.practice.length)) html += "<p class=\"muted\">No practice items for this topic.</p>";
  (t.practice || []).forEach(function(item, i){
    var st = (ts.practice || {})[i] || {};
    html += "<div class=\"card\"><h3>" + esc(item.rung.charAt(0).toUpperCase() + item.rung.slice(1)) + ": " + esc(item.title) + "</h3>"
      + md(item.prompt)
      + "<div id=\"prac-sol-" + i + "\" class=\"hidden\">" + md(item.solution) + "</div>"

      + (st.status === "missed" ? "<p><button class=\"secondary\" onclick=\"filePracticeMiss('" + c.id + "','" + t.id + "'," + i + ")\">File this miss to the error log</button> <span class=\"small muted\">You will complete the entry (wrong step, correct principle) in the Error Log.</span></p>" : "")
      + "</div>";
  });

}
function togglePracticeSolution(btn, i){
  var el = $("prac-sol-" + i); var open = el.classList.toggle("hidden") === false;
  btn.textContent = open ? "Hide solution" : "Reveal solution";
}
function markPractice(cid, tid, i, status){

}
function filePracticeMiss(cid, tid, i){
  var c = courseById(cid), t = topicById(c, tid).topic, item = t.practice[i];
  var entry = fileErrorDraft(cid, tid, null, null);

  entry.principle = "practice";
  saveState();
  location.hash = "#/errors";
}
function completePractice(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var unmarked = (t.practice || []).filter(function(item, i){ return !((ts.practice || {})[i] || {}).status; }).length;
  var msg = $("pracmsg");
  if (unmarked){ msg.className = "small err"; msg.textContent = "Mark every practice item first (" + unmarked + " unmarked)."; return; }
  ts.completed[4] = true; saveState();
  location.hash = "#/topic/" + cid + "/" + tid + "/5";
}

/* ============================== QUIZ RUNNER ============================== */
var run = null;
function pickServing(topic, ts, n){
  var unused = topic.questions.filter(function(q){ return ts.usedQ.indexOf(q.id) === -1; });
  var rest = topic.questions.filter(function(q){ return ts.usedQ.indexOf(q.id) !== -1; });
  return shuffle(unused).concat(shuffle(rest)).slice(0, Math.min(n, topic.questions.length));
}
function retrievalSize(topic, ts){
  var pool = (topic.questions || []).length;
  var n = pool >= 12 ? 8 : 6;
  if (ts.shrunk) n = Math.min(n, 4);
  return Math.max(0, Math.min(n, pool));
}
function renderQuizStart(el, c, t){
  var ts = tstate(c.id, t.id);
  var last = ts.quizServings[ts.quizServings.length - 1];
  var n = Math.min(ts.shrunk ? 4 : 6, t.questions.length);
  el.innerHTML = "<h2>Stage 6 · Quiz</h2>"
    + "<p class=\"muted\">Closed book, in this course's test format: " + (c.productionMode === "handwritten" ? "write every answer on paper, then self-mark against the revealed solution." : "produce every answer before revealing its solution.") + " For every question you rate your confidence before any feedback is shown. Every miss drafts an error log entry and schedules its own retests. Answer choices are reshuffled every time a question is served.</p>"
    + "<p class=\"small muted\">Course AI rule: " + esc(c.aiPolicy) + "</p>"
    + "<p class=\"small muted\">This serving is " + n + " question" + (n === 1 ? "" : "s") + (ts.shrunk ? ", a smaller set because the last score was under half" : "") + ". A short set has to be cleaner than 70% before it counts as a pass.</p>"
    + (last ? "<p class=\"small\">Last quiz: " + Math.round(last.score * 100) + "% (" + last.n + " questions, " + last.date + ").</p>" : "")
    + "<p><button onclick=\"startTopicQuiz('" + c.id + "','" + t.id + "')\">Start the quiz</button></p>";
}
function startTopicQuiz(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var n = Math.min(ts.shrunk ? 4 : 6, t.questions.length);
  var qs = pickServing(t, ts, n);
  var preface = ts.shrunk ? firstWorked(t) : null;
  startRun({ cid: cid, mode: "quiz", tid: tid, title: "Quiz: " + t.title, preface: preface, items: qs.map(function(q){ return { topic: t, q: q }; }) });
}
function renderRetrieval(cid, tid){
  var c = courseById(cid), found = c ? topicById(c, tid) : null, app = $("app");
  if (!c){ app.innerHTML = "<p>Course not found.</p>"; return; }
  if (!found){ app.innerHTML = "<p>Topic not found.</p>"; return; }
  var ts = tstate(cid, tid);
  var n = retrievalSize(found.topic, ts);
  var left = daysUntilFinal(cid);
  app.innerHTML = "<p><a href=\"#/course/" + cid + "\">&larr; " + esc(c.name) + "</a></p><h1>" + (ts.learned ? "Maintenance review: " : "Retrieval: ") + esc(found.topic.title) + "</h1>"
    + "<p class=\"muted\">A closed book set of " + n + " fresh questions, different from the ones you have already been served when the pool allows. Clean spaced retrievals so far: " + ts.retrievals.length + " of 3 on separate days to count as learned. Reviews continue after that"
    + (left == null ? " on a lengthening gap." : ", and one of them lands about 3 days before the final.") + "</p>"
    + (ts.nextRetrieval ? "<p class=\"small\">Next date on the schedule: " + esc(ts.nextRetrieval) + ".</p>" : "")
    + "<p><button onclick=\"startRetrieval('" + cid + "','" + tid + "')\">Start the retrieval set</button></p>";
}
function startRetrieval(cid, tid){
  var c = courseById(cid), t = topicById(c, tid).topic, ts = tstate(cid, tid);
  var qs = pickServing(t, ts, retrievalSize(t, ts));
  var preface = ts.shrunk ? firstWorked(t) : null;
  startRun({ cid: cid, mode: "retrieval", tid: tid, title: (ts.learned ? "Maintenance review: " : "Retrieval: ") + t.title, preface: preface, items: qs.map(function(q){ return { topic: t, q: q }; }) });
}
function renderFinal(cid){
  var c = courseById(cid), app = $("app");
  if (!c){ app.innerHTML = "<p>Course not found.</p>"; return; }
  var pool = 0;
  allTopics(c).forEach(function(x){ pool += x.topic.questions.length; });
  var past = state.finals.filter(function(f){ return f.cid === cid; });
  var last = past[past.length - 1];
  app.innerHTML = "<p><a href=\"#/course/" + cid + "\">&larr; " + esc(c.name) + "</a></p><h1>Final practice: " + esc(c.name) + "</h1>"
    + "<p class=\"muted\">A mixed set of 10 questions drawn from every topic in the course (" + pool + " in the pools). Same rules as a topic quiz: confidence before feedback, and every miss drafts an error log entry.</p>"
    + (last ? "<p class=\"small\">Last final practice: " + Math.round(last.score * 100) + "% (" + last.n + " questions, " + last.date + ").</p>" : "")
    + "<p><button onclick=\"startFinal('" + cid + "')\">Start the final practice</button></p>";
}
function startFinal(cid){
  var c = courseById(cid), all = [];
  allTopics(c).forEach(function(x){ x.topic.questions.forEach(function(q){ all.push({ topic: x.topic, q: q }); }); });
  startRun({ cid: cid, mode: "final", title: "Final practice: " + c.name, items: shuffle(all).slice(0, Math.min(10, all.length)) });
}
function cloneQ(q){
  var copy = {};
  Object.keys(q).forEach(function(k){ copy[k] = q[k]; });
  return copy;
}
function applyOrder(q, order){
  if (!q || q.type !== "mc" || !order) return { q: q, order: order || null };
  var copy = cloneQ(q);
  copy.options = order.map(function(i){ return q.options[i]; });
  copy.answer = order.indexOf(q.answer);
  return { q: copy, order: order };
}
function presentQuestion(q){
  if (!q || q.type !== "mc" || !q.options || !q.options.length) return { q: q, order: null };
  var order = shuffle(q.options.map(function(_, i){ return i; }));
  return applyOrder(q, order);
}
function persistRun(){
  if (!run) { state.activeRun = null; saveState(); return; }
  state.activeRun = {
    cid: run.cid, mode: run.mode, tid: run.tid,
    entryId: run.entry ? run.entry.id : null,
    title: run.title,
    items: run.items.map(function(it){ return { tid: it.topic.id, qid: it.q.id, order: it.order || null, scored: !!it.scored }; }),
    idx: run.idx, correct: run.correct,
    misses: (run.misses || []).map(function(m){ return { tid: m.topic.id, qid: m.q.id, confidence: m.confidence }; }),
    sel: run.sel, produced: !!run.produced, conf: run.conf,
    checked: !!run.checked, selfMarked: !!run.selfMarked, lastRight: run.lastRight,
    preface: run.preface || null, prefaceOn: !!run.prefaceOn, recorded: !!run.recorded
  };
  saveState();
}
function discardRun(){
  run = null; state.activeRun = null; saveState();
  location.hash = "#/";
}
function restoreRun(snap){
  var c = courseById(snap.cid);
  var app = $("app");
  function fail(msg){
    app.innerHTML = "<div class=\"card\"><h3>Could not resume the quiz</h3><p>" + msg + "</p><p><button class=\"plain\" onclick=\"discardRun()\">Discard the saved quiz</button></p></div>";
    return false;
  }
  if (!c) return fail("The course <strong>" + esc(snap.cid) + "</strong> is not loaded, so this in-progress quiz cannot be rebuilt.");
  var items = [];
  for (var i = 0; i < (snap.items || []).length; i++) {
    var spec = snap.items[i];
    var found = questionById(c, spec.qid);
    if (!found) return fail("Question <strong>" + esc(spec.qid) + "</strong> is no longer in " + esc(c.name) + ".");
    var presented = applyOrder(found.q, spec.order);
    if (spec.order && presented.q.answer < 0) return fail("The saved choice order for <strong>" + esc(spec.qid) + "</strong> no longer matches that question.");
    items.push({ topic: found.topic, q: presented.q, order: presented.order, scored: !!spec.scored });
  }
  if (!items.length) return fail("The saved quiz has no questions.");
  var misses = [];
  (snap.misses || []).forEach(function(m){
    var fq = questionById(c, m.qid);
    var tf = topicById(c, m.tid);
    if (fq && tf) misses.push({ topic: tf.topic, q: fq.q, confidence: m.confidence });
  });
  var entry = null;
  if (snap.entryId) entry = state.errors.filter(function(e){ return e.id === snap.entryId; })[0] || null;
  run = {
    cid: snap.cid, mode: snap.mode, tid: snap.tid || null, entry: entry, title: snap.title || "Quiz",
    items: items, idx: Math.max(0, Math.min(snap.idx || 0, items.length - 1)),
    correct: snap.correct || 0, misses: misses,
    sel: snap.sel != null ? snap.sel : null, produced: !!snap.produced,
    conf: snap.conf != null ? snap.conf : null, checked: !!snap.checked,
    selfMarked: !!snap.selfMarked, lastRight: snap.lastRight,
    preface: snap.preface || null, prefaceOn: !!snap.prefaceOn, recorded: !!snap.recorded
  };
  return true;
}
function renderQuizRoute(){
  if (!run && state.activeRun) {
    if (!restoreRun(state.activeRun)) return;
  }
  if (!run || !run.items || !run.items.length) {
    $("app").innerHTML = "<h1>Quiz</h1><p>No quiz is in progress.</p><p><a class=\"btn\" href=\"#/\">Home</a></p>";
    return;
  }
  renderRunQuestion();
}
function startRun(cfg){
  run = {
    cid: cfg.cid, mode: cfg.mode, tid: cfg.tid || null, entry: cfg.entry || null, title: cfg.title,
    items: (cfg.items || []).map(function(it){
      var p = presentQuestion(it.q);
      return { topic: it.topic, q: p.q, order: p.order, scored: false };
    }),
    idx: 0, correct: 0, misses: [], sel: null, produced: false, conf: null, checked: false,
    selfMarked: false, lastRight: null, preface: cfg.preface || null, prefaceOn: !!cfg.preface, recorded: false
  };
  if (!run.items.length) {
    $("app").innerHTML = "<p>This topic has no questions to serve.</p>";
    run = null; return;
  }
  if (location.hash !== "#/quiz") location.hash = "#/quiz";
  else renderRunQuestion();
}
function renderPreface(){
  var p = run.preface || { title: "Worked example", body: "" };
  $("app").innerHTML = "<p class=\"small muted\">" + esc(run.title) + " · worked example first</p>"
    + "<div class=\"card\"><h3>" + esc(p.title) + "</h3>" + md(p.body)
    + "<p class=\"small muted\">This example is not scored. The shorter set starts after it, because the last quiz on this topic was under half.</p>"
    + "<p><button onclick=\"dismissPreface()\">I've studied this example</button> "
    + "<button class=\"plain\" onclick=\"discardRun()\">Discard quiz</button></p></div>";
  persistRun();
}
function dismissPreface(){ if (!run) return; run.prefaceOn = false; renderRunQuestion(); }
function renderRunQuestion(){
  if (!run) return;
  if (run.prefaceOn && run.preface) { renderPreface(); return; }
  var app = $("app"), c = courseById(run.cid);
  var item = run.items[run.idx], q = item.q;
  var html = "<p class=\"small muted\">" + esc(run.title) + " · Question " + (run.idx + 1) + " of " + run.items.length + " · " + run.correct + " correct so far"
    + " · <a href=\"#/\">Leave for now</a></p>"
    + "<div class=\"card\">" + md(q.prompt);
  if (q.type === "mc"){
    html += q.options.map(function(opt, i){
      var cls = "opt";
      if (run.checked) {
        if (i === q.answer) cls += " right";
        else if (i === run.sel) cls += " wrong";
      } else if (i === run.sel) cls += " sel";
      return "<button class=\"" + cls + "\" id=\"opt-" + i + "\" onclick=\"runSelect(" + i + ")\"" + (run.checked ? " disabled" : "") + ">" + esc(opt) + "</button>";
    }).join("");
  } else {
    if (c && c.productionMode === "handwritten"){
      html += "<p class=\"muted\">Write your answer on paper now, in full, before doing anything else here.</p>"
        + "<p><button class=\"secondary\" id=\"producedbtn\" onclick=\"runProduced()\"" + (run.produced || run.checked ? " disabled" : "") + ">" + (run.produced || run.checked ? "Answer produced" : "I have written it on paper") + "</button></p>";
    } else {
      html += "<textarea id=\"prodanswer\" placeholder=\"Your answer\"" + (run.checked ? " disabled" : "") + "></textarea>"
        + "<p><button class=\"secondary\" id=\"producedbtn\" onclick=\"runProduced()\"" + (run.produced || run.checked ? " disabled" : "") + ">" + (run.produced || run.checked ? "Answer produced" : "Ready to check") + "</button></p>";
    }
  }
  html += "<label class=\"flabel\">Confidence before checking (0 to 100)</label>"
    + "<input type=\"number\" id=\"confinput\" min=\"0\" max=\"100\" placeholder=\"Type a number: how sure are you?\" oninput=\"runConf()\""
    + (run.conf != null ? " value=\"" + esc(String(run.conf)) + "\"" : "") + (run.checked ? " disabled" : "") + ">"
    + "<p><button id=\"checkbtn\" onclick=\"runCheck()\"" + (run.checked ? " disabled" : "") + ">Check answer</button></p>"
    + "<div id=\"runfeedback\"></div></div>"
    + "<p><button class=\"plain\" onclick=\"discardRun()\">Discard this quiz</button></p>";
  app.innerHTML = html;
  if (run.checked) paintChecked();
  else updateCheckBtn();
  persistRun();
}
function paintChecked(){
  var q = run.items[run.idx].q;
  var fb = $("runfeedback"); if (!fb) return;
  if (q.type === "mc") {
    fb.innerHTML = feedbackHtml(q, !!run.lastRight) + nextBtnHtml();
  } else if (!run.selfMarked) {
    fb.innerHTML = "<h3>Solution</h3>" + md(q.solution)
      + "<p>Mark your paper answer honestly:</p>"
      + "<p><button class=\"secondary\" onclick=\"runSelfMark(true)\">I had it right</button> "
      + "<button class=\"plain\" onclick=\"runSelfMark(false)\">I missed it</button></p><div id=\"selfmarkfb\"></div>";
  } else {
    fb.innerHTML = feedbackHtml(q, !!run.lastRight) + nextBtnHtml();
  }
}
function runSelect(i){
  if (!run || run.checked) return;
  run.sel = i;
  run.items[run.idx].q.options.forEach(function(_, j){ var b = $("opt-" + j); if (b) b.classList.toggle("sel", j === i); });
  updateCheckBtn();
  persistRun();
}
function runProduced(){ if (!run || run.checked) return; run.produced = true; var b = $("producedbtn"); if (b){ b.disabled = true; b.textContent = "Answer produced"; } updateCheckBtn(); persistRun(); }
function runConf(){ if (!run || run.checked) return; var v = $("confinput").value; run.conf = v === "" ? null : Math.max(0, Math.min(100, parseInt(v, 10))); updateCheckBtn(); }
function updateCheckBtn(){
  if (!run || run.checked) return;
  var q = run.items[run.idx].q;
  var ready = run.conf != null && !isNaN(run.conf) && (q.type === "mc" ? run.sel != null : run.produced);
  var b = $("checkbtn"); if (b) b.disabled = !ready;
}
function runCheck(){
  if (!run || run.checked) return;
  var item = run.items[run.idx], q = item.q;
  var fb = $("runfeedback");
  if (q.type === "mc"){
    run.checked = true;
    var right = run.sel === q.answer;
    q.options.forEach(function(_, j){ var b = $("opt-" + j); if (b){ b.disabled = true; if (j === q.answer) b.classList.add("right"); else if (j === run.sel) b.classList.add("wrong"); } });
    var check = $("checkbtn"); if (check) check.disabled = true;
    var confEl = $("confinput"); if (confEl) confEl.disabled = true;
    finishAnswer(right);
    if (fb) fb.innerHTML = feedbackHtml(q, right) + nextBtnHtml();
  } else {
    run.checked = true;
    var check2 = $("checkbtn"); if (check2) check2.disabled = true;
    var confEl2 = $("confinput"); if (confEl2) confEl2.disabled = true;
    if (fb) fb.innerHTML = "<h3>Solution</h3>" + md(q.solution)
      + "<p>Mark your paper answer honestly:</p>"
      + "<p><button class=\"secondary\" onclick=\"runSelfMark(true)\">I had it right</button> "
      + "<button class=\"plain\" onclick=\"runSelfMark(false)\">I missed it</button></p><div id=\"selfmarkfb\"></div>";
    persistRun();
  }
}
function runSelfMark(right){
  if (!run) return;
  run.selfMarked = true;
  finishAnswer(right);
  var q = run.items[run.idx].q;
  var fb = $("selfmarkfb");
  if (fb) fb.innerHTML = feedbackHtml(q, right) + nextBtnHtml();
}
function feedbackHtml(q, right){
  return "<div class=\"feedback " + (right ? "ok" : "no") + "\"><strong>" + (right ? "Correct." : "Missed.") + "</strong>"
    + "<p><strong>Step:</strong> " + esc(q.feedback.step) + "</p>"
    + "<p><strong>Why:</strong> " + esc(q.feedback.why) + "</p>"
    + "<p><strong>Cue:</strong> " + esc(q.feedback.cue) + "</p></div>";
}
function nextBtnHtml(){
  var last = run.idx >= run.items.length - 1;
  return "<p><button onclick=\"runNext()\">" + (last ? "Finish" : "Next question →") + "</button></p>";
}
function finishAnswer(right){
  var item = run.items[run.idx];
  run.lastRight = !!right;
  if (item.scored) return;
  item.scored = true;
  recordAttempt(run.cid, run.conf, right);
  if (right){ run.correct++; persistRun(); return; }
  if (run.mode === "retest"){
    var e = run.entry;
    if (e) {
      e.clean = 0; e.stageIdx = 0; e.nextDue = addDays(todayStr(), 1);
      e.served.push(item.q.id);
      var d = fileErrorDraft(run.cid, e.tid, item.q, run.conf);
      run.retestDraft = d.id;
    }
    saveState();
  } else {
    run.misses.push({ topic: item.topic, q: item.q, confidence: run.conf });
  }
  persistRun();
}
function runNext(){
  if (!run) return;
  if (run.idx < run.items.length - 1){
    run.idx++; run.sel = null; run.produced = false; run.conf = null; run.checked = false; run.selfMarked = false; run.lastRight = null;
    renderRunQuestion();
  } else finishRun();
}
function finishRun(){
  var app = $("app"), n = run.items.length, frac = n ? run.correct / n : 0;
  var passed = clearsPass(run.correct, n);
  var html = "<h1>" + esc(run.title) + ": done</h1>"
    + "<p>Score: <strong>" + Math.round(frac * 100) + "%</strong> (" + run.correct + " of " + n + ").</p>";
  if (!run.recorded) {
    if (run.mode === "quiz"){
      var qids = run.items.map(function(it){ return it.q.id; });
      recordQuizResult(run.cid, run.tid, run.correct, n, qids);
      tstate(run.cid, run.tid).completed[5] = true; saveState();
    } else if (run.mode === "retrieval"){
      recordRetrievalResult(run.cid, run.tid, run.correct, n, run.items.map(function(it){ return it.q.id; }));
    } else if (run.mode === "final"){
      state.finals.push({ cid: run.cid, date: todayStr(), score: frac, n: n, correct: run.correct }); saveState();
    } else if (run.mode === "retest"){
      var e = run.entry;
      if (e && frac >= 1){
        e.clean = (e.clean || 0) + 1;
        e.served.push(run.items[0].q.id);
        if (e.clean >= 3) e.status = "closed";
        else { e.stageIdx = Math.min((e.stageIdx || 0) + 1, RETEST_GAPS.length - 1); e.nextDue = addDays(todayStr(), RETEST_GAPS[e.stageIdx]); }
        saveState();
      }
    }
    run.recorded = true;
  }
  if (run.mode === "quiz"){
    var topic = null;
    var cc = courseById(run.cid);
    if (cc && run.tid) { var ff = topicById(cc, run.tid); topic = ff && ff.topic; }
    var hasWorked = topic && firstWorked(topic);
    var tsQuiz = tstate(run.cid, run.tid);
    if (frac < 0.5) html += "<p class=\"err\">Under half. This topic returns tomorrow, smaller" + (hasWorked ? ", with a worked example first" : "") + ".</p>";
    else if (!passed && frac >= 0.7) html += "<p>That is at least 70%, but this set is short enough that one item swings the score. It does not count as a pass until the result is cleaner.</p>";
    else if (!passed) html += "<p>Between half and a clean pass: this topic returns tomorrow.</p>";
    else html += "<p>A retrieval is scheduled for " + esc(tsQuiz.nextRetrieval || "") + ". The topic counts as learned after 3 successful spaced retrievals on separate days, and maintenance reviews continue after that.</p>";
    html += "<p><a class=\"btn\" href=\"#/topic/" + run.cid + "/" + run.tid + "/5\">Back to the topic</a></p>";
  } else if (run.mode === "retrieval"){
    var ts = tstate(run.cid, run.tid);
    if (!passed) html += "<p>This one did not clear the bar, so the topic is back on " + esc(ts.nextRetrieval || "tomorrow") + ".</p>";
    else if (ts.learned) html += "<p class=\"okmsg\">This topic counts as learned. Maintenance reviews continue" + (daysUntilFinal(run.cid) != null ? ", including one about 3 days before the final" : "") + ". Next: " + esc(ts.nextRetrieval || "") + ".</p>";
    else html += "<p>Next retrieval for this topic: " + esc(ts.nextRetrieval || "") + " (" + ts.retrievals.length + " of 3 clean days).</p>";
    html += "<p><a class=\"btn\" href=\"#/course/" + run.cid + "\">Back to the course</a></p>";
  } else if (run.mode === "final"){
    html += "<p><a class=\"btn\" href=\"#/course/" + run.cid + "\">Back to the course</a></p>";
  } else if (run.mode === "retest"){
    var ent = run.entry;
    if (ent && frac >= 1){
      if (ent.status === "closed") html += "<p class=\"okmsg\">Third clean retrieval: this error entry is closed.</p>";
      else html += "<p>Clean retrieval " + ent.clean + " of 3. Next retest: " + esc(ent.nextDue) + ".</p>";
    } else {
      html += "<p class=\"err\">Missed. This entry returns tomorrow, and the miss itself has been drafted as a new entry below.</p>";
    }
    html += "<p><a class=\"btn\" href=\"#/errors\">Back to the Error Log</a></p>";
  }
  if (run.misses.length){
    html += "<h2>File the misses</h2><p class=\"muted\">Each miss is already drafted. It only becomes a scheduled retest once you write the wrong step and the correct principle.</p>";
    run.misses.forEach(function(m){
      var entry = fileErrorDraft(run.cid, m.topic.id, m.q, m.confidence);
      html += errorDraftForm(entry, m.topic.title);
    });
  }
  var savedHtml = html;
  run = null;
  state.activeRun = null;
  saveState();
  app.innerHTML = savedHtml;
}
function errorDraftForm(entry, topicTitle){
  return "<div class=\"card\"><h3>Miss: " + esc(topicTitle || entry.tid) + (entry.confidence != null && entry.confidence >= 80 ? " <span class=\"badge due\">HIGH CONFIDENCE MISS</span>" : "") + "</h3>"
    + md(entry.problem)
    + "<label class=\"flabel\">Your wrong step, and the reasoning you used</label><textarea id=\"derr-ws-" + entry.id + "\"></textarea>"
    + "<label class=\"flabel\">The correct principle</label><textarea id=\"derr-cp-" + entry.id + "\"></textarea>"
    + "<p><button onclick=\"saveDraftEntry('" + entry.id + "')\">Save entry and schedule its retests</button> <span id=\"derr-msg-" + entry.id + "\" class=\"small\"></span></p></div>";
}
function saveDraftEntry(entryId){
  var entry = state.errors.filter(function(e){ return e.id === entryId; })[0];
  if (!entry) return;
  var ws = $("derr-ws-" + entryId).value.trim(), cp = $("derr-cp-" + entryId).value.trim();
  var msg = $("derr-msg-" + entryId);
  if (!ws || !cp){ msg.className = "small err"; msg.textContent = "Both fields are required."; return; }
  completeErrorEntry(entry, ws, cp);
  msg.className = "small okmsg"; msg.textContent = "Saved. First retest: " + entry.nextDue + ", then about 3 to 4 days, 8 to 10 days, and 21 days out.";
}

/* ============================== ERROR LOG VIEW ============================== */

      + "</h3><p class=\"small\"><strong>Principle:</strong> " + esc(e.correctPrinciple || e.principle) + "</p>"

      + "<p class=\"small\"><strong>Wrong step:</strong> " + esc(e.wrongStep) + "</p>"
      + "<p class=\"small\"><strong>Correct principle:</strong> " + esc(e.correctPrinciple) + "</p>"
      + "<p class=\"small muted\">Confidence at the miss: " + (e.confidence == null ? "not recorded" : e.confidence + "%") + " · Clean retrievals: " + e.clean + " of 3 · Next retest: " + esc(e.nextDue || "") + "</p></div>";
  });
  if (closed.length) html += "<h2>Closed</h2><p class=\"small muted\">" + closed.length + " entr" + (closed.length === 1 ? "y" : "ies") + " closed after 3 clean spaced retrievals each.</p>";

  if (flagged.length){

      + flagged.map(function(k){ return "<li class=\"small\">" + esc(k) + "</li>"; }).join("") + "</ul>";

function startErrorRetest(entryId){
  var entry = state.errors.filter(function(e){ return e.id === entryId; })[0];
  if (!entry) return;
  var q = pickRetestQuestion(entry);
  if (!q){ alert("No fresh question is left in this topic's pool yet. The entry stays due."); return; }
  var c = courseById(entry.cid), found = topicById(c, entry.tid);
  startRun({ cid: entry.cid, mode: "retest", tid: entry.tid, entry: entry, title: "Retest: " + found.topic.title, items: [{ topic: found.topic, q: q }] });
}

/* ============================== NOTEBOOK ============================== */
/* Handwritten pages, drawn with Apple Pencil (or mouse, or finger).
   Ink is stored as stroke vectors in your saved state, so pages persist,
   export with your state, and cost a fraction of image storage.
   The sheet is always paper colored, in light and dark mode alike. */
var NB_W = 1200, NB_H = 1560, NB_SS = 2;
var NB = null;
var NB_COLORS = [ { id:"ink", hex:"#1b2330", label:"Ink" }, { id:"teal", hex:"#17635a", label:"Teal" }, { id:"red", hex:"#b3372e", label:"Red, for corrections" } ];
function nbPages(){ if (!state.notebooks) state.notebooks = []; return state.notebooks; }
function nbPage(id){ return nbPages().filter(function(p){ return p.id === id; })[0] || null; }
function createNotebookPage(cid, tid){
  var title = "Scratch page", c = cid ? courseById(cid) : null;
  if (c && tid){ var f = topicById(c, tid); title = f ? f.topic.title : c.name; }
  else if (c) title = c.name.split(":")[0] + " page";
  var p = { id:"nb" + Date.now().toString(36), cid:cid || null, tid:tid || null, title:title,
            created:new Date().toISOString(), updated:new Date().toISOString(), bg:"ruled", strokes:[] };
  nbPages().push(p); saveState();
  return p;
}
function openTopicNotebook(cid, tid){
  var pages = nbPages().filter(function(p){ return p.cid === cid && p.tid === tid; });
  var p = pages.length ? pages[pages.length - 1] : createNotebookPage(cid, tid);
  location.hash = "#/notebook/" + p.id;
}
function deleteNotebookPage(id){
  if (!confirm("Delete this notebook page and its ink? This cannot be undone.")) return;
  state.notebooks = nbPages().filter(function(p){ return p.id !== id; });
  saveState(); location.hash = "#/notebook";
}
function renameNotebookPage(id){
  var p = nbPage(id); if (!p) return;
  var t = prompt("Page title", p.title);
  if (t && t.trim()){ p.title = t.trim(); p.updated = new Date().toISOString(); saveState(); renderNotebookPage(id); }
}
function renderNotebookList(){
  var app = $("app");
  var pages = nbPages().slice().sort(function(a, b){ return a.updated < b.updated ? 1 : -1; });
  var kb = Math.round(JSON.stringify(state).length / 1024);
  var html = "<h1>Notebook</h1>"
    + "<p class=\"muted\">Handwritten pages for working problems the way your exams demand: by hand. Ink is kept as stroke data inside your saved state (about " + kb + " KB used of the browser's roughly 5 MB), and it travels with your Export state file.</p>"
    + "<div class=\"card\"><h3>New page</h3><p>"
    + COURSES.map(function(c){ return "<button class=\"secondary\" onclick=\"location.hash='#/notebook/' + createNotebookPage('" + c.id + "', null).id\">" + esc(c.name.split(":")[0]) + "</button>"; }).join(" ")
    + " <button class=\"secondary\" onclick=\"location.hash='#/notebook/' + createNotebookPage(null, null).id\">Scratch</button></p>"
    + "<p class=\"small muted\">Tip: open a topic and use its notebook button, and the page is titled and filed under that topic automatically.</p></div>";
  if (!pages.length) html += "<p class=\"muted\">No pages yet.</p>";
  pages.forEach(function(p){
    var c = p.cid ? courseById(p.cid) : null;
    html += "<div class=\"card\"><h3>" + esc(p.title) + "</h3>"
      + "<p class=\"small muted\">" + (c ? esc(c.name.split(":")[0]) + " · " : "") + p.strokes.length + " strokes · updated " + esc(p.updated.slice(0, 10)) + "</p>"
      + "<p><a class=\"btn\" href=\"#/notebook/" + p.id + "\">Open page</a> "
      + "<button class=\"secondary\" onclick=\"exportNotebookPng('" + p.id + "')\">Export PNG</button> "
      + "<button class=\"plain\" onclick=\"deleteNotebookPage('" + p.id + "')\">Delete</button></p></div>";
  });
  app.innerHTML = html;
}
function renderNotebookPage(id){
  var app = $("app"), p = nbPage(id);
  if (!p){ app.innerHTML = "<p>That page is gone.</p><p><a href=\"#/notebook\">&larr; Notebook</a></p>"; return; }
  NB = { id:id, tool:"pen", color:"#1b2330", width:7, drawing:false, cur:null, undo:[], redo:[], penSeen:false };
  var back = p.tid && p.cid ? "#/topic/" + p.cid + "/" + p.tid + "/4" : "#/notebook";
  var html = "<p><a href=\"" + back + "\">&larr; " + (p.tid ? "Back to the topic" : "All pages") + "</a></p>"
    + "<h1>" + esc(p.title) + "</h1>"
    + "<p><button class=\"plain\" onclick=\"renameNotebookPage('" + id + "')\">Rename</button> "
    + "<button class=\"plain\" onclick=\"exportNotebookPng('" + id + "')\">Export PNG</button> "
    + "<button class=\"plain\" onclick=\"deleteNotebookPage('" + id + "')\">Delete page</button></p>"
    + "<div class=\"nbtools\">"
    + NB_COLORS.map(function(col){ return "<button class=\"nbswatch" + (col.hex === NB.color ? " cur" : "") + "\" data-color=\"" + col.hex + "\" title=\"" + col.label + "\" style=\"background:" + col.hex + "\" onclick=\"nbSetColor('" + col.hex + "')\"></button>"; }).join("")
    + "<button class=\"secondary\" id=\"nbpen\" onclick=\"nbSetTool('pen')\">Pen</button>"
    + "<button class=\"secondary\" id=\"nberaser\" onclick=\"nbSetTool('eraser')\">Eraser</button>"
    + "<button class=\"secondary\" onclick=\"nbToggleWidth()\">Line: <span id=\"nbwidth\">medium</span></button>"
    + "<button class=\"secondary\" onclick=\"nbUndo()\">Undo</button>"
    + "<button class=\"secondary\" onclick=\"nbRedo()\">Redo</button>"
    + "<button class=\"secondary\" onclick=\"nbCycleBg()\">Background: <span id=\"nbbg\">" + esc(p.bg) + "</span></button>"
    + "<button class=\"plain\" onclick=\"nbClear()\">Clear page</button>"
    + "</div>"
    + "<label class=\"small\"><input type=\"checkbox\" id=\"nbpencilonly\" checked> Apple Pencil only (palms and fingers will not draw)</label>"
    + "<div class=\"nbsheetwrap\"><canvas id=\"nbcanvas\" width=\"" + (NB_W * NB_SS) + "\" height=\"" + (NB_H * NB_SS) + "\"></canvas></div>"
    + "<p class=\"small muted\" id=\"nbstatus\">" + p.strokes.length + " strokes. Ink saves automatically as you write.</p>";
  app.innerHTML = html;
  nbSetupCanvas();
}
function nbSetColor(hex){
  if (!NB) return;
  NB.color = hex; NB.tool = "pen";
  document.querySelectorAll(".nbswatch").forEach(function(b){ b.classList.toggle("cur", b.getAttribute("data-color") === hex); });
  nbToolButtons();
}
function nbSetTool(t){ if (!NB) return; NB.tool = t; nbToolButtons(); }
function nbToolButtons(){
  var pen = $("nbpen"), er = $("nberaser");
  if (pen) pen.classList.toggle("nbtoolcur", NB.tool === "pen");
  if (er) er.classList.toggle("nbtoolcur", NB.tool === "eraser");
}
function nbToggleWidth(){
  if (!NB) return;
  NB.width = NB.width === 7 ? 4 : (NB.width === 4 ? 11 : 7);
  var w = $("nbwidth"); if (w) w.textContent = NB.width === 4 ? "fine" : (NB.width === 11 ? "bold" : "medium");
}
function nbCycleBg(){
  var p = nbPage(NB.id); if (!p) return;
  p.bg = p.bg === "ruled" ? "grid" : (p.bg === "grid" ? "blank" : "ruled");
  p.updated = new Date().toISOString(); saveState();
  var b = $("nbbg"); if (b) b.textContent = p.bg;
  nbDraw();
}
function nbSetupCanvas(){
  var canvas = $("nbcanvas"); if (!canvas) return;
  NB.canvas = canvas;
  NB.ctx = canvas.getContext ? canvas.getContext("2d") : null;
  nbDraw();
  canvas.addEventListener("pointerdown", nbDown);
  canvas.addEventListener("pointermove", nbMove);
  canvas.addEventListener("pointerup", nbUp);
  canvas.addEventListener("pointercancel", nbUp);
}
function nbPos(e){
  var r = NB.canvas.getBoundingClientRect();
  return [ Math.round((e.clientX - r.left) * (NB_W / r.width) * 10) / 10,
           Math.round((e.clientY - r.top) * (NB_H / r.height) * 10) / 10,
           Math.round((e.pressure || 0.5) * 100) / 100 ];
}
function nbAccept(e){
  if (e.pointerType === "pen"){ NB.penSeen = true; return true; }
  if (e.pointerType === "touch"){ var t = $("nbpencilonly"); return !(t && t.checked); }
  return true;
}
function nbDown(e){
  if (!NB || !nbAccept(e)) return;
  e.preventDefault();
  if (NB.canvas.setPointerCapture && e.pointerId != null){ try { NB.canvas.setPointerCapture(e.pointerId); } catch(err){} }
  var pt = nbPos(e);
  if (NB.tool === "eraser"){ nbEraseAt(pt[0], pt[1]); NB.drawing = true; return; }
  NB.drawing = true;
  NB.cur = { c: NB.color, w: NB.width, pts: [pt] };
}
function nbMove(e){
  if (!NB || !NB.drawing) return;
  e.preventDefault();
  var evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (NB.tool === "eraser"){ var p0 = nbPos(e); nbEraseAt(p0[0], p0[1]); return; }
  if (!NB.cur) return;
  for (var i = 0; i < evts.length; i++) NB.cur.pts.push(nbPos(evts[i]));
  nbDraw();
}
function nbUp(e){
  if (!NB) return;
  if (NB.drawing && NB.tool === "pen" && NB.cur && NB.cur.pts.length){
    var p = nbPage(NB.id); if (!p){ NB.drawing = false; NB.cur = null; return; }
    p.strokes.push(NB.cur);
    NB.undo.push({ type:"add", stroke:NB.cur });
    NB.redo = [];
    p.updated = new Date().toISOString();
    saveState(); nbStatus(p);
  }
  NB.drawing = false; NB.cur = null;
  nbDraw();
}
function nbEraseAt(x, y){
  var p = nbPage(NB.id); if (!p) return;
  for (var i = p.strokes.length - 1; i >= 0; i--){
    var s = p.strokes[i], hit = false;
    for (var j = 0; j < s.pts.length && !hit; j++){
      var dx = s.pts[j][0] - x, dy = s.pts[j][1] - y;
      if (dx * dx + dy * dy < 400) hit = true;
    }
    if (hit){
      p.strokes.splice(i, 1);
      NB.undo.push({ type:"erase", stroke:s, idx:i });
      NB.redo = [];
      p.updated = new Date().toISOString();
      saveState(); nbStatus(p); nbDraw();
      return;
    }
  }
}
function nbUndo(){
  var p = nbPage(NB.id); if (!p || !NB.undo.length) return;
  var a = NB.undo.pop();
  if (a.type === "add"){ var i = p.strokes.indexOf(a.stroke); if (i >= 0) p.strokes.splice(i, 1); }
  else if (a.type === "erase"){ p.strokes.splice(Math.min(a.idx, p.strokes.length), 0, a.stroke); }
  else if (a.type === "clear"){ p.strokes = a.strokes; }
  NB.redo.push(a); p.updated = new Date().toISOString(); saveState(); nbStatus(p); nbDraw();
}
function nbRedo(){
  var p = nbPage(NB.id); if (!p || !NB.redo.length) return;
  var a = NB.redo.pop();
  if (a.type === "add"){ p.strokes.push(a.stroke); }
  else if (a.type === "erase"){ var i = p.strokes.indexOf(a.stroke); if (i >= 0) p.strokes.splice(i, 1); }
  else if (a.type === "clear"){ p.strokes = []; }
  NB.undo.push(a); p.updated = new Date().toISOString(); saveState(); nbStatus(p); nbDraw();
}
function nbClear(){
  var p = nbPage(NB.id); if (!p || !p.strokes.length) return;
  if (!confirm("Clear all ink on this page? Undo can bring it back in this session.")) return;
  NB.undo.push({ type:"clear", strokes:p.strokes });
  NB.redo = [];
  p.strokes = [];
  p.updated = new Date().toISOString(); saveState(); nbStatus(p); nbDraw();
}
function nbStatus(p){ var s = $("nbstatus"); if (s) s.textContent = p.strokes.length + " strokes. Ink saves automatically as you write."; }
function nbDrawSheet(ctx, p, scale){
  ctx.fillStyle = "#fffdf8";
  ctx.fillRect(0, 0, NB_W, NB_H);
  ctx.strokeStyle = "#ddd3ba";
  ctx.lineWidth = 1.5;
  if (p.bg === "ruled" || p.bg === "grid"){
    ctx.beginPath();
    for (var y = 96; y < NB_H; y += 48){ ctx.moveTo(0, y); ctx.lineTo(NB_W, y); }
    ctx.stroke();
  }
  if (p.bg === "grid"){
    ctx.beginPath();
    for (var x = 48; x < NB_W; x += 48){ ctx.moveTo(x, 0); ctx.lineTo(x, NB_H); }
    ctx.stroke();
  }
  p.strokes.forEach(function(s){ nbDrawStroke(ctx, s); });
  if (NB && NB.cur) nbDrawStroke(ctx, NB.cur);
}
function nbDrawStroke(ctx, s){
  if (!s.pts.length) return;
  ctx.strokeStyle = s.c;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (s.pts.length === 1){
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.pts[0][0], s.pts[0][1], s.w * (s.pts[0][2] || 0.5) / 1.4, 0, 7); ctx.fill();
    return;
  }
  for (var i = 1; i < s.pts.length; i++){
    var a = s.pts[i - 1], b = s.pts[i];
    ctx.lineWidth = Math.max(1, s.w * (((a[2] || 0.5) + (b[2] || 0.5)) / 2) * 1.6);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
}
function nbDraw(){
  if (!NB || !NB.ctx) return;
  var p = nbPage(NB.id); if (!p) return;
  var ctx = NB.ctx;
  ctx.setTransform(NB_SS, 0, 0, NB_SS, 0, 0);
  nbDrawSheet(ctx, p, NB_SS);
}
function exportNotebookPng(id){
  var p = nbPage(id); if (!p) return;
  var cv = document.createElement("canvas");
  cv.width = NB_W * 2; cv.height = NB_H * 2;
  var ctx = cv.getContext("2d");
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  var keep = NB ? NB.cur : null; if (NB) NB.cur = null;
  nbDrawSheet(ctx, p, 2);
  if (NB) NB.cur = keep;
  var a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  a.download = p.title.replace(/[^a-z0-9]+/gi, "-").slice(0, 60) + ".png";
  a.click();
}

/* ============================== NOTIFICATIONS ============================== */
/* Everything here is computed live from your saved state and each course's
   own deadlines and finals. A deadline you mark done drops out. */
function daysUntil(dateStr){
  var a = new Date(todayStr() + "T12:00:00"), b = new Date(dateStr + "T12:00:00");
  return Math.round((b - a) / 86400000);
}
function fmtDate(dateStr){
  return new Date(dateStr + "T12:00:00").toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}
function computeNotifications(){
  var items = [];
  function add(sev, title, body, href, cta){ items.push({ sev:sev, title:title, body:body, href:href, cta:cta }); }

  /* your own system state */
  var dueErr = sortedDueErrors();
  if (dueErr.length) add("now", "Error retests due: " + dueErr.length,
    "Missed questions whose spaced retest date has arrived. A retest always serves a fresh question, never the same one.",
    "#/errors", "Open the Error Log");
  var drafts = state.errors.filter(function(e){ return e.status === "draft"; });
  if (drafts.length) add("now", drafts.length + " error draft" + (drafts.length > 1 ? "s" : "") + " unfinished",
    "A draft only becomes a scheduled retest once its wrong step and correct principle are written.",
    "#/errors", "Complete them");
  var counts = {};
  state.errors.forEach(function(e){ if (e.status === "open") counts[e.principle] = (counts[e.principle] || 0) + 1; });
  var repeats = Object.keys(counts).filter(function(k){ return counts[k] >= 2; });
  if (repeats.length) add("now", "Repeat pattern: " + repeats.length + " principle" + (repeats.length > 1 ? "s" : "") + " missed more than once",
    "The same principle behind two or more open entries is the highest value fix you have. It is also the office hours trigger: missed twice means take it to office hours this week.",
    "#/errors", "See the pattern");
  var dueRet = [], unfinishedNotes = [];
  COURSES.forEach(function(c){
    allTopics(c).forEach(function(x){
      if (topicRetrievalDue(c.id, x.topic.id)) dueRet.push({ c:c, t:x.topic });
      if (notesUnfinished(c.id, x.topic.id)) unfinishedNotes.push({ c:c, t:x.topic });
    });
  });
  if (dueRet.length) add("now", "Spaced retrievals due: " + dueRet.length + " topic" + (dueRet.length > 1 ? "s" : ""),
    "First due: " + dueRet[0].t.title + " (" + dueRet[0].c.name.split(":")[0] + "). Three clean spaced retrievals on separate days mark a topic learned, and a short maintenance review keeps going after that.",
    "#/retrieval/" + dueRet[0].c.id + "/" + dueRet[0].t.id, "Start the retrieval");
  if (unfinishedNotes.length) add("now", "Notes unfinished: " + unfinishedNotes.length + " topic" + (unfinishedNotes.length > 1 ? "s" : ""),
    unfinishedNotes[0].t.title + " was finished over a day ago and its Organize stage is still not done. Notes only count once they are restructured, never recopied.",
    "#/topic/" + unfinishedNotes[0].c.id + "/" + unfinishedNotes[0].t.id + "/2", "Restructure the notes");

  /* deadlines and exams, from each course file. Done deadlines are silent. */
  allEvents().forEach(function(ev){
    if (ev.kind === "prep") return;
    if (ev.kind === "deadline" && deadlineIsDone(ev.id)) return;
    var n = daysUntil(ev.date);
    if (ev.kind === "deadline") {
      var horizon = ev.weekly ? 1 : 14;
      if (n === 0) add("now", "Due today: " + ev.label, "Today, " + fmtDate(ev.date) + ".", "#/course/" + ev.cid, "Open the course");
      else if (n === 1) add("now", "Due tomorrow: " + ev.label, "Tomorrow, " + fmtDate(ev.date) + ".", "#/course/" + ev.cid, "Open the course");
      else if (n > 1 && n <= horizon) add("soon", "Coming up: " + ev.label, "In " + n + " days, " + fmtDate(ev.date) + ".", "#/course/" + ev.cid, "Open the course");
    } else if (ev.kind === "final") {
      var href = "#/final/" + ev.cid;
      if (n === 0) add("now", ev.label + " is today", "Final practice is closed now. Taper only: light retrieval, notes page, sleep.", "#/course/" + ev.cid, "Open the course");
      else if (n > 0 && n < 2) add("now", ev.label + " in " + n + " day" + (n > 1 ? "s" : ""), "No new simulations inside the last 48 hours. Light retrieval and your notes page only.", "#/course/" + ev.cid, "Open the course");
      else if (n >= 2 && n <= 5) add("soon", ev.label + " in " + n + " days: last simulation window", "The third simulation belongs about 4 to 5 days out, with a final review about 3 days before the exam. Sleep beats an all-nighter here.", href, "Run final practice");
      else if (n > 5 && n <= 10) add("soon", ev.label + " in " + n + " days: second simulation window", "The second full simulation belongs about 10 days out.", href, "Run final practice");
      else if (n > 10 && n <= 21) add("soon", ev.label + " in " + n + " days: first simulation window", "The exam cycle opens about 3 weeks out with the first full timed simulation.", href, "Run final practice");
      else if (n > 21 && n <= 35) add("soon", ev.label + " in " + n + " days", "On the calendar. The simulation cycle starts about 3 weeks out.", "#/course/" + ev.cid, "Open the course");
    }
  });

  var hour = new Date().getHours();
  if (hour >= 21 || hour < 5) add("soon", "Review a little, then sleep",
    "A short retrieval before bed consolidates the day. An all-nighter gives that work back: sleep loss impairs tomorrow's recall more than another hour of cramming helps.",
    "#/", "Back to Today");

  var freshCal = (state.calibration || []).filter(function(r){ return r.src !== "error"; });
  if (freshCal.length >= 8) {
    var over = freshCal.reduce(function(s, r){ return s + (Number(r.c) / 100 - (r.ok ? 1 : 0)); }, 0) / freshCal.length;
    if (over > 0.15) add("soon", "Confidence is ahead of accuracy",
      "Across recent answers your confidence sits about " + Math.round(over * 100) + " points above your hit rate. Slow down on the items you feel sure about.",
      "#/", "See calibration");
  }

  /* pace warnings: the clock outrunning the content */
  COURSES.forEach(function(c){
    var tp = timePct(c), cp = contentPct(c);
    if (tp !== null && tp >= 40 && tp - cp >= 25)
      add("soon", c.name.split(":")[0] + ": time is outrunning content",
        "Time to final is at " + tp + "% but content gotten through is at " + cp + "%. The gap is the plan: this course takes the bigger share until it closes.",
        "#/course/" + c.id, "Open the course");
  });

  /* the weekly loop */
  if (new Date().getDay() === 0)
    add("soon", "Today is the weekly calibration",
      "Predict each topic area first, then the 20 minute closed book test, then log predicted against actual in the calibration file. One week steers nothing; the sample is still building.",
      "#/", "Go to Today");

  return items;
}
function updateBell(){
  var b = $("bellbadge"); if (!b) return;
  var n = 0;
  try { n = computeNotifications().length; } catch(e){ n = 0; }
  b.textContent = n;
  b.classList.toggle("hidden", n === 0);
}
function renderNotifications(){
  var app = $("app");
  var items = computeNotifications();
  var now = items.filter(function(i){ return i.sev === "now"; });
  var soon = items.filter(function(i){ return i.sev === "soon"; });
  function card(i){
    return "<div class=\"card\"><h3>" + esc(i.title) + "</h3><p class=\"small\">" + esc(i.body) + "</p>"
      + "<p><a class=\"btn secondary\" href=\"" + i.href + "\">" + esc(i.cta) + "</a></p></div>";
  }
  var html = "<h1>Notifications</h1>"
    + "<p class=\"muted\">Computed fresh from your progress and the calendar every time you open the site. Nothing here is stored, and an item clears itself when you do the thing it points at.</p>";
  if (!items.length) html += "<div class=\"card\"><p style=\"margin:0\">Nothing needs you right now. No retests due, no drafts waiting, no deadline inside two weeks.</p></div>";
  if (now.length) html += "<h2>Needs attention</h2>" + now.map(card).join("");
  if (soon.length) html += "<h2>Coming up</h2>" + soon.map(card).join("");
  app.innerHTML = html;
}

/* ============================== BOOT ============================== */
loadState();
loadCourses(function(){
  collectCourses();
  var nav = $("navcourses");
  if (nav) nav.innerHTML = "<span class=\"seg-thumb\" id=\"segthumb\"></span>" + COURSES.map(function(c){ var short = c.id === "python-workshop" ? "Python" : c.name.split(":")[0].replace("MGMTMSA ", "").replace("MGMT ", ""); return "<a href=\"#/course/" + c.id + "\" data-cid=\"" + c.id + "\" data-short=\"" + esc(short) + "\" draggable=\"false\">" + esc(c.name.split(":")[0]) + "</a>"; }).join("");
  route();
  updateBell();
  var seg = $("navcourses");
  if (seg && seg.addEventListener){
    var sx = null, sy = null, sl = 0, swiped = false;
    function courseRoute(){ return /#\/(?:course|topic|examples|final|retrieval)\//.test(location.hash); }
    seg.addEventListener("click", function(e){
      if (swiped){ e.preventDefault(); e.stopPropagation(); swiped = false; }
    }, true);
    seg.addEventListener("pointerdown", function(e){ sx = e.clientX; sy = e.clientY; sl = seg.scrollLeft; swiped = false; });
    seg.addEventListener("pointercancel", function(){ sx = null; swiped = false; });
    seg.addEventListener("pointermove", function(e){
      if (sx === null || swiped) return;
      var dx = e.clientX - sx, dy = e.clientY - (sy || e.clientY);
      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      if (Math.abs(seg.scrollLeft - sl) > 2) { sx = null; return; }
      if (seg.scrollWidth > seg.clientWidth + 4) { sx = null; return; }
      if (!courseRoute()) { sx = null; return; }
      segStep(dx < 0 ? 1 : -1); swiped = true;
    });
    seg.addEventListener("pointerup", function(e){
      if (sx === null) return;
      var dx = e.clientX - sx; sx = null;
      if (swiped) return;
      if (Math.abs(dx) < 48) return;
      if (Math.abs(seg.scrollLeft - sl) > 2) return;
      if (seg.scrollWidth > seg.clientWidth + 4) return;
      if (!courseRoute()) return;
      segStep(dx < 0 ? 1 : -1); swiped = true;
    });
  }
  if (window.addEventListener) {
    window.addEventListener("resize", function(){ updateNavActive(); });
    window.addEventListener("pagehide", function(){ if (run) persistRun(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ updateNavActive(); });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
});
</script>
