    + md(entry.problem)
    + "<label class=\"flabel\">Your wrong step, and the reasoning you used</label><textarea id=\"derr-ws-" + entry.id + "\">" + esc(entry.wrongStep || "") + "</textarea>"
    + "<label class=\"flabel\">The correct principle</label><textarea id=\"derr-cp-" + entry.id + "\">" + esc(entry.correctPrinciple || "") + "</textarea>"

/* ============================== TIMED MATCH ============================== */
var matchGame = null;
var matchTick = null;
function plainText(s){
  return String(s || "").replace(/```[\s\S]*?```/g, " ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/[_#>*]/g, " ")
    .replace(/\s+/g, " ").trim();
}
function matchClip(s, n){
  s = plainText(s);
  if (s.length <= n) return s;
  return s.slice(0, n - 1).replace(/\s+\S*$/, "") + "…";
}
function collectMatchPairs(cid, tid){
  var c = courseById(cid); if (!c) return [];
  var topics = tid ? [topicById(c, tid) && topicById(c, tid).topic] : allTopics(c).map(function(x){ return x.topic; });
  topics = topics.filter(Boolean);
  var pairs = [];
  topics.forEach(function(t){
    (t.questions || []).forEach(function(q){
      if (q.type !== "mc" || !q.options || q.answer == null) return;
      pairs.push({
        id: q.id,
        tid: t.id,
        prompt: matchClip(q.prompt, 110),
        answer: matchClip(q.options[q.answer], 90),
        fullPrompt: plainText(q.prompt)
      });
    });
  });
  return pairs;
}
function renderMatch(cid, tid){
  var c = courseById(cid), app = $("app");
  if (!c){ app.innerHTML = "<p>Course not found.</p>"; return; }
  var found = tid ? topicById(c, tid) : null;
  if (tid && !found){ app.innerHTML = "<p>Topic not found.</p>"; return; }
  var pairs = collectMatchPairs(cid, tid);
  var key = tid ? tkey(cid, tid) : cid;
  var best = state.matchBests[key];
  var title = found ? found.topic.title : c.name;
  var back = found ? "#/topic/" + cid + "/" + tid + "/0" : "#/course/" + cid;
  var html = "<p><a href=\"" + back + "\">&larr; " + esc(found ? found.topic.title : c.name) + "</a></p>"
    + "<h1>Match: " + esc(title) + "</h1>"
    + "<p class=\"muted\">Race the clock. Tap a prompt, then its answer. Six pairs from this " + (found ? "topic" : "course") + ".</p>"
    + (best != null ? "<p class=\"small\">Best time: <strong>" + formatMatchTime(best) + "</strong></p>" : "")
    + (pairs.length < 4
      ? "<p class=\"err\">Need at least 4 multiple-choice questions to play Match.</p>"
      : "<p><button onclick=\"startMatchGame('" + cid + "'," + (tid ? "'" + tid + "'" : "null") + ")\">Start Match</button></p>")
    + "<div id=\"matchroot\"></div>";
  app.innerHTML = html;
}
function formatMatchTime(ms){
  var s = Math.max(0, Math.round(ms / 100) / 10);
  return s.toFixed(1) + "s";
}
function startMatchGame(cid, tid){
  var pairs = shuffle(collectMatchPairs(cid, tid)).slice(0, 6);
  if (pairs.length < 2) return;
  var tiles = [];
  pairs.forEach(function(p){
    tiles.push({ pair: p.id, kind: "prompt", text: p.prompt, title: p.fullPrompt });
    tiles.push({ pair: p.id, kind: "answer", text: p.answer, title: p.answer });
  });
  matchGame = {
    cid: cid, tid: tid, key: tid ? tkey(cid, tid) : cid,
    tiles: shuffle(tiles), selected: -1, matched: {},
    startedAt: 0, finished: false, wrongFlash: null
  };
  if (matchTick){ clearInterval(matchTick); matchTick = null; }
  paintMatch();
}
function paintMatch(){
  var root = $("matchroot"); if (!root || !matchGame) return;
  var g = matchGame;
  var elapsed = g.startedAt ? (Date.now() - g.startedAt) : 0;
  var left = g.tiles.filter(function(t){ return !g.matched[t.pair]; }).length / 2;
  var html = "<div class=\"card\"><div class=\"matchbar\">"
    + "<span class=\"mtime\" id=\"matchclock\">" + (g.startedAt ? formatMatchTime(elapsed) : "0.0s") + "</span>"
    + "<span class=\"small muted\">" + (g.finished ? "Done" : left + " pair" + (left === 1 ? "" : "s") + " left") + "</span>"
    + "</div><div class=\"matchgrid\">";
  g.tiles.forEach(function(tile, i){
    if (g.matched[tile.pair]){
      html += "<button type=\"button\" class=\"matchtile ok\" disabled>" + esc(tile.text) + "</button>";
      return;
    }
    var cls = "matchtile" + (tile.kind === "prompt" ? " prompt" : "")
      + (g.selected === i ? " sel" : "")
      + (g.wrongFlash && (g.wrongFlash[0] === i || g.wrongFlash[1] === i) ? " bad" : "");
    html += "<button type=\"button\" class=\"" + cls + "\" title=\"" + esc(tile.title || tile.text) + "\" onclick=\"matchTap(" + i + ")\">"
      + esc(tile.text) + "</button>";
  });
  html += "</div>";
  if (g.finished){
    var best = state.matchBests[g.key];
    html += "<p class=\"okmsg\">Cleared in " + formatMatchTime(elapsed)
      + (best != null && best < elapsed ? ". Best remains " + formatMatchTime(best) + "." : ".")
      + "</p><p><button onclick=\"startMatchGame('" + g.cid + "'," + (g.tid ? "'" + g.tid + "'" : "null") + ")\">Play again</button> "
      + "<a class=\"btn secondary\" href=\"#/course/" + g.cid + "\">Back to course</a></p>";
  }
  html += "</div>";
  root.innerHTML = html;
}
function matchTap(i){
  var g = matchGame; if (!g || g.finished) return;
  if (!g.startedAt){
    g.startedAt = Date.now();
    matchTick = setInterval(function(){
      var clock = $("matchclock");
      if (!matchGame || matchGame.finished){ clearInterval(matchTick); matchTick = null; return; }
      if (clock) clock.textContent = formatMatchTime(Date.now() - matchGame.startedAt);
    }, 100);
  }
  if (g.matched[g.tiles[i].pair]) return;
  if (g.selected < 0){ g.selected = i; paintMatch(); return; }
  if (g.selected === i){ g.selected = -1; paintMatch(); return; }
  var a = g.tiles[g.selected], b = g.tiles[i];
  if (a.pair === b.pair && a.kind !== b.kind){
    g.matched[a.pair] = true;
    g.selected = -1;
    g.wrongFlash = null;
    var remaining = g.tiles.some(function(t){ return !g.matched[t.pair]; });
    if (!remaining){
      g.finished = true;
      var elapsed = Date.now() - g.startedAt;
      if (matchTick){ clearInterval(matchTick); matchTick = null; }
      var prev = state.matchBests[g.key];
      if (prev == null || elapsed < prev){ state.matchBests[g.key] = elapsed; saveState(); }
    }
    paintMatch();
    return;
  }
  g.wrongFlash = [g.selected, i];
  g.selected = -1;
  paintMatch();
  setTimeout(function(){
    if (!matchGame) return;
    matchGame.wrongFlash = null;
    paintMatch();
  }, 450);
}

/* Handwritten pages, drawn with Apple Pencil (or mouse, or finger).

var NB_W = 1200, NB_H = 1560, NB_SS = 2;

function nbPages(){ if (!state.notebooks) state.notebooks = []; return state.notebooks; }
function nbPage(id){ return nbPages().filter(function(p){ return p.id === id; })[0] || null; }
function createNotebookPage(cid, tid){

function nbPos(e){
  var r = NB.canvas.getBoundingClientRect();
  return [ Math.round((e.clientX - r.left) * (NB_W / r.width) * 10) / 10,
           Math.round((e.clientY - r.top) * (NB_H / r.height) * 10) / 10,
           Math.round((e.pressure || 0.5) * 100) / 100 ];
}
function nbAccept(e){
  if (e.pointerType === "pen"){ NB.penSeen = true; return true; }
  if (e.pointerType === "touch"){ var t = $("nbpencilonly"); return !(t && t.checked); }
  return true;
}
function nbDown(e){
  if (!NB || !nbAccept(e)) return;
  e.preventDefault();
  if (NB.canvas.setPointerCapture && e.pointerId != null){ try { NB.canvas.setPointerCapture(e.pointerId); } catch(err){} }
  var pt = nbPos(e);
  if (NB.tool === "eraser"){ nbEraseAt(pt[0], pt[1]); NB.drawing = true; return; }
  NB.drawing = true;
  NB.cur = { c: NB.color, w: NB.width, pts: [pt] };
}
function nbMove(e){
  if (!NB || !NB.drawing) return;
  e.preventDefault();
  var evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (NB.tool === "eraser"){ var p0 = nbPos(e); nbEraseAt(p0[0], p0[1]); return; }
  if (!NB.cur) return;
  for (var i = 0; i < evts.length; i++) NB.cur.pts.push(nbPos(evts[i]));
  nbDraw();
}
function nbUp(e){
  if (!NB) return;
  if (NB.drawing && NB.tool === "pen" && NB.cur && NB.cur.pts.length){
    var p = nbPage(NB.id); if (!p){ NB.drawing = false; NB.cur = null; return; }
    p.strokes.push(NB.cur);
    NB.undo.push({ type:"add", stroke:NB.cur });
    NB.redo = [];
    p.updated = new Date().toISOString();
    saveState(); nbStatus(p);
  }
  NB.drawing = false; NB.cur = null;
  nbDraw();
}
function nbEraseAt(x, y){
  var p = nbPage(NB.id); if (!p) return;
  for (var i = p.strokes.length - 1; i >= 0; i--){
    var s = p.strokes[i], hit = false;
    for (var j = 0; j < s.pts.length && !hit; j++){
      var dx = s.pts[j][0] - x, dy = s.pts[j][1] - y;
      if (dx * dx + dy * dy < 400) hit = true;
    }
    if (hit){
      p.strokes.splice(i, 1);
      NB.undo.push({ type:"erase", stroke:s, idx:i });
      NB.redo = [];
      p.updated = new Date().toISOString();
      saveState(); nbStatus(p); nbDraw();
      return;
    }
  }
}
function nbUndo(){
  var p = nbPage(NB.id); if (!p || !NB.undo.length) return;
  var a = NB.undo.pop();
  if (a.type === "add"){ var i = p.strokes.indexOf(a.stroke); if (i >= 0) p.strokes.splice(i, 1); }
  else if (a.type === "erase"){ p.strokes.splice(Math.min(a.idx, p.strokes.length), 0, a.stroke); }
  else if (a.type === "clear"){ p.strokes = a.strokes; }
  NB.redo.push(a); p.updated = new Date().toISOString(); saveState(); nbStatus(p); nbDraw();
}
function nbRedo(){
  var p = nbPage(NB.id); if (!p || !NB.redo.length) return;
  var a = NB.redo.pop();
  if (a.type === "add"){ p.strokes.push(a.stroke); }
  else if (a.type === "erase"){ var i = p.strokes.indexOf(a.stroke); if (i >= 0) p.strokes.splice(i, 1); }
  else if (a.type === "clear"){ p.strokes = []; }
  NB.undo.push(a); p.updated = new Date().toISOString(); saveState(); nbStatus(p); nbDraw();
}
function nbClear(){
  var p = nbPage(NB.id); if (!p || !p.strokes.length) return;
  if (!confirm("Clear all ink on this page? Undo can bring it back in this session.")) return;
  NB.undo.push({ type:"clear", strokes:p.strokes });
  NB.redo = [];
  p.strokes = [];
  p.updated = new Date().toISOString(); saveState(); nbStatus(p); nbDraw();
}
function nbStatus(p){ var s = $("nbstatus"); if (s) s.textContent = p.strokes.length + " strokes. Ink saves automatically as you write."; }
function nbDrawSheet(ctx, p, scale){
  ctx.fillStyle = "#fffdf8";
  ctx.fillRect(0, 0, NB_W, NB_H);
  ctx.strokeStyle = "#ddd3ba";
  ctx.lineWidth = 1.5;
  if (p.bg === "ruled" || p.bg === "grid"){
    ctx.beginPath();
    for (var y = 96; y < NB_H; y += 48){ ctx.moveTo(0, y); ctx.lineTo(NB_W, y); }
    ctx.stroke();
  }
  if (p.bg === "grid"){
    ctx.beginPath();
    for (var x = 48; x < NB_W; x += 48){ ctx.moveTo(x, 0); ctx.lineTo(x, NB_H); }
    ctx.stroke();
  }
  p.strokes.forEach(function(s){ nbDrawStroke(ctx, s); });
  if (NB && NB.cur) nbDrawStroke(ctx, NB.cur);
}
function nbDrawStroke(ctx, s){
  if (!s.pts.length) return;
  ctx.strokeStyle = s.c;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (s.pts.length === 1){
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.pts[0][0], s.pts[0][1], s.w * (s.pts[0][2] || 0.5) / 1.4, 0, 7); ctx.fill();
    return;
  }
  for (var i = 1; i < s.pts.length; i++){
    var a = s.pts[i - 1], b = s.pts[i];
    ctx.lineWidth = Math.max(1, s.w * (((a[2] || 0.5) + (b[2] || 0.5)) / 2) * 1.6);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
}
function nbDraw(){
  if (!NB || !NB.ctx) return;
  var p = nbPage(NB.id); if (!p) return;
  var ctx = NB.ctx;
  ctx.setTransform(NB_SS, 0, 0, NB_SS, 0, 0);
  nbDrawSheet(ctx, p, NB_SS);
}
function exportNotebookPng(id){
  var p = nbPage(id); if (!p) return;
  var cv = document.createElement("canvas");
  cv.width = NB_W * 2; cv.height = NB_H * 2;
  var ctx = cv.getContext("2d");
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  var keep = NB ? NB.cur : null; if (NB) NB.cur = null;
  nbDrawSheet(ctx, p, 2);
  if (NB) NB.cur = keep;
  var a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  a.download = p.title.replace(/[^a-z0-9]+/gi, "-").slice(0, 60) + ".png";
  a.click();
}

/* ============================== NOTIFICATIONS ============================== */
/* Everything here is computed live from your saved state and the calendar:
   nothing is stored, and an item disappears when you clear what caused it. */
var SITE_DEADLINES = [
  { date:"2026-11-01", label:"MGMT 440 Quiz #1 due (11:59pm PT)", cid:"mgmt-440" },
  { date:"2026-11-08", label:"MGMT 440 Product Critique due (11:59pm PT)", cid:"mgmt-440" },
  { date:"2026-11-15", label:"MGMT 440 Metrics Exercise due (11:59pm PT)", cid:"mgmt-440" },
  { date:"2026-11-18", label:"MGMTMSA 401 Homework 1 due (11:59pm PT)", cid:"mgmtmsa-401" },
  { date:"2026-11-22", label:"MGMTMSA 400 Assignment 3 due", cid:"mgmtmsa-400" },
  { date:"2026-11-22", label:"MGMT 440 Quiz #2 due (11:59pm PT)", cid:"mgmt-440" },
  { date:"2026-12-02", label:"MGMTMSA 401 Homework 2 due (11:59pm PT)", cid:"mgmtmsa-401" },
  { date:"2026-12-03", label:"MGMT 440 Final Presentation (in class)", cid:"mgmt-440" },
  { date:"2026-12-04", label:"MGMTMSA 400 Assignment 4 due", cid:"mgmtmsa-400" }
];
var SITE_FINALS = [
  { cid:"mgmtmsa-402", label:"MGMTMSA 402 Final", date:"2026-12-07" },
  { cid:"mgmtmsa-400", label:"MGMTMSA 400 Final", date:"2026-12-08" },
  { cid:"mgmtmsa-401", label:"MGMTMSA 401 Final", date:"2026-12-09" }
];
function daysUntil(dateStr){
  var a = new Date(todayStr() + "T12:00:00"), b = new Date(dateStr + "T12:00:00");
  return Math.round((b - a) / 86400000);
}
function fmtDate(dateStr){
  return new Date(dateStr + "T12:00:00").toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}
function computeNotifications(){
  var items = [];
  function add(sev, title, body, href, cta){ items.push({ sev:sev, title:title, body:body, href:href, cta:cta }); }

  /* your own system state */
  var dueErr = sortedDueErrors();
  if (dueErr.length) add("now", "Error retests due: " + dueErr.length,
    "Missed questions whose spaced retest date has arrived. A retest always serves a fresh question, never the same one.",
    "#/errors", "Open the Error Log");
  var drafts = state.errors.filter(function(e){ return e.status === "draft"; });
  if (drafts.length) add("now", drafts.length + " error draft" + (drafts.length > 1 ? "s" : "") + " unfinished",
    "A draft only becomes a scheduled retest once its wrong step and correct principle are written.",
    "#/errors", "Complete them");
  var counts = {};
  state.errors.forEach(function(e){ if (e.status === "open") counts[e.principle] = (counts[e.principle] || 0) + 1; });
  var repeats = Object.keys(counts).filter(function(k){ return counts[k] >= 2; });
  if (repeats.length) add("now", "Repeat pattern: " + repeats.length + " principle" + (repeats.length > 1 ? "s" : "") + " missed more than once",
    "The same principle behind two or more open entries is the highest value fix you have. It is also the office hours trigger: missed twice means take it to office hours this week.",
    "#/errors", "See the pattern");
  var dueRet = [], unfinishedNotes = [];
  COURSES.forEach(function(c){
    allTopics(c).forEach(function(x){
      if (topicRetrievalDue(c.id, x.topic.id)) dueRet.push({ c:c, t:x.topic });
      if (notesUnfinished(c.id, x.topic.id)) unfinishedNotes.push({ c:c, t:x.topic });
    });
  });
  if (dueRet.length) add("now", "Spaced retrievals due: " + dueRet.length + " topic" + (dueRet.length > 1 ? "s" : ""),
    "First due: " + dueRet[0].t.title + " (" + dueRet[0].c.name.split(":")[0] + "). Three clean spaced retrievals on separate days is what marks a topic learned.",
    "#/retrieval/" + dueRet[0].c.id + "/" + dueRet[0].t.id, "Start the retrieval");
  if (unfinishedNotes.length) add("now", "Notes unfinished: " + unfinishedNotes.length + " topic" + (unfinishedNotes.length > 1 ? "s" : ""),
    unfinishedNotes[0].t.title + " was finished over a day ago and its Organize stage is still not done. Notes only count once they are restructured, never recopied.",
    "#/topic/" + unfinishedNotes[0].c.id + "/" + unfinishedNotes[0].t.id + "/2", "Restructure the notes");

  /* deadlines and exams */
  SITE_DEADLINES.forEach(function(d){
    var n = daysUntil(d.date);
    if (n === 0) add("now", "Due today: " + d.label, "Today, " + fmtDate(d.date) + ".", "#/course/" + d.cid, "Open the course");
    else if (n === 1) add("now", "Due tomorrow: " + d.label, "Tomorrow, " + fmtDate(d.date) + ".", "#/course/" + d.cid, "Open the course");
    else if (n > 1 && n <= 14) add("soon", "Coming up: " + d.label, "In " + n + " days, " + fmtDate(d.date) + ".", "#/course/" + d.cid, "Open the course");
  });
  SITE_FINALS.forEach(function(f){
    var n = daysUntil(f.date);
    var href = "#/final/" + f.cid;
    if (n === 0) add("now", f.label + " is today", "Final practice is closed now. Taper only: light retrieval, notes page, sleep.", "#/course/" + f.cid, "Open the course");
    else if (n > 0 && n < 2) add("now", f.label + " in " + n + " day" + (n > 1 ? "s" : ""), "No new simulations inside the last 48 hours. Light retrieval and your notes page only.", "#/course/" + f.cid, "Open the course");
    else if (n >= 2 && n <= 5) add("soon", f.label + " in " + n + " days: last simulation window", "The third simulation belongs about 4 to 5 days out, scored on content, pacing, and execution, with its debrief inside 48 hours.", href, "Run final practice");
    else if (n > 5 && n <= 10) add("soon", f.label + " in " + n + " days: second simulation window", "The second full simulation belongs about 10 days out.", href, "Run final practice");
    else if (n > 10 && n <= 21) add("soon", f.label + " in " + n + " days: first simulation window", "The exam cycle opens about 3 weeks out with the first full timed simulation.", href, "Run final practice");
    else if (n > 21 && n <= 35) add("soon", f.label + " in " + n + " days", "On the calendar. The simulation cycle starts about 3 weeks out.", "#/course/" + f.cid, "Open the course");
  });
  /* Python weekly cadence: lab Mondays 12:00pm PT, quizzes Tuesdays 11:59pm PT */
  var dow = new Date().getDay();
  var toMon = (8 - dow) % 7, toTue = (9 - dow) % 7;
  if (toMon <= 1) add(toMon === 0 ? "now" : "soon", "Python Workshop lab due " + (toMon === 0 ? "today" : "tomorrow") + " (Mon 12:00pm PT)", "Weekly lab notebook deadline.", "#/course/python-workshop", "Open the course");
  if (toTue <= 1) add(toTue === 0 ? "now" : "soon", "Python Workshop chapter quiz due " + (toTue === 0 ? "today" : "tomorrow") + " (Tue 11:59pm PT)", "Weekly chapter quiz deadline.", "#/course/python-workshop", "Open the course");

  /* pace warnings: the clock outrunning the content */
  COURSES.forEach(function(c){
    var tp = timePct(c), cp = contentPct(c);
    if (tp !== null && tp >= 40 && tp - cp >= 25)
      add("soon", c.name.split(":")[0] + ": time is outrunning content",
        "Time to final is at " + tp + "% but content gotten through is at " + cp + "%. The gap is the plan: this course takes the bigger share until it closes.",
        "#/course/" + c.id, "Open the course");
  });

  /* the weekly loop */
  if (new Date().getDay() === 0)
    add("soon", "Today is the weekly calibration",
      "Predict each topic area first, then the 20 minute closed book test, then log predicted against actual in the calibration file. One week steers nothing; the sample is still building.",
      "#/", "Go to Today");

  return items;
}
function updateBell(){
  var b = $("bellbadge"); if (!b) return;
  var n = 0;
  try { n = computeNotifications().length; } catch(e){ n = 0; }
  b.textContent = n;
  b.classList.toggle("hidden", n === 0);
}
function renderNotifications(){
  var app = $("app");
  var items = computeNotifications();
  var now = items.filter(function(i){ return i.sev === "now"; });
  var soon = items.filter(function(i){ return i.sev === "soon"; });
  function card(i){
    return "<div class=\"card\"><h3>" + esc(i.title) + "</h3><p class=\"small\">" + esc(i.body) + "</p>"
      + "<p><a class=\"btn secondary\" href=\"" + i.href + "\">" + esc(i.cta) + "</a></p></div>";
  }
  var html = "<h1>Notifications</h1>"
    + "<p class=\"muted\">Computed fresh from your progress and the calendar every time you open the site. Nothing here is stored, and an item clears itself when you do the thing it points at.</p>";
  if (!items.length) html += "<div class=\"card\"><p style=\"margin:0\">Nothing needs you right now. No retests due, no drafts waiting, no deadline inside two weeks.</p></div>";
  if (now.length) html += "<h2>Needs attention</h2>" + now.map(card).join("");
  if (soon.length) html += "<h2>Coming up</h2>" + soon.map(card).join("");
  app.innerHTML = html;
}

  collectCourses();

  if (nav) nav.innerHTML = "<span class=\"seg-thumb\" id=\"segthumb\"></span>" + COURSES.map(function(c){ var short = c.id === "python-workshop" ? "Python" : c.name.split(":")[0].replace("MGMTMSA ", "").replace("MGMT ", ""); return "<a href=\"#/course/" + c.id + "\" data-cid=\"" + c.id + "\" data-short=\"" + esc(short) + "\" draggable=\"false\">" + esc(c.name.split(":")[0]) + "</a>"; }).join("");
  route();
  updateBell();
  var seg = $("navcourses");
  if (seg && seg.addEventListener){
    var sx = null, swiped = false;
    seg.addEventListener("click", function(e){
      if (swiped){ e.preventDefault(); e.stopPropagation(); swiped = false; }
    }, true);
    seg.addEventListener("pointerdown", function(e){ sx = e.clientX; swiped = false; });
    seg.addEventListener("pointercancel", function(){ sx = null; swiped = false; });
    seg.addEventListener("pointermove", function(e){
      if (sx === null || swiped) return;
      var dx = e.clientX - sx;
      if (Math.abs(dx) >= 40){ segStep(dx < 0 ? 1 : -1); swiped = true; }
    });
    seg.addEventListener("pointerup", function(e){
      if (sx === null) return;
      var dx = e.clientX - sx; sx = null;
      if (!swiped && Math.abs(dx) >= 40){ segStep(dx < 0 ? 1 : -1); swiped = true; }
    });
  }
  if (window.addEventListener) window.addEventListener("resize", function(){ updateNavActive(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ updateNavActive(); });
});
