# Regenerates files/<course-id>/index.json when library files change.
# A push made by this workflow does not start another run (GITHUB_TOKEN),
# and the commit message skips the job if a run is ever created anyway.
name: File library manifests

on:
  push:
    branches: [main]
    paths:
      - "files/**"
      - "scripts/build-file-manifests.js"
      - "courses/registry.js"
      - ".github/workflows/file-manifests.yml"

permissions:
  contents: write

jobs:
  manifests:
    if: ${{ !contains(github.event.head_commit.message, '[skip manifests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-file-manifests.js
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files
          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi
          git commit -m "Regenerate file library manifests [skip manifests]"
          git push
